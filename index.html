<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DEAD ZONE — Zombie Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace;
  user-select: none; -webkit-user-select: none; touch-action: none;
  -webkit-touch-callout: none; position: fixed; width: 100%; height: 100%;
}
body.desktop { cursor: crosshair; }
canvas#game { display: block; position: fixed; top: 0; left: 0; outline: none; z-index: 1; }

#top-hud { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 20; pointer-events: none; text-shadow: 1px 1px 3px #000; }
#top-hud .score { font-size: 16px; font-weight: bold; color: #fff; }
#top-hud .wave { color: #f04040; font-size: 11px; }
#top-hud .kills { color: #aaa; font-size: 10px; }

#health-hud { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); width: 120px; z-index: 20; pointer-events: none; }
#health-hud .bar-bg { width: 100%; height: 6px; background: #333; border: 1px solid #555; border-radius: 3px; }
#health-hud .bar { height: 100%; background: #4f4; border-radius: 3px; transition: width 0.2s, background 0.2s; }
#health-hud .hp-text { color: #aaa; font-size: 10px; text-align: center; margin-top: 2px; text-shadow: 1px 1px 2px #000; }

#ammo-hud { position: fixed; z-index: 20; pointer-events: none; text-shadow: 1px 1px 2px #000; text-align: center; }
body.desktop #ammo-hud { bottom: 20px; left: 20px; text-align: left; }
body.mobile #ammo-hud { bottom: calc(66px + env(safe-area-inset-bottom)); right: calc(6px + env(safe-area-inset-right)); left: auto; transform: none; text-align: right; }
#ammo-hud .weapon-name { font-size: 14px; font-weight: bold; color: #f0c040; text-transform: uppercase; letter-spacing: 1px; }
#ammo-hud .ammo { font-size: 22px; font-weight: bold; color: #fff; }
#ammo-hud .ammo .slash { color: #666; font-size: 14px; }
#ammo-hud .ammo .reserve { color: #999; font-size: 14px; }
#ammo-hud .ammo.reloading { color: #f04040; font-size: 16px; }

#weapon-slots { position: fixed; z-index: 25; display: flex; gap: 3px; }
body.desktop #weapon-slots { bottom: 70px; left: 20px; flex-direction: row; pointer-events: none; }
body.mobile #weapon-slots { bottom: calc(16px + env(safe-area-inset-bottom)); right: calc(8px + env(safe-area-inset-right) * 0.5); left: auto; transform: none; flex-direction: row; }
.weapon-slot { width: 48px; height: 48px; border: 2px solid #444; border-radius: 8px; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; font-size: 9px; color: #888; text-align: center; line-height: 1.1; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.08s; }
.weapon-slot:active { transform: scale(1.15); }
body.mobile .weapon-slot { width: 46px; height: 46px; font-size: 9px; }
.weapon-slot.active { border-color: #f0c040; color: #f0c040; background: rgba(240,192,64,0.15); }
.weapon-slot .key { position: absolute; top: 1px; left: 3px; font-size: 7px; color: #666; }
.weapon-slot.active .key { color: #f0c040; }
body.mobile .weapon-slot .key { display: none; }

.joystick-zone { position: fixed; bottom: 0; width: 50%; height: 100%; z-index: 15; display: none; }
body.mobile .joystick-zone { display: block; }
#joystick-left { left: 0; }
#joystick-right { right: 0; }

#mobile-buttons { position: fixed; z-index: 25; display: none; }
body.mobile #mobile-buttons { display: flex; flex-direction: column; gap: 8px; right: calc(8px + env(safe-area-inset-right) * 0.5); bottom: calc(160px + env(safe-area-inset-bottom)); }
.mobile-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #555; background: rgba(0,0,0,0.7); color: #aaa; font-size: 10px; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: center; line-height: 1.1; }
.mobile-btn { transition: transform 0.08s; }
.mobile-btn:active, .mobile-btn.pressed { background: rgba(255,255,255,0.2); border-color: #fff; color: #fff; transform: scale(1.15); }
.mobile-btn.dash-ready { border-color: #4af; color: #4af; }
.mobile-btn.dash-cooldown { border-color: #333; color: #444; }
.mobile-btn.reload-btn { border-color: #a7f; color: #a7f; }

#minimap { position: fixed; top: 10px; left: 10px; width: 90px; height: 90px; border: 1px solid #333; background: rgba(0,0,0,0.5); z-index: 20; pointer-events: none; }
body.desktop #minimap { width: 130px; height: 130px; }

/* ---- Screen overlays ---- */
.screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; touch-action: manipulation; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
.screen-overlay h1 { font-size: clamp(36px, 10vw, 72px); color: #f04040; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 0 30px rgba(240,64,64,0.5); }
.screen-overlay .subtitle { color: #888; font-size: clamp(12px, 3vw, 18px); letter-spacing: 3px; margin-bottom: 40px; }
.screen-overlay .stats { color: #aaa; font-size: 15px; margin-bottom: 20px; line-height: 2; text-align: center; }
.screen-overlay .stats .val { color: #fff; font-weight: bold; }
.screen-overlay .highscore { color: #f0c040; font-size: 13px; margin-top: 8px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ---- Menu buttons ---- */
.menu-btn {
  display: inline-block; padding: 14px 36px; margin: 8px;
  font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold;
  color: #fff; background: rgba(255,255,255,0.08); border: 2px solid #555;
  cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
  -webkit-tap-highlight-color: transparent; transition: background 0.15s, border-color 0.15s;
}
.menu-btn:hover { background: rgba(255,255,255,0.15); border-color: #aaa; }
.menu-btn:active, .menu-btn.tapped { transform: scale(0.92); background: rgba(255,255,255,0.2); border-color: #ccc; }
.menu-btn { touch-action: manipulation; transition: transform 0.1s, background 0.1s, border-color 0.1s; }
.menu-btn.primary { border-color: #f0c040; color: #f0c040; }
.menu-btn.primary:hover { background: rgba(240,192,64,0.15); }
.menu-btn.danger { border-color: #f04040; color: #f04040; }

.menu-input {
  padding: 10px 16px; margin: 6px; font-family: 'Courier New', monospace; font-size: 18px;
  color: #fff; background: rgba(255,255,255,0.06); border: 2px solid #555;
  text-align: center; letter-spacing: 4px; text-transform: uppercase; outline: none; width: 200px;
}
.menu-input:focus { border-color: #f0c040; }
.menu-input::placeholder { color: #444; letter-spacing: 1px; text-transform: none; }
.menu-input { touch-action: manipulation; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; -webkit-appearance: none; }

.menu-label { color: #888; font-size: 12px; margin-top: 12px; margin-bottom: 4px; }
.menu-error { color: #f44; font-size: 13px; margin-top: 8px; min-height: 18px; }
.menu-info { color: #aaa; font-size: 13px; margin-top: 6px; }

/* Lobby */
.lobby-code { font-size: 48px; color: #f0c040; letter-spacing: 12px; font-weight: bold; margin: 16px 0; text-shadow: 0 0 20px rgba(240,192,64,0.3); }
.lobby-players { list-style: none; margin: 16px 0; }
.lobby-players li { font-size: 16px; color: #ccc; padding: 6px 0; display: flex; align-items: center; gap: 10px; justify-content: center; }
.lobby-players .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.lobby-players .host-tag { color: #f0c040; font-size: 11px; }
.lobby-waiting { color: #666; font-size: 14px; animation: pulse 1.5s ease-in-out infinite; margin-top: 12px; }

#wave-announce { position: fixed; top: 30%; width: 100%; text-align: center; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#wave-announce .wave-num { font-size: clamp(36px, 8vw, 64px); color: #f04040; font-weight: bold; text-shadow: 0 0 20px rgba(240,64,64,0.5); }
#wave-announce .wave-sub { font-size: clamp(12px, 3vw, 18px); color: #999; margin-top: 6px; }
#pickup-msg { position: fixed; top: 55%; width: 100%; text-align: center; z-index: 30; pointer-events: none; font-size: 16px; color: #4f4; opacity: 0; text-shadow: 0 0 10px rgba(64,255,64,0.4); }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<canvas id="minimap"></canvas>

<div id="top-hud"><div class="score" id="score">0</div><div class="wave" id="wave-display">WAVE 1</div><div class="kills" id="kills-display">0 KILLS</div></div>
<div id="health-hud"><div class="bar-bg"><div class="bar" id="health-bar"></div></div><div class="hp-text" id="health-text">100 HP</div></div>
<div id="ammo-hud"><div class="weapon-name" id="weapon-name">PISTOL</div><div class="ammo" id="ammo-display">12 <span class="slash">/</span> <span class="reserve">∞</span></div></div>
<div id="weapon-slots"></div>
<div id="mobile-buttons">
  <div class="mobile-btn dash-ready" id="btn-dash">DASH</div>
  <div class="mobile-btn reload-btn" id="btn-reload">RLD</div>
</div>
<div class="joystick-zone" id="joystick-left"></div>
<div class="joystick-zone" id="joystick-right"></div>
<div id="wave-announce"><div class="wave-num" id="wave-num"></div><div class="wave-sub" id="wave-sub"></div></div>
<div id="pickup-msg"></div>
<button id="btn-menu" style="position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:25;background:rgba(0,0,0,0.6);border:2px solid #555;color:#aaa;font-family:'Courier New',monospace;font-size:11px;padding:6px 12px;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:4px;">MENU</button>

<!-- ---- MAIN MENU ---- -->
<div class="screen-overlay" id="start-screen">
  <h1>DEAD ZONE</h1>
  <div class="subtitle">ZOMBIE SHOOTER</div>
  <div style="margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px">
    <button class="menu-btn primary" id="btn-solo">SOLO</button>
    <button class="menu-btn" id="btn-multi">MULTIPLAYER</button>
  </div>
  <div style="color:#666;font-size:11px;margin-top:30px" id="start-controls"></div>
</div>

<!-- ---- MULTIPLAYER MENU ---- -->
<div class="screen-overlay" id="multi-screen" style="display:none">
  <h1 style="font-size:clamp(24px,6vw,48px)">MULTIPLAYER</h1>
  <div class="menu-label">YOUR NAME</div>
  <input class="menu-input" id="name-input" placeholder="Name" maxlength="16" value="">
  <div style="margin-top:20px">
    <button class="menu-btn primary" id="btn-create">CREATE LOBBY</button>
  </div>
  <div class="menu-label" style="margin-top:24px">OR JOIN WITH CODE</div>
  <input class="menu-input" id="code-input" placeholder="CODE" maxlength="4">
  <div style="margin-top:8px">
    <button class="menu-btn" id="btn-join">JOIN</button>
  </div>
  <div class="menu-error" id="multi-error"></div>
  <button class="menu-btn danger" id="btn-back-main" style="margin-top:24px;font-size:12px;padding:8px 20px">BACK</button>
</div>

<!-- ---- LOBBY SCREEN ---- -->
<div class="screen-overlay" id="lobby-screen" style="display:none">
  <div style="color:#888;font-size:14px">LOBBY CODE</div>
  <div class="lobby-code" id="lobby-code">----</div>
  <div style="color:#666;font-size:11px">Share this code with friends</div>
  <ul class="lobby-players" id="lobby-players"></ul>
  <button class="menu-btn primary" id="btn-start-game" style="display:none">START GAME</button>
  <div class="lobby-waiting" id="lobby-waiting">Waiting for host to start...</div>
  <button class="menu-btn danger" id="btn-leave" style="margin-top:16px;font-size:12px;padding:8px 20px">LEAVE</button>
</div>

<!-- ---- DEATH SCREEN ---- -->
<div class="screen-overlay" id="death-screen" style="display:none">
  <h1>DEAD</h1>
  <div class="stats" id="death-stats"></div>
  <button class="menu-btn primary" id="btn-restart">PLAY AGAIN</button>
  <div class="highscore" id="highscore-display"></div>
</div>

<script>
// ============================================================
// DEAD ZONE — Multiplayer Top-Down Zombie Shooter
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');

const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) && 'ontouchstart' in window;
document.body.classList.add(isMobile ? 'mobile' : 'desktop');

const controlsEl = document.getElementById('start-controls');
if (!isMobile) controlsEl.innerHTML = '<span style="color:#999">WASD</span> Move <span style="color:#999">MOUSE</span> Aim <span style="color:#999">CLICK</span> Shoot <span style="color:#999">R</span> Reload <span style="color:#999">SPACE</span> Dash <span style="color:#999">E</span> Pickup <span style="color:#999">1-0</span> Weapons';
else controlsEl.innerHTML = 'Left thumb: Move | Right thumb: Aim+Shoot';

// ---- CONSTANTS ----
const ARENA_W = 3600, ARENA_H = 3600, CELL_SIZE = 40;
const GRID_W = Math.floor(ARENA_W / CELL_SIZE), GRID_H = Math.floor(ARENA_H / CELL_SIZE);
const TILE_SIZE = 80, PLAYER_RADIUS = 14;
const DASH_COOLDOWN = 800, DASH_DURATION = 120, DASH_SPEED = 14;
const PICKUP_RANGE = 50, JOYSTICK_LEFT_MAX = 65, JOYSTICK_RIGHT_MAX = 130;
const PLAYER_COLORS = ['#4af','#f44','#4f4','#fa4'];
const NET_SEND_RATE = 3; // send state every N frames (~20fps)
const MAX_WEAPONS = 3; // player can only carry 3 guns at a time

// ---- GAME STATE ----
let gameState = 'menu'; // menu, multi_menu, lobby, playing, dead
let score = 0, kills = 0;
let level = 1, exitPos = null, spawnTimer = 0;
let highScore = parseInt(localStorage.getItem('deadzone_highscore') || '0');
let screenShake = { x: 0, y: 0, intensity: 0, decay: 0.9 };
let gameTime = 0;

// ---- MULTIPLAYER STATE ----
let ws = null;
let myId = null;
let isHost = false;
let lobbyCode = '';
let lobbySeed = 0;
let lobbyPlayers = []; // { id, name, color }
let isMultiplayer = false;
let remoteInputs = {}; // id -> { dx, dy, angle, firing, dash, reload, weapon }

// ---- INPUT ----
const keys = {};
let mouse = { x: 0, y: 0, down: false, worldX: 0, worldY: 0 };
let leftJoystick = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0, nx: 0, ny: 0 };
let rightJoystick = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0, nx: 0, ny: 0, aiming: false, firing: false };

// ---- CAMERA ----
let camera = { x: 0, y: 0 };
let cameraOffset = { x: 0, y: 0 }; // smooth aim-look-ahead offset
let aimLineAlpha = 0; // smooth fade for aim line visibility

// ---- PLAYERS (multiplayer array) ----
let players = []; // array of player objects; index 0 is always local in solo
let localPlayerIdx = 0;

function getLocalPlayer() { return players[localPlayerIdx]; }

function createPlayerObj(id, name, color, x, y) {
  return {
    id, name, color, x, y, vx: 0, vy: 0, angle: 0,
    hp: 100, maxHp: 100, speed: 4.5,
    weapons: [createWeapon('pistol')], currentWeapon: 0,
    dashCooldown: 0, dashTimer: 0, dashAngle: 0,
    invincible: 0, damageFlash: 0, alive: true,
    burstLeft: 0, burstTimer: 0,
    moveAngle: 0,
    reviveProgress: 0, reviveTime: 360, // 6 seconds at 60fps
  };
}

// ---- WEAPONS ----
const WEAPON_DEFS = {
  // Pistol: reliable sidearm, infinite ammo, short aim line
  pistol: { name: 'Pistol', color: '#ccc', bulletColor: '#ff0', damage: 25, fireRate: 250, bulletSpeed: 14, spread: 0.04, magSize: 12, reloadTime: 600, bulletSize: 3, knockback: 2, pierce: 0, infinite: true, shakeIntensity: 2, aimLine: 'short', sound: { freq: 600, duration: 0.05, type: 'square' } },
  // Revolver: high damage per shot, strong knockback, slow fire — snappy crack sound
  revolver: { name: 'Revolver', color: '#daa', bulletColor: '#fa0', damage: 55, fireRate: 600, bulletSpeed: 18, spread: 0.02, magSize: 6, reloadTime: 1000, bulletSize: 4, knockback: 8, pierce: 0, infinite: false, totalAmmo: 36, shakeIntensity: 5, aimLine: 'medium', sound: { freq: 250, duration: 0.12, type: 'sawtooth' } },
  // SMG: spray and pray, high fire rate, low damage, wide spread — rapid clicking
  smg: { name: 'SMG', color: '#7af', bulletColor: '#7df', damage: 10, fireRate: 60, bulletSpeed: 16, spread: 0.15, magSize: 35, reloadTime: 800, bulletSize: 2, knockback: 0.5, pierce: 0, infinite: false, totalAmmo: 175, shakeIntensity: 1, aimLine: 'short', sound: { freq: 950, duration: 0.02, type: 'square' } },
  // Burst: precise 3-round burst, good at medium range — sharp pop
  burst: { name: 'Burst', color: '#af7', bulletColor: '#af7', damage: 22, fireRate: 450, bulletSpeed: 18, spread: 0.04, magSize: 24, reloadTime: 900, burst: 3, burstDelay: 45, bulletSize: 3, knockback: 2, pierce: 0, infinite: false, totalAmmo: 96, shakeIntensity: 2, aimLine: 'medium', sound: { freq: 650, duration: 0.025, type: 'square' } },
  // Shotgun: devastating close range, spread cone aim — deep boom
  shotgun: { name: 'Shotgun', color: '#fa4', bulletColor: '#fa0', damage: 20, fireRate: 700, bulletSpeed: 11, spread: 0.22, magSize: 6, reloadTime: 1100, pellets: 8, bulletSize: 3, knockback: 8, pierce: 0, infinite: false, totalAmmo: 36, shakeIntensity: 6, aimLine: 'cone', sound: { freq: 120, duration: 0.15, type: 'sawtooth' } },
  // Rifle: long range sniper, pierces 2 zombies, very precise — heavy thud
  rifle: { name: 'Rifle', color: '#4f4', bulletColor: '#4f4', damage: 70, fireRate: 900, bulletSpeed: 24, spread: 0.008, magSize: 5, reloadTime: 1200, bulletSize: 4, knockback: 10, pierce: 2, tracer: true, infinite: false, totalAmmo: 25, shakeIntensity: 7, aimLine: 'sniper', sound: { freq: 100, duration: 0.18, type: 'sawtooth' } },
  // Minigun: wall of bullets, needs spin-up time feel — buzzing whir
  minigun: { name: 'Minigun', color: '#aaf', bulletColor: '#adf', damage: 7, fireRate: 30, bulletSpeed: 18, spread: 0.2, magSize: 120, reloadTime: 2500, bulletSize: 2, knockback: 0.3, pierce: 0, infinite: false, totalAmmo: 360, shakeIntensity: 0.8, aimLine: 'wide', sound: { freq: 1100, duration: 0.015, type: 'square' } },
  // Flamethrower: area denial, short range cone, DOT feel — hissing roar
  flamethrower: { name: 'Flame', color: '#f60', bulletColor: '#f80', damage: 6, fireRate: 35, bulletSpeed: 7, spread: 0.35, magSize: 100, reloadTime: 1500, bulletSize: 6, knockback: 0.5, pierce: 1, infinite: false, totalAmmo: 200, shakeIntensity: 0.5, flame: true, bulletLife: 20, aimLine: 'cone', sound: { freq: 80, duration: 0.025, type: 'sawtooth' } },
  // Laser: precise beam, pierces everything, low damage per tick — high-pitched zap
  laser: { name: 'Laser', color: '#f4f', bulletColor: '#ff2fff', damage: 3, fireRate: 20, bulletSpeed: 30, spread: 0.01, magSize: 80, reloadTime: 1200, bulletSize: 3, knockback: 0, pierce: 99, tracer: true, infinite: false, totalAmmo: 240, shakeIntensity: 0.3, laserGlow: true, aimLine: 'sniper', sound: { freq: 3200, duration: 0.012, type: 'sine' } },
  // Tesla: chain lightning, jumps between enemies — electric crackle
  lightning: { name: 'Tesla', color: '#4ff', bulletColor: '#4ff', damage: 40, fireRate: 550, bulletSpeed: 20, spread: 0.03, magSize: 8, reloadTime: 1800, bulletSize: 3, knockback: 1, pierce: 0, infinite: false, totalAmmo: 40, shakeIntensity: 3, chain: true, chainRange: 150, chainCount: 4, tracer: true, aimLine: 'medium', sound: { freq: 1800, duration: 0.06, type: 'sine' } },
  // RPG: massive explosion, slow reload, 1 shot — deep rumbling launch
  rpg: { name: 'RPG', color: '#f44', bulletColor: '#f00', damage: 160, fireRate: 1500, bulletSpeed: 7, spread: 0.02, magSize: 1, reloadTime: 1400, bulletSize: 6, knockback: 15, pierce: 0, infinite: false, totalAmmo: 8, shakeIntensity: 10, explosive: true, explosionRadius: 90, aimLine: 'arc', sound: { freq: 60, duration: 0.25, type: 'sawtooth' } },
  // Grenade Launcher: lobs grenades over walls, auto-explode on landing
  grenade_launcher: { name: 'Grenade', color: '#f80', bulletColor: '#fa0', damage: 120, fireRate: 1200, bulletSpeed: 6, spread: 0.03, magSize: 4, reloadTime: 1800, bulletSize: 5, knockback: 12, pierce: 0, infinite: false, totalAmmo: 20, shakeIntensity: 6, explosive: true, explosionRadius: 100, grenade: true, bulletLife: 45, aimLine: 'arc', sound: { freq: 500, duration: 0.08, type: 'sine' } },
};
function createWeapon(type) { const d = WEAPON_DEFS[type]; return { type, ammo: d.magSize, reserveAmmo: d.infinite ? Infinity : d.totalAmmo, reloading: false, reloadTimer: 0, lastFired: 0, muzzleFlash: 0, burstLeft: 0, burstTimer: 0 }; }

// ---- ENTITIES ----
let bullets = [], zombies = [], particles = [], pickups = [], decals = [], floatingTexts = [], explosions = [], obstacles = [];
let dungeonGrid = null, rooms = [];

const ZOMBIE_TYPES = {
  normal: { hp: 50, speed: 1.2, radius: 12, color: '#5a5', damage: 10, score: 100 },
  fast: { hp: 30, speed: 2.8, radius: 10, color: '#7a5', damage: 8, score: 150 },
  tank: { hp: 200, speed: 0.7, radius: 18, color: '#585', damage: 20, score: 300 },
  spitter: { hp: 40, speed: 1.0, radius: 11, color: '#5a8', damage: 8, score: 200, ranged: true, fireRate: 2000 },
  exploder: { hp: 60, speed: 1.8, radius: 14, color: '#a55', damage: 30, score: 250, explodeOnDeath: true, explosionRadius: 60 },
};

// ---- AUDIO ----
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type='square', vol=0.15) {
  if (!audioCtx) return;
  try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(freq*0.5, audioCtx.currentTime+dur); g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur); } catch(e) {}
}
function playHitSound() { playSound(300,0.05,'sine',0.1); }
function playDeathSound() { playSound(100,0.2,'sawtooth',0.12); }
function playPickupSound() { playSound(880,0.1,'sine',0.15); playSound(1200,0.1,'sine',0.1); }
function playDashSound() { playSound(400,0.1,'sine',0.1); }
function playHurtSound() { playSound(200,0.15,'sawtooth',0.15); }
function playExplosionSound() { playSound(60,0.3,'sawtooth',0.25); playSound(40,0.4,'square',0.15); }

// ============================================================
// DUNGEON GENERATOR (seeded)
// ============================================================
function seededRandom(seed) { let s = seed; return function() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }

function generateDungeon(seed) {
  const rng = seededRandom(seed || Date.now());
  dungeonGrid = [];
  for (let y = 0; y < GRID_H; y++) { dungeonGrid[y] = []; for (let x = 0; x < GRID_W; x++) dungeonGrid[y][x] = false; }
  rooms = [];
  // Spawn room in top-left corner
  const cr = { x: 2, y: 2, w: 8, h: 8 };
  carveRoom(cr); rooms.push(cr);
  // Exit room in bottom-right corner
  const er = { x: GRID_W - 10, y: GRID_H - 10, w: 8, h: 8 };
  carveRoom(er); rooms.push(er);
  // 12-18 rooms for a longer winding path
  const numRooms = 12 + Math.floor(rng() * 7);
  for (let att = 0; att < 600 && rooms.length < numRooms + 1; att++) {
    const w = 6+Math.floor(rng()*5), h = 6+Math.floor(rng()*5);
    const x = 2+Math.floor(rng()*(GRID_W-w-4)), y = 2+Math.floor(rng()*(GRID_H-h-4));
    const room = { x, y, w, h };
    let ov = false;
    for (const r of rooms) { if (room.x < r.x+r.w+4 && room.x+room.w+4 > r.x && room.y < r.y+r.h+4 && room.y+room.h+4 > r.y) { ov = true; break; } }
    if (!ov) { carveRoom(room); rooms.push(room); }
  }
  // Connect rooms in a winding chain — sort by angle from center to create a path that snakes through the map
  const cx = GRID_W/2, cy = GRID_H/2;
  const roomOrder = rooms.map((r,i) => ({i, ax: r.x+r.w/2-cx, ay: r.y+r.h/2-cy}));
  // Sort rooms into a path: start from room 0, greedily connect to nearest unvisited (creates long winding path)
  const visited = [0], unvisited = [];
  for (let i = 1; i < rooms.length; i++) unvisited.push(i);
  // But force room 1 (exit) to be LAST in the chain
  const exitIdx = unvisited.indexOf(1);
  if (exitIdx !== -1) unvisited.splice(exitIdx, 1);
  while (unvisited.length > 0) {
    const last = visited[visited.length - 1];
    const lc = rooms[last];
    let bestIdx = -1, bestDist = Infinity;
    for (let ui = 0; ui < unvisited.length; ui++) {
      const ri = unvisited[ui];
      const rc = rooms[ri];
      const d = Math.abs(lc.x+lc.w/2-rc.x-rc.w/2)+Math.abs(lc.y+lc.h/2-rc.y-rc.h/2);
      if (d < bestDist) { bestDist = d; bestIdx = ui; }
    }
    const next = unvisited[bestIdx];
    carveCorridor(rooms[last], rooms[next]); visited.push(next); unvisited.splice(bestIdx, 1);
  }
  // Connect last room in chain to the exit
  carveCorridor(rooms[visited[visited.length-1]], rooms[1]);
  // Only add a few extra connections (20% chance) to keep the path mostly linear
  for (let i = 2; i < rooms.length; i++) {
    if (rng() < 0.2) {
      // Connect to a random non-adjacent room
      const candidates = [];
      for (let j = 0; j < rooms.length; j++) {
        if (j === i) continue;
        const d = Math.abs(rooms[i].x+rooms[i].w/2-rooms[j].x-rooms[j].w/2)+Math.abs(rooms[i].y+rooms[i].h/2-rooms[j].y-rooms[j].h/2);
        if (d < 30) candidates.push(j);
      }
      if (candidates.length > 0) carveCorridor(rooms[i], rooms[candidates[Math.floor(rng()*candidates.length)]]);
    }
  }
  obstacles = [];
  for (let y = 0; y < GRID_H; y++) { let rs = -1; for (let x = 0; x <= GRID_W; x++) { const isW = x < GRID_W ? !dungeonGrid[y][x] : true; if (isW && rs === -1) rs = x; else if (!isW && rs !== -1) { obstacles.push({ x: rs*CELL_SIZE, y: y*CELL_SIZE, w: (x-rs)*CELL_SIZE, h: CELL_SIZE, color: '#0c0a08' }); rs = -1; } } }
  uploadDungeonGrid();
}
function carveRoom(r) { for (let y = r.y; y < r.y+r.h && y < GRID_H; y++) for (let x = r.x; x < r.x+r.w && x < GRID_W; x++) if (y >= 0 && x >= 0) dungeonGrid[y][x] = true; }
function carveCorridor(a, b) {
  const ax=a.x+Math.floor(a.w/2), ay=a.y+Math.floor(a.h/2), bx=b.x+Math.floor(b.w/2), by=b.y+Math.floor(b.h/2), half=1;
  for (let x = Math.min(ax,bx); x <= Math.max(ax,bx); x++) for (let dy=-half; dy<=half; dy++) { const cy=ay+dy; if (cy>=0&&cy<GRID_H&&x>=0&&x<GRID_W) dungeonGrid[cy][x]=true; }
  for (let y = Math.min(ay,by); y <= Math.max(ay,by); y++) for (let dx=-half; dx<=half; dx++) { const cx=bx+dx; if (y>=0&&y<GRID_H&&cx>=0&&cx<GRID_W) dungeonGrid[y][cx]=true; }
}
function getRoomCenter(r) { return { x: (r.x+r.w/2)*CELL_SIZE, y: (r.y+r.h/2)*CELL_SIZE }; }
function getRandomFloorPos() { if (rooms.length <= 1) return { x: ARENA_W/2, y: ARENA_H/2 }; const r = rooms[1+Math.floor(Math.random()*(rooms.length-1))]; return { x: (r.x+1+Math.random()*(r.w-2))*CELL_SIZE, y: (r.y+1+Math.random()*(r.h-2))*CELL_SIZE }; }

function obstacleCollision(ox, oy, r) {
  const mnx=Math.max(0,Math.floor((ox-r)/CELL_SIZE)), mxx=Math.min(GRID_W-1,Math.floor((ox+r)/CELL_SIZE));
  const mny=Math.max(0,Math.floor((oy-r)/CELL_SIZE)), mxy=Math.min(GRID_H-1,Math.floor((oy+r)/CELL_SIZE));
  for (let gy=mny;gy<=mxy;gy++) for (let gx=mnx;gx<=mxx;gx++) { if (!dungeonGrid[gy][gx]) { const wx=gx*CELL_SIZE,wy=gy*CELL_SIZE; const cx=Math.max(wx,Math.min(ox,wx+CELL_SIZE)),cy=Math.max(wy,Math.min(oy,wy+CELL_SIZE)); const dx=ox-cx,dy=oy-cy; if (dx*dx+dy*dy<r*r) return true; } }
  return false;
}
function pushOutOfObstacles(e, r) {
  const mnx=Math.max(0,Math.floor((e.x-r-CELL_SIZE)/CELL_SIZE)), mxx=Math.min(GRID_W-1,Math.floor((e.x+r+CELL_SIZE)/CELL_SIZE));
  const mny=Math.max(0,Math.floor((e.y-r-CELL_SIZE)/CELL_SIZE)), mxy=Math.min(GRID_H-1,Math.floor((e.y+r+CELL_SIZE)/CELL_SIZE));
  for (let gy=mny;gy<=mxy;gy++) for (let gx=mnx;gx<=mxx;gx++) { if (!dungeonGrid[gy][gx]) { const wx=gx*CELL_SIZE,wy=gy*CELL_SIZE; const cx=Math.max(wx,Math.min(e.x,wx+CELL_SIZE)),cy=Math.max(wy,Math.min(e.y,wy+CELL_SIZE)); const dx=e.x-cx,dy=e.y-cy; const d=Math.sqrt(dx*dx+dy*dy); if (d<r) { if (d===0){e.x+=1;continue;} const p=(r-d)/d; e.x+=dx*p; e.y+=dy*p; } } }
}
function hasLineOfSight(ax,ay,bx,by) { const dx=bx-ax,dy=by-ay,dist=Math.sqrt(dx*dx+dy*dy),steps=Math.ceil(dist/(CELL_SIZE*0.5)); for (let i=1;i<steps;i++) { const t=i/steps,cx=ax+dx*t,cy=ay+dy*t,gx=Math.floor(cx/CELL_SIZE),gy=Math.floor(cy/CELL_SIZE); if (gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) return false; if (!dungeonGrid[gy][gx]) return false; } return true; }

// ---- WEBGL LIGHTING ----
const lightCanvas = document.createElement('canvas');
const gl = lightCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: false });
let glReady = false;

// Shaders
const LIGHT_VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){
  vUV = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const LIGHT_FS = `
precision mediump float;
varying vec2 vUV;
uniform sampler2D uGrid;
uniform vec2 uResolution;
uniform vec2 uPlayerPos;   // world coords
uniform vec2 uCameraPos;   // world coords
uniform float uPlayerAngle;
uniform float uSpotRadius;
uniform float uCellSize;
uniform vec2 uGridSize;    // GRID_W, GRID_H
uniform vec2 uArenaSize;   // ARENA_W, ARENA_H

bool isWall(vec2 worldPos) {
  vec2 gridUV = worldPos / uArenaSize;
  if (gridUV.x < 0.0 || gridUV.x > 1.0 || gridUV.y < 0.0 || gridUV.y > 1.0) return true;
  float val = texture2D(uGrid, gridUV).r;
  return val < 0.5;
}

bool rayHitsWall(vec2 from, vec2 to) {
  vec2 dir = to - from;
  float len = length(dir);
  if (len < 1.0) return false;
  float stepSize = uCellSize * 0.4;
  int steps = int(ceil(len / stepSize));
  // Cap steps to avoid infinite loops
  if (steps > 200) steps = 200;
  for (int i = 1; i <= 200; i++) {
    if (i > steps) break;
    float t = float(i) / float(steps);
    vec2 pt = from + dir * t;
    if (isWall(pt)) return true;
  }
  return false;
}

void main() {
  // Screen pixel -> world position (flip Y: WebGL origin is bottom-left, canvas is top-left)
  vec2 screenPos = vec2(vUV.x, 1.0 - vUV.y) * uResolution;
  vec2 worldPos = screenPos + uCameraPos - uResolution * 0.5;

  vec2 diff = worldPos - uPlayerPos;
  float dist = length(diff);
  float angle = atan(diff.y, diff.x);

  // Angle difference to player facing direction
  float angleDiff = angle - uPlayerAngle;
  angleDiff = mod(angleDiff + 3.14159265, 6.28318530) - 3.14159265;

  // Base: full darkness
  float darkness = 0.85;
  float light = 0.0;

  if (dist < uSpotRadius) {
    // Check line of sight
    bool blocked = rayHitsWall(uPlayerPos, worldPos);

    if (!blocked) {
      float distFactor = dist / uSpotRadius;

      // Ambient glow (all visible directions)
      float ambient = 0.0;
      if (distFactor < 0.3) ambient = 0.35;
      else if (distFactor < 0.7) ambient = 0.35 * (1.0 - (distFactor - 0.3) / 0.4);
      else ambient = 0.14 * (1.0 - (distFactor - 0.7) / 0.3);

      // Flashlight cone
      float coneHalf = 0.45;
      float cone = 0.0;
      float absDiff = abs(angleDiff);
      if (absDiff < coneHalf) {
        // Soft edge falloff at cone boundary
        float edgeFade = 1.0 - smoothstep(coneHalf * 0.7, coneHalf, absDiff);
        // Distance falloff
        float dFade = 1.0;
        if (distFactor < 0.1) dFade = 1.0;
        else if (distFactor < 0.4) dFade = 1.0;
        else if (distFactor < 0.7) dFade = 1.0 - (distFactor - 0.4) * 0.8;
        else dFade = 0.76 - (distFactor - 0.7) * 2.5;
        dFade = max(dFade, 0.0);
        cone = edgeFade * dFade;
      }

      light = max(ambient, cone);
    }
  }

  // Warm tint in flashlight cone
  float warmth = 0.0;
  if (light > 0.3 && abs(angleDiff) < 0.45) {
    warmth = (light - 0.3) * 0.08;
  }

  float alpha = darkness * (1.0 - light);
  gl_FragColor = vec4(warmth, warmth * 0.8, 0.0, alpha);
}`;

// GL state holders
let lightProg, quadBuf, gridTex;
let uGrid, uResolution, uPlayerPos, uCameraPos, uPlayerAngle, uSpotRadius, uCellSize, uGridSize, uArenaSize;

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error('Shader:', gl.getShaderInfoLog(s)); return null; }
  return s;
}

function initGL() {
  const vs = createShader(gl.VERTEX_SHADER, LIGHT_VS);
  const fs = createShader(gl.FRAGMENT_SHADER, LIGHT_FS);
  if (!vs || !fs) { console.error('Shader compile failed'); return; }
  lightProg = gl.createProgram();
  gl.attachShader(lightProg, vs);
  gl.attachShader(lightProg, fs);
  gl.linkProgram(lightProg);
  if (!gl.getProgramParameter(lightProg, gl.LINK_STATUS)) { console.error('Link:', gl.getProgramInfoLog(lightProg)); return; }

  quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  uGrid = gl.getUniformLocation(lightProg, 'uGrid');
  uResolution = gl.getUniformLocation(lightProg, 'uResolution');
  uPlayerPos = gl.getUniformLocation(lightProg, 'uPlayerPos');
  uCameraPos = gl.getUniformLocation(lightProg, 'uCameraPos');
  uPlayerAngle = gl.getUniformLocation(lightProg, 'uPlayerAngle');
  uSpotRadius = gl.getUniformLocation(lightProg, 'uSpotRadius');
  uCellSize = gl.getUniformLocation(lightProg, 'uCellSize');
  uGridSize = gl.getUniformLocation(lightProg, 'uGridSize');
  uArenaSize = gl.getUniformLocation(lightProg, 'uArenaSize');

  gridTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  glReady = true;
  // Re-upload grid if it exists
  if (dungeonGrid) uploadDungeonGrid();
}

function uploadDungeonGrid() {
  if (!dungeonGrid || !glReady) return;
  const data = new Uint8Array(GRID_W * GRID_H);
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {
    data[y * GRID_W + x] = dungeonGrid[y][x] ? 255 : 0;
  }
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, GRID_W, GRID_H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, data);
}

function renderLighting(playerX, playerY, playerAngle, camX, camY) {
  if (!glReady) return;
  // Resize triggers full GL re-init
  if (lightCanvas.width !== canvas.width || lightCanvas.height !== canvas.height) {
    lightCanvas.width = canvas.width;
    lightCanvas.height = canvas.height;
    initGL();
  }
  gl.viewport(0, 0, lightCanvas.width, lightCanvas.height);
  gl.disable(gl.BLEND);
  gl.clearColor(0, 0, 0, 0.85);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(lightProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.uniform1i(uGrid, 0);
  gl.uniform2f(uResolution, lightCanvas.width, lightCanvas.height);
  gl.uniform2f(uPlayerPos, playerX, playerY);
  gl.uniform2f(uCameraPos, camX, camY);
  gl.uniform1f(uPlayerAngle, playerAngle);
  gl.uniform1f(uSpotRadius, 450.0);
  gl.uniform1f(uCellSize, CELL_SIZE);
  gl.uniform2f(uGridSize, GRID_W, GRID_H);
  gl.uniform2f(uArenaSize, ARENA_W, ARENA_H);

  const aPos = gl.getAttribLocation(lightProg, 'aPos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Initial GL setup
initGL();

// NETWORKING
// ============================================================
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}`;
  ws = new WebSocket(url);
  ws.onopen = () => console.log('Connected to server');
  ws.onclose = () => { console.log('Disconnected'); ws = null; };
  ws.onerror = (e) => { showMultiError('Connection failed. Is the server running?'); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleServerMessage(msg);
  };
}

function sendMsg(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'lobby_created':
      myId = msg.playerId; lobbyCode = msg.code; lobbySeed = msg.seed; isHost = true;
      showLobbyScreen();
      break;
    case 'lobby_joined':
      myId = msg.playerId; lobbyCode = msg.code; lobbySeed = msg.seed; isHost = false;
      showLobbyScreen();
      break;
    case 'lobby_update':
      lobbyPlayers = msg.players;
      isHost = msg.hostId === myId;
      updateLobbyUI();
      break;
    case 'game_start':
      lobbySeed = msg.seed;
      startMultiplayerGame();
      break;
    case 'game_state':
      if (!isHost) applyHostState(msg);
      break;
    case 'player_input':
      if (isHost) remoteInputs[msg.fromId] = msg.input;
      break;
    case 'player_disconnected': {
      const pi = players.findIndex(p => p.id === msg.playerId);
      if (pi !== -1) { players[pi].alive = false; players[pi].hp = 0; }
      break;
    }
    case 'game_over':
      if (!isHost) showDeathScreen();
      break;
    case 'error':
      showMultiError(msg.message);
      break;
  }
}

function showMultiError(txt) { document.getElementById('multi-error').textContent = txt; }

// ============================================================
// MENU NAVIGATION
// ============================================================
function showScreen(id) {
  ['start-screen','multi-screen','lobby-screen','death-screen'].forEach(s => document.getElementById(s).style.display = 'none');
  if (id) document.getElementById(id).style.display = 'flex';
}

function showLobbyScreen() { showScreen('lobby-screen'); document.getElementById('lobby-code').textContent = lobbyCode; updateLobbyUI(); }
// Periodically request lobby state as fallback
setInterval(() => { if (gameState === 'menu' && document.getElementById('lobby-screen').style.display !== 'none' && ws && ws.readyState === 1) sendMsg({ type: 'request_lobby_update' }); }, 3000);

function updateLobbyUI() {
  const ul = document.getElementById('lobby-players');
  let html = '';
  // Filled slots
  for (let i = 0; i < lobbyPlayers.length; i++) {
    const p = lobbyPlayers[i];
    const you = p.id === myId ? ' (You)' : '';
    const host = p.id === myId && isHost ? ' <span class="host-tag">HOST</span>' : '';
    html += `<li><span class="dot" style="background:${p.color}"></span>${p.name}${you}${host}</li>`;
  }
  // Empty slots
  for (let i = lobbyPlayers.length; i < 4; i++) {
    html += `<li style="color:#444"><span class="dot" style="background:#333"></span>Empty slot</li>`;
  }
  ul.innerHTML = html;
  // Show start button for host when 2+ players, or waiting message for non-host
  const startBtn = document.getElementById('btn-start-game');
  const waitMsg = document.getElementById('lobby-waiting');
  if (isHost) {
    startBtn.style.display = lobbyPlayers.length >= 2 ? 'inline-block' : 'none';
    waitMsg.textContent = lobbyPlayers.length < 2 ? 'Waiting for players to join...' : '';
    waitMsg.style.display = lobbyPlayers.length < 2 ? 'block' : 'none';
  } else {
    startBtn.style.display = 'none';
    waitMsg.textContent = 'Waiting for host to start...';
    waitMsg.style.display = 'block';
  }
  document.getElementById('lobby-code').textContent = lobbyCode;
}

function showDeathScreen() {
  gameState = 'dead';
  document.getElementById('btn-menu').style.display = 'none';
  if (score > highScore) { highScore = score; localStorage.setItem('deadzone_highscore', highScore.toString()); }
  document.getElementById('death-stats').innerHTML = `Score: <span class="val">${score.toLocaleString()}</span><br>Level: <span class="val">${level}</span><br>Kills: <span class="val">${kills}</span>`;
  document.getElementById('highscore-display').textContent = `HIGH SCORE: ${highScore.toLocaleString()}`;
  showScreen('death-screen');
  playDeathSound(); screenShake.intensity = 15;
}

// ---- Button handlers ----
function addBtn(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); fn(); });
  el.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); fn(); });
}
addBtn('btn-solo', () => { isMultiplayer = false; startSoloGame(); });
addBtn('btn-multi', () => { showScreen('multi-screen'); showMultiError(''); connectWS(); });
addBtn('btn-back-main', () => { showScreen('start-screen'); if (ws) ws.close(); });
addBtn('btn-create', () => {
  const name = document.getElementById('name-input').value.trim() || 'Player';
  sendMsg({ type: 'create_lobby', name });
});
addBtn('btn-join', () => {
  const name = document.getElementById('name-input').value.trim() || 'Player';
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if (code.length !== 4) { showMultiError('Enter a 4-character code'); return; }
  sendMsg({ type: 'join_lobby', code, name });
});
addBtn('btn-start-game', () => { sendMsg({ type: 'start_game' }); });
addBtn('btn-leave', () => { if (ws) ws.close(); showScreen('start-screen'); });
addBtn('btn-restart', () => {
  if (isMultiplayer) { showScreen('start-screen'); if (ws) ws.close(); }
  else startSoloGame();
});
addBtn('btn-menu', () => {
  gameState = 'menu';
  if (ws) ws.close();
  document.getElementById('btn-menu').style.display = 'none';
  showScreen('start-screen');
});
// Action buttons: trigger action AND activate right joystick so user can hold+drag to aim
function activateRightJoystickFromButton(touch) {
  if (!rightJoystick.active) {
    rightJoystick.active = true; rightJoystick.id = touch.identifier;
    rightJoystick.cx = touch.clientX; rightJoystick.cy = touch.clientY;
    rightJoystick.dx = 0; rightJoystick.dy = 0; rightJoystick.nx = 0; rightJoystick.ny = 0;
    rightJoystick.firing = false;
  }

function startSoloGame() {
  initAudio(); isMultiplayer = false; isHost = true;
  gameState = 'playing'; score = 0; kills = 0; gameTime = 0; level = 1; spawnTimer = 0;
  window._currentLevelSeed = Date.now();
  generateDungeon(window._currentLevelSeed);
  const c = getRoomCenter(rooms[0]);
  players = [createPlayerObj(0, 'You', PLAYER_COLORS[0], c.x, c.y)];
  localPlayerIdx = 0;
  bullets = []; zombies = []; particles = []; pickups = []; decals = []; floatingTexts = []; explosions = [];
  camera.x = c.x; camera.y = c.y;
  placeExit();
  showScreen(null); document.getElementById('btn-menu').style.display = 'block';
  document.activeElement?.blur(); canvas.focus(); startLevel();
}

function startMultiplayerGame() {
  initAudio(); isMultiplayer = true; gameState = 'playing';
  score = 0; kills = 0; gameTime = 0; spawnTimer = 0;
  window._currentLevelSeed = lobbySeed;
  generateDungeon(lobbySeed);
  const c = getRoomCenter(rooms[0]);
  players = [];
  for (let i = 0; i < lobbyPlayers.length; i++) {
    const lp = lobbyPlayers[i];
    // Spread players around center room
    const angle = (i / lobbyPlayers.length) * Math.PI * 2;
    const px = c.x + Math.cos(angle) * 40, py = c.y + Math.sin(angle) * 40;
    players.push(createPlayerObj(lp.id, lp.name, lp.color, px, py));
    if (lp.id === myId) localPlayerIdx = i;
  }
  remoteInputs = {};
  bullets = []; zombies = []; particles = []; pickups = []; decals = []; floatingTexts = []; explosions = [];
  camera.x = c.x; camera.y = c.y;
  placeExit(); level = 1;
  showScreen(null); document.getElementById('btn-menu').style.display = 'block';
  document.activeElement?.blur(); canvas.focus();
  if (isHost) startLevel();
}

function handleTouchStart(e) { if (gameState !== 'playing') return; e.preventDefault(); for (const t of e.changedTouches) { const tx=t.clientX,ty=t.clientY,el=document.elementFromPoint(tx,ty); if (el&&(el.classList.contains('weapon-slot')||el.classList.contains('mobile-btn'))) continue; const hw=window.innerWidth/2; if (tx<hw&&!leftJoystick.active) { leftJoystick.active=true;leftJoystick.id=t.identifier;leftJoystick.cx=tx;leftJoystick.cy=ty;leftJoystick.dx=0;leftJoystick.dy=0;leftJoystick.nx=0;leftJoystick.ny=0; } else if (tx>=hw&&!rightJoystick.active) { rightJoystick.active=true;rightJoystick.id=t.identifier;rightJoystick.cx=tx;rightJoystick.cy=ty;rightJoystick.dx=0;rightJoystick.dy=0;rightJoystick.nx=0;rightJoystick.ny=0;rightJoystick.firing=false; } } }
function handleTouchMove(e) { e.preventDefault(); for (const t of e.changedTouches) { if (leftJoystick.active&&t.identifier===leftJoystick.id) { let dx=t.clientX-leftJoystick.cx,dy=t.clientY-leftJoystick.cy; const d=Math.sqrt(dx*dx+dy*dy); if (d>JOYSTICK_LEFT_MAX){dx=dx/d*JOYSTICK_LEFT_MAX;dy=dy/d*JOYSTICK_LEFT_MAX;} leftJoystick.dx=dx;leftJoystick.dy=dy;leftJoystick.nx=dx/JOYSTICK_LEFT_MAX;leftJoystick.ny=dy/JOYSTICK_LEFT_MAX; } if (rightJoystick.active&&t.identifier===rightJoystick.id) { let dx=t.clientX-rightJoystick.cx,dy=t.clientY-rightJoystick.cy; const d=Math.sqrt(dx*dx+dy*dy); if (d>JOYSTICK_RIGHT_MAX){dx=dx/d*JOYSTICK_RIGHT_MAX;dy=dy/d*JOYSTICK_RIGHT_MAX;} rightJoystick.dx=dx;rightJoystick.dy=dy;rightJoystick.nx=dx/JOYSTICK_RIGHT_MAX;rightJoystick.ny=dy/JOYSTICK_RIGHT_MAX;const mag=Math.sqrt(rightJoystick.nx*rightJoystick.nx+rightJoystick.ny*rightJoystick.ny);rightJoystick.aiming=mag>0.15;rightJoystick.firing=mag>0.65; } } }
function handleTouchEnd(e) { e.preventDefault(); for (const t of e.changedTouches) { if (leftJoystick.active&&t.identifier===leftJoystick.id){leftJoystick.active=false;leftJoystick.dx=0;leftJoystick.dy=0;leftJoystick.nx=0;leftJoystick.ny=0;} if (rightJoystick.active&&t.identifier===rightJoystick.id){rightJoystick.active=false;rightJoystick.dx=0;rightJoystick.dy=0;rightJoystick.nx=0;rightJoystick.ny=0;rightJoystick.aiming=false;rightJoystick.firing=false;} } }

function switchWeapon(idx) { const lp=getLocalPlayer(); if(lp&&lp.alive&&idx>=0&&idx<lp.weapons.length){lp.currentWeapon=idx;lp.weapons[idx].reloading=false;} }
function reloadWeapon() { const lp=getLocalPlayer(); if(!lp||!lp.alive) return; const w=lp.weapons[lp.currentWeapon],d=WEAPON_DEFS[w.type]; if(w.reloading||w.ammo===d.magSize||w.reserveAmmo===0) return; w.reloading=true;w.reloadTimer=d.reloadTime;playSound(400,0.05,'sine',0.08); }

function fireWeaponForPlayer(p) {
  const w=p.weapons[p.currentWeapon],d=WEAPON_DEFS[w.type],now=performance.now();
  if(w.reloading) return; if(w.ammo<=0){if(p===getLocalPlayer())reloadWeapon();return;} if(now-w.lastFired<d.fireRate) return;
  if(d.burst&&d.burst>1){w.burstLeft=d.burst-1;w.burstTimer=d.burstDelay;}

}
function fireSingleShot(p,w,d) {
  w.lastFired=performance.now();w.ammo--;w.muzzleFlash=6;

  const c2=Math.cos(p.angle),s2=Math.sin(p.angle);
  for(let i=0;i<3;i++) particles.push({x:p.x+c2*24,y:p.y+s2*24,vx:c2*(3+Math.random()*3)+(Math.random()-0.5)*2,vy:s2*(3+Math.random()*3)+(Math.random()-0.5)*2,life:8+Math.random()*6,maxLife:14,size:2+Math.random()*2,color:d.bulletColor,type:'spark'});
  particles.push({x:p.x+(-s2)*8,y:p.y+c2*8,vx:(-s2)*(2+Math.random())+(Math.random()-0.5),vy:c2*(2+Math.random())+(Math.random()-0.5),life:30,maxLife:30,size:2,color:'#da3',type:'casing',gravity:0.1});

}

function dash() {
  const lp=getLocalPlayer(); if(!lp||!lp.alive||lp.dashCooldown>0||lp.dashTimer>0) return;
  let dx=0,dy=0;
  if(isMobile&&leftJoystick.active){dx=leftJoystick.nx;dy=leftJoystick.ny;} else {if(keys['w'])dy-=1;if(keys['s'])dy+=1;if(keys['a'])dx-=1;if(keys['d'])dx+=1;}
  if(dx===0&&dy===0){dx=Math.cos(lp.angle);dy=Math.sin(lp.angle);}
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  lp.dashAngle=Math.atan2(dy/len,dx/len);lp.dashTimer=DASH_DURATION;lp.dashCooldown=DASH_COOLDOWN;lp.invincible=DASH_DURATION;
  playDashSound();
}


function tryPickup() {
  const lp=getLocalPlayer(); if(!lp||!lp.alive) return;
  for(let i=pickups.length-1;i>=0;i--){ const p=pickups[i],dx=lp.x-p.x,dy=lp.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<PICKUP_RANGE){
      if(p.dropCooldown>0) continue;
      if(p.type==='weapon'){const ex=lp.weapons.find(w=>w.type===p.weaponType);if(ex){const d=WEAPON_DEFS[p.weaponType];ex.reserveAmmo=Math.min(ex.reserveAmmo+d.totalAmmo,d.totalAmmo*2);showPickupMsg(`+${d.totalAmmo} ${d.name} AMMO`);}else if(lp.weapons.length<MAX_WEAPONS){lp.weapons.push(createWeapon(p.weaponType));lp.currentWeapon=lp.weapons.length-1;showPickupMsg(`${WEAPON_DEFS[p.weaponType].name} ACQUIRED`);}else{
        // At max weapons — drop currently equipped weapon and pick up new one
        const droppedWeapon=lp.weapons[lp.currentWeapon];
        // Spawn dropped weapon as pickup with cooldown so it's not immediately re-picked
        pickups.push({type:'weapon',weaponType:droppedWeapon.type,x:lp.x,y:lp.y,bobTimer:Math.random()*Math.PI*2,dropCooldown:90});
        lp.weapons[lp.currentWeapon]=createWeapon(p.weaponType);
        showPickupMsg(`${WEAPON_DEFS[p.weaponType].name} SWAPPED`);
      }playPickupSound();pickups.splice(i,1);}
      else if(p.type==='health'){if(lp.hp<lp.maxHp){lp.hp=Math.min(lp.maxHp,lp.hp+p.amount);showPickupMsg(`+${p.amount} HP`);playPickupSound();pickups.splice(i,1);}else{showPickupMsg('HEALTH FULL');}}
      else if(p.type==='ammo'){const w=lp.weapons[lp.currentWeapon],d=WEAPON_DEFS[w.type];if(!d.infinite){w.reserveAmmo+=d.magSize*3;showPickupMsg(`+AMMO`);playPickupSound();pickups.splice(i,1);}else{showPickupMsg('AMMO FULL');}}
    }
  }
}

function getZombieTypesForLevel(lv) { const t=['normal'];if(lv>=2)t.push('fast');if(lv>=3)t.push('tank');if(lv>=4)t.push('spitter');if(lv>=5)t.push('exploder');if(lv<5){t.push('normal');t.push('normal');}return t; }

function createExplosion(x,y,radius,damage,source='player') {

function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (gameState !== 'playing') return;
  gameTime++;

  const lp = getLocalPlayer();
  if (!lp) return;

  // ---- Local player input ----
  if (lp.alive) {
    let dx=0,dy=0;
    // Keyboard input always works
    if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
    // Mobile left joystick: movement only (no flashlight — that's right joystick)
    if(isMobile&&leftJoystick.active){
      dx=leftJoystick.nx;dy=leftJoystick.ny;
    }
    if(lp.dashTimer>0){lp.dashTimer-=16.67;lp.vx=Math.cos(lp.dashAngle)*DASH_SPEED;lp.vy=Math.sin(lp.dashAngle)*DASH_SPEED;if(gameTime%2===0)particles.push({x:lp.x,y:lp.y,vx:0,vy:0,life:10,maxLife:10,size:PLAYER_RADIUS,color:lp.color,type:'dashtrail'});}else{
      let moveSpeed=lp.speed;
      // Sprint: holding space (desktop) or dash button increases speed (works even during cooldown)
      const sprinting = keys[' '];
      if(sprinting) moveSpeed = lp.speed * 1.6;
      // Sprint trail particles
      if(sprinting && (Math.abs(lp.vx)>0.5||Math.abs(lp.vy)>0.5) && gameTime%3===0) particles.push({x:lp.x+(Math.random()-0.5)*8,y:lp.y+(Math.random()-0.5)*8,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,life:8,maxLife:8,size:PLAYER_RADIUS*0.6,color:lp.color,type:'dashtrail'});
      if(isMobile&&(dx!==0||dy!==0)){
        const mag=Math.sqrt(dx*dx+dy*dy);
        moveSpeed=moveSpeed*Math.min(1,mag);
        if(mag>0.01){dx/=mag;dy/=mag;}
      } else if(dx!==0&&dy!==0){const l=Math.sqrt(dx*dx+dy*dy);dx/=l;dy/=l;}
      lp.vx=dx*moveSpeed;lp.vy=dy*moveSpeed;}
    lp.x+=lp.vx;lp.y+=lp.vy;lp.x=clamp(lp.x,PLAYER_RADIUS,ARENA_W-PLAYER_RADIUS);lp.y=clamp(lp.y,PLAYER_RADIUS,ARENA_H-PLAYER_RADIUS);pushOutOfObstacles(lp,PLAYER_RADIUS);
    if(isMobile){if(rightJoystick.active&&rightJoystick.aiming)lp.angle=Math.atan2(rightJoystick.ny,rightJoystick.nx);}else{mouse.worldX=mouse.x-canvas.width/2+camera.x;mouse.worldY=mouse.y-canvas.height/2+camera.y;lp.angle=Math.atan2(mouse.worldY-lp.y,mouse.worldX-lp.x);}
    // Track movement angle for the direction dot (desktop only — mobile uses joystick directly)
    if(!isMobile&&(Math.abs(lp.vx)>0.1||Math.abs(lp.vy)>0.1)) lp.moveAngle=Math.atan2(lp.vy,lp.vx);
    if(lp.dashCooldown>0)lp.dashCooldown-=16.67;if(lp.invincible>0)lp.invincible-=16.67;if(lp.damageFlash>0)lp.damageFlash--;
    if(isMobile&&gameTime%5===0)tryPickup();
    // Check exit — all alive players must be near exit to advance
    if(exitPos&&isHost){
      const alivePlayers=players.filter(p=>p.alive);
      const allAtExit=alivePlayers.length>0&&alivePlayers.every(p=>Math.sqrt((p.x-exitPos.x)**2+(p.y-exitPos.y)**2)<40);
      const someAtExit=alivePlayers.some(p=>Math.sqrt((p.x-exitPos.x)**2+(p.y-exitPos.y)**2)<40);
      exitPos._someWaiting=someAtExit&&!allAtExit;
      if(allAtExit){advanceLevel();return;}
    }

    if(w.reloading){w.reloadTimer-=16.67;if(w.reloadTimer<=0){const needed=def.magSize-w.ammo;if(def.infinite)w.ammo=def.magSize;else{const fill=Math.min(needed,w.reserveAmmo);w.ammo+=fill;w.reserveAmmo-=fill;}w.reloading=false;playSound(600,0.05,'sine',0.1);}}

  }

  // ---- Send input to host (non-host multiplayer) ----

  }

  // ---- Host: process remote player inputs ----
  if (isHost && isMultiplayer) {
    for (const p of players) {

            p.weapons = inp.weaponTypes.map((t,i) => { const w = createWeapon(t); if(inp.weaponAmmo&&inp.weaponAmmo[i]){w.ammo=inp.weaponAmmo[i].ammo;w.reserveAmmo=inp.weaponAmmo[i].reserveAmmo;} return w; });
          }
        }

      }
    }
  }

  // ---- Bullet physics (all clients run this for smooth visuals) ----
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.trail.push({x:b.x,y:b.y});if(b.trail.length>6)b.trail.shift();if(b.flame){b.vx*=0.96;b.vy*=0.96;b.size*=1.03;}b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.x<0||b.x>ARENA_W||b.y<0||b.y>ARENA_H){bullets.splice(i,1);continue;}if(!b.grenade&&obstacleCollision(b.x,b.y,b.size)){if(b.explosive&&isHost)createExplosion(b.x,b.y,b.explosionRadius,b.damage);bullets.splice(i,1);continue;}if(b.life<=0){if(b.explosive&&isHost)createExplosion(b.x,b.y,b.explosionRadius,b.damage);bullets.splice(i,1);continue;}
    // Only host does damage calculations
    if(isHost){
      if(b.owner==='player'){for(let j=zombies.length-1;j>=0;j--){const z=zombies[j];if(dist(b,z)<z.radius+b.size){const a=Math.atan2(b.vy,b.vx);damageZombie(z,b.damage,Math.cos(a)*b.knockback,Math.sin(a)*b.knockback);
                  // Chain lightning — arc from bullet origin to first hit, then between chained zombies
                  if(b.chain){
                  // Lightning arc from gun muzzle (bullet spawn) to first zombie hit
                  const gunX=b.trail.length>0?b.trail[0].x:b.x,gunY=b.trail.length>0?b.trail[0].y:b.y;
                  particles.push({x:gunX,y:gunY,vx:0,vy:0,life:8,maxLife:8,size:1,color:'#4ff',type:'lightning',tx:z.x,ty:z.y});
                  for(let li=0;li<3;li++){particles.push({x:(gunX+z.x)/2+(Math.random()-0.5)*10,y:(gunY+z.y)/2+(Math.random()-0.5)*10,vx:0,vy:0,life:6,maxLife:6,size:2,color:'#4ff',type:'spark'});}
                  const hitSet=new Set([j]);let lastZ=z;for(let ci=0;ci<(b.chainCount||3);ci++){let bestD=b.chainRange||150,bestIdx=-1;for(let k=0;k<zombies.length;k++){if(hitSet.has(k))continue;const cz=zombies[k];const cd=Math.sqrt((cz.x-lastZ.x)**2+(cz.y-lastZ.y)**2);if(cd<bestD){bestD=cd;bestIdx=k;}}if(bestIdx===-1)break;hitSet.add(bestIdx);const nz=zombies[bestIdx];
                  // Draw lightning arc
                  for(let li=0;li<3;li++){const lx1=lastZ.x+(Math.random()-0.5)*4,ly1=lastZ.y+(Math.random()-0.5)*4,lx2=nz.x+(Math.random()-0.5)*4,ly2=nz.y+(Math.random()-0.5)*4;particles.push({x:(lx1+lx2)/2,y:(ly1+ly2)/2,vx:0,vy:0,life:6,maxLife:6,size:2,color:'#4ff',type:'spark'});}

                  particles.push({x:lastZ.x,y:lastZ.y,vx:0,vy:0,life:8,maxLife:8,size:1,color:'#4ff',type:'lightning',tx:nz.x,ty:nz.y});
                  damageZombie(nz,b.damage*0.7,0,0);playSound(1200,0.03,'sine',0.06);lastZ=nz;}}if(z.hp<=0){score+=z.score;kills++;addFloatingText(z.x,z.y-20,`+${z.score}`,'#ff0');if(z.explodeOnDeath)createExplosion(z.x,z.y,z.explosionRadius,z.damage*0.5,'any');
                  for(let k=0;k<35;k++){const a2=Math.random()*Math.PI*2,s=1+Math.random()*8;particles.push({x:z.x,y:z.y,vx:Math.cos(a2)*s,vy:Math.sin(a2)*s,life:30+Math.random()*25,maxLife:55,size:3+Math.random()*6,color:['#a22','#811','#622','#933','#c11','#700'][Math.floor(Math.random()*6)],type:'blood'});}
                  for(let k=0;k<10;k++){const a2=Math.random()*Math.PI*2,s=2+Math.random()*6;particles.push({x:z.x,y:z.y,vx:Math.cos(a2)*s,vy:Math.sin(a2)*s,life:40+Math.random()*25,maxLife:65,size:4+Math.random()*6,color:['#511','#422','#600'][Math.floor(Math.random()*3)],type:'chunk',gravity:0.06});}
                  decals.push({x:z.x,y:z.y,size:z.radius+15+Math.random()*20,alpha:0.5+Math.random()*0.2,color:'#200'});
                  for(let k=0;k<6;k++){const a2=Math.random()*Math.PI*2,sd=12+Math.random()*30;decals.push({x:z.x+Math.cos(a2)*sd,y:z.y+Math.sin(a2)*sd,size:3+Math.random()*8,alpha:0.3+Math.random()*0.3,color:['#311','#200','#411'][Math.floor(Math.random()*3)]});}
                  playSound(120,0.12,'sawtooth',0.15);playSound(80,0.15,'square',0.08);screenShake.intensity=Math.max(screenShake.intensity,5);
                  if(Math.random()<0.12)pickups.push({type:'health',amount:15,x:z.x,y:z.y,bobTimer:Math.random()*Math.PI*2});else if(Math.random()<0.25)pickups.push({type:'ammo',x:z.x,y:z.y,bobTimer:Math.random()*Math.PI*2});zombies.splice(j,1);}b.pierced++;if(b.pierced>b.pierce){if(b.explosive)createExplosion(b.x,b.y,b.explosionRadius,b.damage);bullets.splice(i,1);break;}}}}
      // Zombie bullets hurt players (no friendly fire — player bullets never hurt players)
      else if(b.owner==='zombie'){for(const p of players){if(!p.alive)continue;if(dist(b,p)<PLAYER_RADIUS+b.size){damagePlayerObj(p,b.damage);bullets.splice(i,1);break;}}}
    }
  }

  // ---- Host runs simulation ----
  if (isHost) {
    // Continuous zombie spawning based on level
    spawnTimer++;
    const maxZombies = 15 + level * 5; // cap active zombies — way more zombies
    const spawnRate = Math.max(10, 40 - level * 4); // faster spawns at higher levels
    if(spawnTimer % spawnRate === 0 && zombies.length < maxZombies) {
      spawnZombie();
      if(Math.random()<0.04) spawnWeaponPickup();
      if(Math.random()<0.06) spawnHealthPickup();
    }

    // Zombies
    for(const z of zombies){
      if(z.hitFlash>0)z.hitFlash--;
      if(z.staggerTimer>0){z.staggerTimer--;z.vx*=0.8;z.vy*=0.8;z.x+=z.vx;z.y+=z.vy;pushOutOfObstacles(z,z.radius);continue;}
      const{player:np,dist:zd}=getNearestAlivePlayer(z.x,z.y);
      if(!np)continue;
      const zdx=np.x-z.x,zdy=np.y-z.y;

      if(!z.aware){
        if(gameTime%10===0&&zd<400&&hasLineOfSight(z.x,z.y,np.x,np.y)){z.aware=true;for(const oz of zombies){if(oz===z||oz.aware)continue;if((oz.x-z.x)**2+(oz.y-z.y)**2<200*200)oz.aware=true;}}
        if(zd<120)z.aware=true;
      }

      if(z.aware){
        z.angle=Math.atan2(zdy,zdx);
        if(z.ranged&&zd<300){if(zd<150){z.vx=-zdx/zd*z.speed*0.5;z.vy=-zdy/zd*z.speed*0.5;}else{z.vx*=0.9;z.vy*=0.9;}const now=performance.now();if(now-z.lastFired>z.fireRate){z.lastFired=now;bullets.push({x:z.x,y:z.y,vx:Math.cos(z.angle)*5,vy:Math.sin(z.angle)*5,damage:z.damage,color:'#5fa',size:4,knockback:0,pierce:0,pierced:0,life:80,owner:'zombie',trail:[]});playSound(300,0.05,'sine',0.06);}}
        else{z.vx=(zdx/zd)*z.speed;z.vy=(zdy/zd)*z.speed;}
      } else {
        z.wanderTimer--;
        if(gameTime%15===0){const md=z.x-z.lastX,mdy=z.y-z.lastY;if(md*md+mdy*mdy<4)z.stuckTimer++;else z.stuckTimer=0;z.lastX=z.x;z.lastY=z.y;}
        if(z.wanderTimer<=0||z.stuckTimer>3){z.wanderAngle+=(Math.random()-0.5)*Math.PI*(z.stuckTimer>3?1.5:0.8);z.wanderTimer=40+Math.floor(Math.random()*80);z.stuckTimer=0;}
        z.angle=z.wanderAngle;z.vx=Math.cos(z.wanderAngle)*z.speed*0.4;z.vy=Math.sin(z.wanderAngle)*z.speed*0.4;
      }

      z.x+=z.vx;z.y+=z.vy;z.x=clamp(z.x,z.radius,ARENA_W-z.radius);z.y=clamp(z.y,z.radius,ARENA_H-z.radius);pushOutOfObstacles(z,z.radius);
      for(const o of zombies){if(o===z)continue;const sx=z.x-o.x,sy=z.y-o.y,sd=Math.sqrt(sx*sx+sy*sy),md2=z.radius+o.radius;if(sd<md2&&sd>0){const p=(md2-sd)/sd*0.3;z.x+=sx*p;z.y+=sy*p;}}
      // Melee all players
      for(const p of players){if(!p.alive)continue;const pd=Math.sqrt((p.x-z.x)**2+(p.y-z.y)**2);if(pd<z.radius+PLAYER_RADIUS+2&&z.attackCooldown<=0){damagePlayerObj(p,z.damage);z.attackCooldown=30;}}
      if(z.attackCooldown>0)z.attackCooldown--;
    }
  }

  // ---- Revive mechanic: stand near dead players to revive them ----
  if (isHost && isMultiplayer) {
    for (const dp of players) {
      if (dp.alive) continue;
      let reviver = false;
      for (const ap of players) {
        if (!ap.alive || ap === dp) continue;
        if (Math.sqrt((ap.x-dp.x)**2+(ap.y-dp.y)**2) < 50) { reviver = true; break; }
      }
      if (reviver) { dp.reviveProgress = (dp.reviveProgress||0) + 1; if (dp.reviveProgress >= dp.reviveTime) { dp.alive = true; dp.hp = 50; dp.invincible = 1000; dp.reviveProgress = 0; } }
      else { dp.reviveProgress = Math.max(0, (dp.reviveProgress||0) - 2); }

  }

  // ---- Smooth interpolation for remote players (non-host clients) ----
  if (isMultiplayer) {
    for (const p of players) {
      if (p === getLocalPlayer() || !p.alive) continue;
      if (p._targetX !== undefined) {
        p.x = lerp(p.x, p._targetX + (p._targetVx||0), 0.2);

        p.angle += diff * 0.3;
      }
    }
  }

  // ---- Particles, texts, explosions ----
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.gravity)p.vy+=p.gravity;p.vx*=0.95;p.vy*=0.95;p.life--;if(p.life<=0)particles.splice(i,1);}
  for(let i=floatingTexts.length-1;i>=0;i--){floatingTexts[i].y+=floatingTexts[i].vy;floatingTexts[i].life--;if(floatingTexts[i].life<=0)floatingTexts.splice(i,1);}
  for(let i=explosions.length-1;i>=0;i--){explosions[i].life--;if(explosions[i].life<=0)explosions.splice(i,1);}
  for(const p of pickups){p.bobTimer+=0.05;if(p.dropCooldown>0)p.dropCooldown--;}
  if(decals.length>200)decals.splice(0,decals.length-200);

  // Camera follows local player (or spectate alive player) with aim-look-ahead
  let camTarget = lp;
  if (!lp.alive) { const alive = players.find(p => p.alive); if (alive) camTarget = alive; }

  if (isHost && isMultiplayer && gameTime % NET_SEND_RATE === 0) {

    sendMsg({ type: 'game_state', players: ps, zombies: zs, bullets: bs, pickups: pks, score, kills, level, exitPos, levelSeed: window._currentLevelSeed||0 });
  }

}

// ---- Apply host state (non-host client) ----
function applyHostState(msg) {
  score = msg.score; kills = msg.kills;
  // Detect level change — regenerate dungeon on client
  if (msg.level && msg.level !== level) {
    level = msg.level;
    if (msg.levelSeed) {
      generateDungeon(msg.levelSeed);
      placeExit();
      bullets = []; pickups = []; decals = []; floatingTexts = []; explosions = [];
      // Move local player to spawn
      const c = getRoomCenter(rooms[0]);
      const lp = getLocalPlayer();
      if (lp) { lp.x = c.x + (Math.random()-0.5)*40; lp.y = c.y + (Math.random()-0.5)*40; }
      camera.x = c.x; camera.y = c.y;
    }
  }
  if(msg.exitPos) exitPos = msg.exitPos;
  // Update all players (including local for authoritative HP/alive from host)
  for (const pd of msg.players) {
    let p = players.find(pp => pp.id === pd.id);
    if (!p) continue;
    if (pd.id === myId) {
      // For local player, only sync hp/alive from host (position is local)
      p.hp = pd.hp; p.alive = pd.alive;
      p.reviveProgress = pd.reviveProgress||0; p.reviveTime = pd.reviveTime||360;
      continue;
    }
    // Store target for smooth interpolation
    p._targetX = pd.x; p._targetY = pd.y;
    p._targetVx = pd.vx||0; p._targetVy = pd.vy||0;
    p._targetAngle = pd.angle; p.moveAngle = pd.moveAngle||0;
    p.hp = pd.hp; p.alive = pd.alive;
    p.reviveProgress = pd.reviveProgress||0; p.reviveTime = pd.reviveTime||360;
    if (pd.weapon !== undefined && pd.weapon < p.weapons.length) p.currentWeapon = pd.weapon;
  }
  // Sync zombies from host
  zombies = msg.zombies.map(z => ({...z, vx:0,vy:0,staggerTimer:0,attackCooldown:0,wanderAngle:0,wanderTimer:0,stuckTimer:0,lastX:0,lastY:0,ranged:ZOMBIE_TYPES[z.type]?.ranged||false,fireRate:ZOMBIE_TYPES[z.type]?.fireRate||0,lastFired:0,explodeOnDeath:ZOMBIE_TYPES[z.type]?.explodeOnDeath||false,explosionRadius:ZOMBIE_TYPES[z.type]?.explosionRadius||0,damage:ZOMBIE_TYPES[z.type]?.damage||10,score:ZOMBIE_TYPES[z.type]?.score||100}));
  // Sync bullets from host — keep local player's bullets for smooth visuals, add remote bullets
  if (msg.bullets) {
    const localId = myId;
    // Keep locally-created bullets (from local player firing)
    const localBullets = bullets.filter(b => b.ownerId === localId);
    // Add all bullets from other players from host
    const remoteBullets = msg.bullets.filter(b => b.ownerId !== localId).map(b => ({...b, pierced:0, pierce:0, knockback:0, explosive:false, explosionRadius:0, trail:[{x:b.x-b.vx*2,y:b.y-b.vy*2},{x:b.x-b.vx,y:b.y-b.vy},{x:b.x,y:b.y}] }));
    bullets = localBullets.concat(remoteBullets);
  }
  // Sync pickups from host
  if (msg.pickups) {
    pickups = msg.pickups;
  }
  // Check game over
  if (!players.some(p => p.alive) && gameState === 'playing') showDeathScreen();
}

// ============================================================
// HUD
// ============================================================
function updateHUD() {
  const lp=getLocalPlayer();if(!lp)return;
  const w=lp.weapons[lp.currentWeapon],def=WEAPON_DEFS[w.type];
  document.getElementById('weapon-name').textContent=def.name;
  const ae=document.getElementById('ammo-display');
  if(w.reloading){ae.innerHTML=`RELOADING ${Math.floor((1-w.reloadTimer/def.reloadTime)*100)}%`;ae.className='ammo reloading';}
  else{ae.innerHTML=`${w.ammo} <span class="slash">/</span> <span class="reserve">${def.infinite?'∞':w.reserveAmmo}</span>`;ae.className='ammo';}
  document.getElementById('score').textContent=score.toLocaleString();
  document.getElementById('wave-display').textContent=`LEVEL ${level}`;
  document.getElementById('kills-display').textContent=`${kills} KILLS`;
  const hp=Math.max(0,lp.hp/lp.maxHp*100),hb=document.getElementById('health-bar');
  hb.style.width=hp+'%';hb.style.background=hp>50?'#4f4':hp>25?'#fa0':'#f44';
  document.getElementById('health-text').textContent=`${Math.ceil(lp.hp)} HP`;
  const se=document.getElementById('weapon-slots');let h='';
  for(let i=0;i<MAX_WEAPONS;i++){
    if(i<lp.weapons.length){const ww=lp.weapons[i],dd=WEAPON_DEFS[ww.type];h+=`<div class="weapon-slot ${i===lp.currentWeapon?'active':''}" data-idx="${i}"><span class="key">${i+1}</span>${dd.name.substring(0,4)}</div>`;}
    else{h+=`<div class="weapon-slot" style="border-style:dashed;color:#333"><span class="key">${i+1}</span>----</div>`;}
  }
  se.innerHTML=h;
  const db=document.getElementById('btn-dash');if(db)db.className=lp.dashCooldown>0?'mobile-btn dash-cooldown':'mobile-btn dash-ready';
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (gameState !== 'playing') { renderMinimap(); return; }
  const ox=-camera.x+canvas.width/2+screenShake.x,oy=-camera.y+canvas.height/2+screenShake.y;
  ctx.save();ctx.translate(ox,oy);

  for(const b of bullets){if(b.tracer&&b.trail.length>1){ctx.strokeStyle=b.color;ctx.lineWidth=2;ctx.globalAlpha=0.6;ctx.beginPath();ctx.moveTo(b.trail[0].x,b.trail[0].y);for(let j=1;j<b.trail.length;j++)ctx.lineTo(b.trail[j].x,b.trail[j].y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;}if(b.grenade){ctx.fillStyle='#555';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f80';ctx.fillRect(b.x-1.5,b.y-8,3,4);}else if(b.flame){ctx.globalAlpha=Math.min(1,b.life/20);const gr=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.size);gr.addColorStop(0,'#ff4');gr.addColorStop(0.5,'#f80');gr.addColorStop(1,'rgba(255,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}else if(b.chain&&b.trail.length>1){
    ctx.strokeStyle=b.color;ctx.lineWidth=3;ctx.shadowColor='#4ff';ctx.shadowBlur=12;ctx.beginPath();
    const t0=b.trail[Math.max(0,b.trail.length-4)];ctx.moveTo(t0.x,t0.y);
    for(let j=Math.max(0,b.trail.length-3);j<b.trail.length;j++){ctx.lineTo(b.trail[j].x+(Math.random()-0.5)*8,b.trail[j].y+(Math.random()-0.5)*8);}
    ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(t0.x,t0.y);
    for(let j=Math.max(0,b.trail.length-3);j<b.trail.length;j++){ctx.lineTo(b.trail[j].x+(Math.random()-0.5)*4,b.trail[j].y+(Math.random()-0.5)*4);}
    ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(b.x,b.y,b.size+2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    }else{ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}
  // Redraw zombie eyes on top of fog — always glowing
  for(const z of zombies){
    ctx.save();ctx.translate(z.x,z.y);ctx.rotate(z.angle);
    const eyeC2=!z.aware?'#aa4':(z.type==='spitter'?'#5fa':'#f44');
    ctx.globalAlpha=0.35;ctx.fillStyle=eyeC2;
    ctx.beginPath();ctx.arc(z.radius*0.4,-z.radius*0.3,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(z.radius*0.4,z.radius*0.3,5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.shadowColor=eyeC2;ctx.shadowBlur=12;ctx.fillStyle=eyeC2;
    ctx.beginPath();ctx.arc(z.radius*0.4,-z.radius*0.3,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(z.radius*0.4,z.radius*0.3,2.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }
  ctx.restore();}

  // Damage vignette
  const lp2=getLocalPlayer();if(lp2&&lp2.damageFlash>0){ctx.fillStyle=`rgba(255,0,0,${lp2.damageFlash/15*0.4})`;ctx.fillRect(0,0,canvas.width,canvas.height);}

  // Spectating text
  if(lp2&&!lp2.alive&&gameState==='playing'){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,canvas.width,40);ctx.fillStyle='#f04040';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText('SPECTATING',canvas.width/2,26);}

  if(isMobile&&gameState==='playing')renderJoysticks();
  renderMinimap();
}

function renderJoysticks(){
  if(leftJoystick.active){ctx.globalAlpha=0.2;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(leftJoystick.cx,leftJoystick.cy,JOYSTICK_LEFT_MAX,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(leftJoystick.cx+leftJoystick.dx,leftJoystick.cy+leftJoystick.dy,18,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  if(rightJoystick.active){const jColor=rightJoystick.firing?'#f04040':rightJoystick.aiming?'#f0c040':'#fff';ctx.globalAlpha=0.2;ctx.strokeStyle=jColor;ctx.lineWidth=2;ctx.beginPath();ctx.arc(rightJoystick.cx,rightJoystick.cy,JOYSTICK_RIGHT_MAX,0,Math.PI*2);ctx.stroke();
    // Fire threshold ring
    ctx.globalAlpha=0.18;ctx.strokeStyle='#f04040';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(rightJoystick.cx,rightJoystick.cy,JOYSTICK_RIGHT_MAX*0.65,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=0.4;ctx.fillStyle=jColor;ctx.beginPath();ctx.arc(rightJoystick.cx+rightJoystick.dx,rightJoystick.cy+rightJoystick.dy,20,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
}

function renderMinimap(){
  const mw=minimapCanvas.width,mh=minimapCanvas.height,sx=mw/ARENA_W,sy=mh/ARENA_H;
  minimapCtx.clearRect(0,0,mw,mh);minimapCtx.fillStyle='#111';minimapCtx.fillRect(0,0,mw,mh);
  if(dungeonGrid){const step=Math.max(1,Math.floor(3/sx));for(let y=0;y<GRID_H;y+=step)for(let x=0;x<GRID_W;x+=step){
    if(dungeonGrid[y][x]){minimapCtx.fillStyle='#2a2a2a';}else{
      // Only draw wall cells that border a floor cell (visible walls)
      let border=false;if(y>0&&dungeonGrid[y-1]&&dungeonGrid[y-1][x])border=true;if(!border&&y<GRID_H-1&&dungeonGrid[y+1]&&dungeonGrid[y+1][x])border=true;if(!border&&x>0&&dungeonGrid[y][x-1])border=true;if(!border&&x<GRID_W-1&&dungeonGrid[y][x+1])border=true;
      if(!border)continue;minimapCtx.fillStyle='#665e50';
    }
    minimapCtx.fillRect(x*CELL_SIZE*sx,y*CELL_SIZE*sy,Math.max(1,CELL_SIZE*sx*step),Math.max(1,CELL_SIZE*sy*step));
  }}
  // Zombies intentionally NOT shown on minimap
  for(const pk of pickups){
    if(pk.type==='weapon'){
      // Weapons: larger pulsing diamond
      const pulse=2+Math.sin(gameTime*0.1)*1;
      minimapCtx.fillStyle='#f0c040';
      minimapCtx.save();minimapCtx.translate(pk.x*sx,pk.y*sy);minimapCtx.rotate(Math.PI/4);
      minimapCtx.fillRect(-pulse,-pulse,pulse*2,pulse*2);
      minimapCtx.restore();
    } else {
      minimapCtx.fillStyle=pk.type==='health'?'#4f4':pk.type==='ammo'?'#fa0':'#4f4';
      minimapCtx.fillRect(pk.x*sx-1,pk.y*sy-1,3,3);
    }
  }
  for(const p of players){if(!p.alive)continue;minimapCtx.fillStyle=p.color;minimapCtx.fillRect(p.x*sx-2,p.y*sy-2,4,4);}
  // Exit on minimap
  if(exitPos){const ep=0.7+Math.sin(gameTime*0.08)*0.3;minimapCtx.fillStyle=`rgba(0,255,255,${ep})`;minimapCtx.beginPath();minimapCtx.arc(exitPos.x*sx,exitPos.y*sy,4,0,Math.PI*2);minimapCtx.fill();}
  minimapCtx.strokeStyle='rgba(255,255,255,0.2)';minimapCtx.lineWidth=1;minimapCtx.strokeRect((camera.x-canvas.width/2)*sx,(camera.y-canvas.height/2)*sy,canvas.width*sx,canvas.height*sy);
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(){update();render();requestAnimationFrame(gameLoop);}
gameLoop();
</script>
