<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DEAD ZONE — Zombie Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace;
  user-select: none; -webkit-user-select: none; touch-action: none;
  -webkit-touch-callout: none; position: fixed; width: 100%; height: 100%;
}
body.desktop { cursor: crosshair; }
canvas#game { display: block; position: fixed; top: 0; left: 0; }

#top-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 20; pointer-events: none; text-shadow: 1px 1px 3px #000; }
#top-hud .score { font-size: 28px; font-weight: bold; color: #fff; }
#top-hud .wave { color: #f04040; font-size: 13px; }
#top-hud .kills { color: #aaa; font-size: 11px; }

#health-hud { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); width: 160px; z-index: 20; pointer-events: none; }
#health-hud .bar-bg { width: 100%; height: 6px; background: #333; border: 1px solid #555; border-radius: 3px; }
#health-hud .bar { height: 100%; background: #4f4; border-radius: 3px; transition: width 0.2s, background 0.2s; }
#health-hud .hp-text { color: #aaa; font-size: 10px; text-align: center; margin-top: 2px; text-shadow: 1px 1px 2px #000; }

#ammo-hud { position: fixed; z-index: 20; pointer-events: none; text-shadow: 1px 1px 2px #000; text-align: center; }
body.desktop #ammo-hud { bottom: 20px; left: 20px; text-align: left; }
body.mobile #ammo-hud { bottom: 195px; left: 50%; transform: translateX(-50%); }
#ammo-hud .weapon-name { font-size: 14px; font-weight: bold; color: #f0c040; text-transform: uppercase; letter-spacing: 1px; }
#ammo-hud .ammo { font-size: 22px; font-weight: bold; color: #fff; }
#ammo-hud .ammo .slash { color: #666; font-size: 14px; }
#ammo-hud .ammo .reserve { color: #999; font-size: 14px; }
#ammo-hud .ammo.reloading { color: #f04040; font-size: 16px; }

#weapon-slots { position: fixed; z-index: 25; display: flex; gap: 4px; }
body.desktop #weapon-slots { bottom: 70px; left: 20px; flex-direction: row; pointer-events: none; }
body.mobile #weapon-slots { right: 8px; top: 100px; flex-direction: column; }
.weapon-slot { width: 44px; height: 44px; border: 2px solid #444; border-radius: 8px; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; font-size: 8px; color: #888; text-align: center; line-height: 1.1; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
body.mobile .weapon-slot { width: 42px; height: 42px; }
.weapon-slot.active { border-color: #f0c040; color: #f0c040; background: rgba(240,192,64,0.15); }
.weapon-slot .key { position: absolute; top: 2px; left: 4px; font-size: 8px; color: #666; }
.weapon-slot.active .key { color: #f0c040; }
body.mobile .weapon-slot .key { display: none; }

.joystick-zone { position: fixed; bottom: 0; width: 50%; height: 240px; z-index: 15; display: none; }
body.mobile .joystick-zone { display: block; }
#joystick-left { left: 0; }
#joystick-right { right: 0; }

#mobile-buttons { position: fixed; z-index: 25; display: none; }
body.mobile #mobile-buttons { display: flex; flex-direction: row; gap: 10px; right: 8px; bottom: 245px; }
.mobile-btn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #555; background: rgba(0,0,0,0.6); color: #aaa; font-size: 9px; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: center; line-height: 1.1; }
.mobile-btn:active, .mobile-btn.pressed { background: rgba(255,255,255,0.15); border-color: #aaa; color: #fff; }
.mobile-btn.dash-ready { border-color: #4af; color: #4af; }
.mobile-btn.dash-cooldown { border-color: #333; color: #444; }

#minimap { position: fixed; top: 10px; left: 10px; width: 90px; height: 90px; border: 1px solid #333; background: rgba(0,0,0,0.5); z-index: 20; pointer-events: none; }
body.desktop #minimap { width: 130px; height: 130px; }

/* ---- Screen overlays ---- */
.screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.screen-overlay h1 { font-size: clamp(36px, 10vw, 72px); color: #f04040; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 0 30px rgba(240,64,64,0.5); }
.screen-overlay .subtitle { color: #888; font-size: clamp(12px, 3vw, 18px); letter-spacing: 3px; margin-bottom: 40px; }
.screen-overlay .stats { color: #aaa; font-size: 15px; margin-bottom: 20px; line-height: 2; text-align: center; }
.screen-overlay .stats .val { color: #fff; font-weight: bold; }
.screen-overlay .highscore { color: #f0c040; font-size: 13px; margin-top: 8px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ---- Menu buttons ---- */
.menu-btn {
  display: inline-block; padding: 14px 36px; margin: 8px;
  font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold;
  color: #fff; background: rgba(255,255,255,0.08); border: 2px solid #555;
  cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
  -webkit-tap-highlight-color: transparent; transition: background 0.15s, border-color 0.15s;
}
.menu-btn:hover, .menu-btn:active { background: rgba(255,255,255,0.15); border-color: #aaa; }
.menu-btn.primary { border-color: #f0c040; color: #f0c040; }
.menu-btn.primary:hover { background: rgba(240,192,64,0.15); }
.menu-btn.danger { border-color: #f04040; color: #f04040; }

.menu-input {
  padding: 10px 16px; margin: 6px; font-family: 'Courier New', monospace; font-size: 18px;
  color: #fff; background: rgba(255,255,255,0.06); border: 2px solid #555;
  text-align: center; letter-spacing: 4px; text-transform: uppercase; outline: none; width: 200px;
}
.menu-input:focus { border-color: #f0c040; }
.menu-input::placeholder { color: #444; letter-spacing: 1px; text-transform: none; }

.menu-label { color: #888; font-size: 12px; margin-top: 12px; margin-bottom: 4px; }
.menu-error { color: #f44; font-size: 13px; margin-top: 8px; min-height: 18px; }
.menu-info { color: #aaa; font-size: 13px; margin-top: 6px; }

/* Lobby */
.lobby-code { font-size: 48px; color: #f0c040; letter-spacing: 12px; font-weight: bold; margin: 16px 0; text-shadow: 0 0 20px rgba(240,192,64,0.3); }
.lobby-players { list-style: none; margin: 16px 0; }
.lobby-players li { font-size: 16px; color: #ccc; padding: 6px 0; display: flex; align-items: center; gap: 10px; justify-content: center; }
.lobby-players .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.lobby-players .host-tag { color: #f0c040; font-size: 11px; }
.lobby-waiting { color: #666; font-size: 14px; animation: pulse 1.5s ease-in-out infinite; margin-top: 12px; }

#wave-announce { position: fixed; top: 30%; width: 100%; text-align: center; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#wave-announce .wave-num { font-size: clamp(36px, 8vw, 64px); color: #f04040; font-weight: bold; text-shadow: 0 0 20px rgba(240,64,64,0.5); }
#wave-announce .wave-sub { font-size: clamp(12px, 3vw, 18px); color: #999; margin-top: 6px; }
#pickup-msg { position: fixed; top: 55%; width: 100%; text-align: center; z-index: 30; pointer-events: none; font-size: 16px; color: #4f4; opacity: 0; text-shadow: 0 0 10px rgba(64,255,64,0.4); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap"></canvas>

<div id="top-hud"><div class="score" id="score">0</div><div class="wave" id="wave-display">WAVE 1</div><div class="kills" id="kills-display">0 KILLS</div></div>
<div id="health-hud"><div class="bar-bg"><div class="bar" id="health-bar"></div></div><div class="hp-text" id="health-text">100 HP</div></div>
<div id="ammo-hud"><div class="weapon-name" id="weapon-name">PISTOL</div><div class="ammo" id="ammo-display">12 <span class="slash">/</span> <span class="reserve">∞</span></div></div>
<div id="weapon-slots"></div>
<div id="mobile-buttons">
  <div class="mobile-btn dash-ready" id="btn-dash">DASH</div>
  <div class="mobile-btn" id="btn-reload">RLD</div>
</div>
<div class="joystick-zone" id="joystick-left"></div>
<div class="joystick-zone" id="joystick-right"></div>
<div id="wave-announce"><div class="wave-num" id="wave-num"></div><div class="wave-sub" id="wave-sub"></div></div>
<div id="pickup-msg"></div>

<!-- ---- MAIN MENU ---- -->
<div class="screen-overlay" id="start-screen">
  <h1>DEAD ZONE</h1>
  <div class="subtitle">ZOMBIE SHOOTER</div>
  <div style="margin-top:10px">
    <div class="menu-btn primary" id="btn-solo">SOLO</div>
    <div class="menu-btn" id="btn-multi">MULTIPLAYER</div>
  </div>
  <div style="color:#666;font-size:11px;margin-top:30px" id="start-controls"></div>
</div>

<!-- ---- MULTIPLAYER MENU ---- -->
<div class="screen-overlay" id="multi-screen" style="display:none">
  <h1 style="font-size:clamp(24px,6vw,48px)">MULTIPLAYER</h1>
  <div class="menu-label">YOUR NAME</div>
  <input class="menu-input" id="name-input" placeholder="Name" maxlength="16" value="">
  <div style="margin-top:20px">
    <div class="menu-btn primary" id="btn-create">CREATE LOBBY</div>
  </div>
  <div class="menu-label" style="margin-top:24px">OR JOIN WITH CODE</div>
  <input class="menu-input" id="code-input" placeholder="CODE" maxlength="4">
  <div style="margin-top:8px">
    <div class="menu-btn" id="btn-join">JOIN</div>
  </div>
  <div class="menu-error" id="multi-error"></div>
  <div class="menu-btn danger" id="btn-back-main" style="margin-top:24px;font-size:12px;padding:8px 20px">BACK</div>
</div>

<!-- ---- LOBBY SCREEN ---- -->
<div class="screen-overlay" id="lobby-screen" style="display:none">
  <div style="color:#888;font-size:14px">LOBBY CODE</div>
  <div class="lobby-code" id="lobby-code">----</div>
  <div style="color:#666;font-size:11px">Share this code with friends</div>
  <ul class="lobby-players" id="lobby-players"></ul>
  <div class="menu-btn primary" id="btn-start-game" style="display:none">START GAME</div>
  <div class="lobby-waiting" id="lobby-waiting">Waiting for host to start...</div>
  <div class="menu-btn danger" id="btn-leave" style="margin-top:16px;font-size:12px;padding:8px 20px">LEAVE</div>
</div>

<!-- ---- DEATH SCREEN ---- -->
<div class="screen-overlay" id="death-screen" style="display:none">
  <h1>DEAD</h1>
  <div class="stats" id="death-stats"></div>
  <div class="menu-btn primary" id="btn-restart">PLAY AGAIN</div>
  <div class="highscore" id="highscore-display"></div>
</div>

<script>
// ============================================================
// DEAD ZONE — Multiplayer Top-Down Zombie Shooter
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');

const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 1024);
document.body.classList.add(isMobile ? 'mobile' : 'desktop');

const controlsEl = document.getElementById('start-controls');
if (!isMobile) controlsEl.innerHTML = '<span style="color:#999">WASD</span> Move <span style="color:#999">MOUSE</span> Aim <span style="color:#999">CLICK</span> Shoot <span style="color:#999">R</span> Reload <span style="color:#999">SPACE</span> Dash <span style="color:#999">E</span> Pickup <span style="color:#999">1-0</span> Weapons';
else controlsEl.innerHTML = 'Left thumb: Move | Right thumb: Aim+Shoot';

// ---- CONSTANTS ----
const ARENA_W = 3000, ARENA_H = 3000, CELL_SIZE = 40;
const GRID_W = Math.floor(ARENA_W / CELL_SIZE), GRID_H = Math.floor(ARENA_H / CELL_SIZE);
const TILE_SIZE = 80, PLAYER_RADIUS = 14;
const DASH_COOLDOWN = 2000, DASH_DURATION = 150, DASH_SPEED = 12;
const PICKUP_RANGE = 50, JOYSTICK_MAX = 60;
const PLAYER_COLORS = ['#4af','#f44','#4f4','#fa4'];
const NET_SEND_RATE = 3; // send state every N frames (~20fps)

// ---- GAME STATE ----
let gameState = 'menu'; // menu, multi_menu, lobby, playing, dead
let score = 0, kills = 0, wave = 1, waveTimer = 0, waveZombiesLeft = 0, waveActive = false;
let highScore = parseInt(localStorage.getItem('deadzone_highscore') || '0');
let screenShake = { x: 0, y: 0, intensity: 0, decay: 0.9 };
let gameTime = 0;

// ---- MULTIPLAYER STATE ----
let ws = null;
let myId = null;
let isHost = false;
let lobbyCode = '';
let lobbySeed = 0;
let lobbyPlayers = []; // { id, name, color }
let isMultiplayer = false;
let remoteInputs = {}; // id -> { dx, dy, angle, firing, dash, reload, weapon }

// ---- INPUT ----
const keys = {};
let mouse = { x: 0, y: 0, down: false, worldX: 0, worldY: 0 };
let leftJoystick = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0, nx: 0, ny: 0 };
let rightJoystick = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0, nx: 0, ny: 0, firing: false };

// ---- CAMERA ----
let camera = { x: 0, y: 0 };

// ---- PLAYERS (multiplayer array) ----
let players = []; // array of player objects; index 0 is always local in solo
let localPlayerIdx = 0;

function getLocalPlayer() { return players[localPlayerIdx]; }

function createPlayerObj(id, name, color, x, y) {
  return {
    id, name, color, x, y, vx: 0, vy: 0, angle: 0,
    hp: 100, maxHp: 100, speed: 3.5,
    weapons: [createWeapon('pistol')], currentWeapon: 0,
    dashCooldown: 0, dashTimer: 0, dashAngle: 0,
    invincible: 0, damageFlash: 0, alive: true,
    burstLeft: 0, burstTimer: 0,
  };
}

// ---- WEAPONS ----
const WEAPON_DEFS = {
  pistol: { name: 'Pistol', color: '#ccc', bulletColor: '#ff0', damage: 25, fireRate: 250, bulletSpeed: 14, spread: 0.04, magSize: 12, reloadTime: 1200, bulletSize: 3, knockback: 2, pierce: 0, infinite: true, shakeIntensity: 2, sound: { freq: 600, duration: 0.05, type: 'square' } },
  revolver: { name: 'Revolver', color: '#daa', bulletColor: '#fa0', damage: 45, fireRate: 500, bulletSpeed: 16, spread: 0.03, magSize: 6, reloadTime: 1800, bulletSize: 4, knockback: 6, pierce: 0, infinite: false, totalAmmo: 36, shakeIntensity: 4, sound: { freq: 350, duration: 0.08, type: 'square' } },
  smg: { name: 'SMG', color: '#7af', bulletColor: '#7df', damage: 12, fireRate: 80, bulletSpeed: 16, spread: 0.12, magSize: 30, reloadTime: 1500, bulletSize: 2, knockback: 1, pierce: 0, infinite: false, totalAmmo: 150, shakeIntensity: 1.5, sound: { freq: 800, duration: 0.03, type: 'square' } },
  burst: { name: 'Burst', color: '#af7', bulletColor: '#af7', damage: 20, fireRate: 400, bulletSpeed: 18, spread: 0.05, magSize: 24, reloadTime: 1800, burst: 3, burstDelay: 50, bulletSize: 3, knockback: 2, pierce: 0, infinite: false, totalAmmo: 96, shakeIntensity: 2, sound: { freq: 700, duration: 0.03, type: 'square' } },
  shotgun: { name: 'Shotgun', color: '#fa4', bulletColor: '#fa0', damage: 18, fireRate: 600, bulletSpeed: 12, spread: 0.2, magSize: 6, reloadTime: 2000, pellets: 7, bulletSize: 3, knockback: 6, pierce: 0, infinite: false, totalAmmo: 36, shakeIntensity: 5, sound: { freq: 200, duration: 0.1, type: 'sawtooth' } },
  rifle: { name: 'Rifle', color: '#4f4', bulletColor: '#4f4', damage: 60, fireRate: 800, bulletSpeed: 22, spread: 0.01, magSize: 5, reloadTime: 2200, bulletSize: 4, knockback: 8, pierce: 2, tracer: true, infinite: false, totalAmmo: 30, shakeIntensity: 6, sound: { freq: 150, duration: 0.12, type: 'sawtooth' } },
  minigun: { name: 'Minigun', color: '#aaf', bulletColor: '#adf', damage: 8, fireRate: 35, bulletSpeed: 18, spread: 0.18, magSize: 100, reloadTime: 4000, bulletSize: 2, knockback: 0.5, pierce: 0, infinite: false, totalAmmo: 300, shakeIntensity: 1, sound: { freq: 900, duration: 0.02, type: 'square' } },
  flamethrower: { name: 'Flame', color: '#f60', bulletColor: '#f80', damage: 5, fireRate: 40, bulletSpeed: 7, spread: 0.3, magSize: 100, reloadTime: 3000, bulletSize: 6, knockback: 0.5, pierce: 1, infinite: false, totalAmmo: 200, shakeIntensity: 0.5, flame: true, bulletLife: 20, sound: { freq: 100, duration: 0.02, type: 'sawtooth' } },
  laser: { name: 'Laser', color: '#f4f', bulletColor: '#f4f', damage: 3, fireRate: 20, bulletSpeed: 30, spread: 0.02, magSize: 80, reloadTime: 2500, bulletSize: 2, knockback: 0, pierce: 99, tracer: true, infinite: false, totalAmmo: 240, shakeIntensity: 0.3, sound: { freq: 1200, duration: 0.01, type: 'sine' } },
  rpg: { name: 'RPG', color: '#f44', bulletColor: '#f00', damage: 150, fireRate: 1500, bulletSpeed: 8, spread: 0.02, magSize: 1, reloadTime: 2500, bulletSize: 6, knockback: 15, pierce: 0, infinite: false, totalAmmo: 8, shakeIntensity: 10, explosive: true, explosionRadius: 80, sound: { freq: 80, duration: 0.2, type: 'sawtooth' } },
};
function createWeapon(type) { const d = WEAPON_DEFS[type]; return { type, ammo: d.magSize, reserveAmmo: d.infinite ? Infinity : d.totalAmmo, reloading: false, reloadTimer: 0, lastFired: 0, muzzleFlash: 0, burstLeft: 0, burstTimer: 0 }; }

// ---- ENTITIES ----
let bullets = [], zombies = [], particles = [], pickups = [], decals = [], floatingTexts = [], explosions = [], obstacles = [];
let dungeonGrid = null, rooms = [];

const ZOMBIE_TYPES = {
  normal: { hp: 50, speed: 1.2, radius: 12, color: '#5a5', damage: 10, score: 100 },
  fast: { hp: 30, speed: 2.8, radius: 10, color: '#7a5', damage: 8, score: 150 },
  tank: { hp: 200, speed: 0.7, radius: 18, color: '#585', damage: 20, score: 300 },
  spitter: { hp: 40, speed: 1.0, radius: 11, color: '#5a8', damage: 8, score: 200, ranged: true, fireRate: 2000 },
  exploder: { hp: 60, speed: 1.8, radius: 14, color: '#a55', damage: 30, score: 250, explodeOnDeath: true, explosionRadius: 60 },
};

// ---- AUDIO ----
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type='square', vol=0.15) {
  if (!audioCtx) return;
  try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(freq*0.5, audioCtx.currentTime+dur); g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur); } catch(e) {}
}
function playHitSound() { playSound(300,0.05,'sine',0.1); }
function playDeathSound() { playSound(100,0.2,'sawtooth',0.12); }
function playPickupSound() { playSound(880,0.1,'sine',0.15); playSound(1200,0.1,'sine',0.1); }
function playDashSound() { playSound(400,0.1,'sine',0.1); }
function playHurtSound() { playSound(200,0.15,'sawtooth',0.15); }
function playExplosionSound() { playSound(60,0.3,'sawtooth',0.25); playSound(40,0.4,'square',0.15); }

// ============================================================
// DUNGEON GENERATOR (seeded)
// ============================================================
function seededRandom(seed) { let s = seed; return function() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }

function generateDungeon(seed) {
  const rng = seededRandom(seed || Date.now());
  dungeonGrid = [];
  for (let y = 0; y < GRID_H; y++) { dungeonGrid[y] = []; for (let x = 0; x < GRID_W; x++) dungeonGrid[y][x] = false; }
  rooms = [];
  const cr = { x: Math.floor(GRID_W/2)-5, y: Math.floor(GRID_H/2)-5, w: 10, h: 10 };
  carveRoom(cr); rooms.push(cr);
  const numRooms = 10 + Math.floor(rng() * 6);
  for (let att = 0; att < 200 && rooms.length < numRooms + 1; att++) {
    const w = 5+Math.floor(rng()*8), h = 5+Math.floor(rng()*8);
    const x = 2+Math.floor(rng()*(GRID_W-w-4)), y = 2+Math.floor(rng()*(GRID_H-h-4));
    const room = { x, y, w, h };
    let ov = false;
    for (const r of rooms) { if (room.x < r.x+r.w+2 && room.x+room.w+2 > r.x && room.y < r.y+r.h+2 && room.y+room.h+2 > r.y) { ov = true; break; } }
    if (!ov) { carveRoom(room); rooms.push(room); }
  }
  const conn = [0], unconn = rooms.slice(1).map((_,i) => i+1);
  while (unconn.length > 0) {
    let bd = Infinity, bc = 0, bu = 0, bui = 0;
    for (const ci of conn) { for (let ui = 0; ui < unconn.length; ui++) { const ri = unconn[ui]; const d = Math.abs(rooms[ci].x+rooms[ci].w/2-rooms[ri].x-rooms[ri].w/2)+Math.abs(rooms[ci].y+rooms[ci].h/2-rooms[ri].y-rooms[ri].h/2); if (d < bd) { bd=d; bc=ci; bu=ri; bui=ui; } } }
    carveCorridor(rooms[bc], rooms[bu]); conn.push(bu); unconn.splice(bui, 1);
  }
  obstacles = [];
  for (let y = 0; y < GRID_H; y++) { let rs = -1; for (let x = 0; x <= GRID_W; x++) { const isW = x < GRID_W ? !dungeonGrid[y][x] : true; if (isW && rs === -1) rs = x; else if (!isW && rs !== -1) { obstacles.push({ x: rs*CELL_SIZE, y: y*CELL_SIZE, w: (x-rs)*CELL_SIZE, h: CELL_SIZE, color: `hsl(${25+(rs*y)%15},${8+(x*y)%6}%,${14+(rs+y)%5}%)` }); rs = -1; } } }
}

// ============================================================
// NETWORKING
// ============================================================
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}`;
  ws = new WebSocket(url);
  ws.onopen = () => console.log('Connected to server');
  ws.onclose = () => { console.log('Disconnected'); ws = null; };
  ws.onerror = (e) => { showMultiError('Connection failed. Is the server running?'); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleServerMessage(msg);
  };
}

function sendMsg(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'lobby_created':
      myId = msg.playerId; lobbyCode = msg.code; lobbySeed = msg.seed; isHost = true;
      showLobbyScreen();
      break;
    case 'lobby_joined':
      myId = msg.playerId; lobbyCode = msg.code; lobbySeed = msg.seed; isHost = false;
      showLobbyScreen();
      break;
    case 'lobby_update':
      lobbyPlayers = msg.players;
      isHost = msg.hostId === myId;
      updateLobbyUI();
      break;
    case 'game_start':
      lobbySeed = msg.seed;
      startMultiplayerGame();
      break;
    case 'game_state':
      if (!isHost) applyHostState(msg);
      break;
    case 'player_input':
      if (isHost) remoteInputs[msg.fromId] = msg.input;
      break;
    case 'player_disconnected':
      // Remove disconnected player
      const pi = players.findIndex(p => p.id === msg.playerId);
      if (pi !== -1) { players[pi].alive = false; players[pi].hp = 0; }
      break;
    case 'game_over':
      if (!isHost) showDeathScreen();
      break;
    case 'error':
      showMultiError(msg.message);
      break;
  }
}

function showMultiError(txt) { document.getElementById('multi-error').textContent = txt; }

function showScreen(id) {
  ['start-screen','multi-screen','lobby-screen','death-screen'].forEach(s => document.getElementById(s).style.display = 'none');

  ul.innerHTML = lobbyPlayers.map(p =>
    `<li><span class="dot" style="background:${p.color}"></span>${p.name} ${p.id === myId ? '(You)' : ''} ${isHost && p.id === myId ? '<span class="host-tag">HOST</span>' : ''}</li>`
  ).join('');
  document.getElementById('btn-start-game').style.display = isHost && lobbyPlayers.length >= 2 ? 'inline-block' : 'none';
  document.getElementById('lobby-waiting').style.display = isHost ? 'none' : 'block';

function showDeathScreen() {
  gameState = 'dead';
  if (score > highScore) { highScore = score; localStorage.setItem('deadzone_highscore', highScore.toString()); }
  document.getElementById('death-stats').innerHTML = `Score: <span class="val">${score.toLocaleString()}</span><br>Kills: <span class="val">${kills}</span><br>Wave: <span class="val">${wave}</span>`;
  document.getElementById('highscore-display').textContent = `HIGH SCORE: ${highScore.toLocaleString()}`;

function startSoloGame() {
  initAudio(); isMultiplayer = false; isHost = true;
  gameState = 'playing'; score = 0; kills = 0; wave = 0; gameTime = 0;
  generateDungeon(Date.now());
  const c = getRoomCenter(rooms[0]);
  players = [createPlayerObj(0, 'You', PLAYER_COLORS[0], c.x, c.y)];
  localPlayerIdx = 0;
  bullets = []; zombies = []; particles = []; pickups = []; decals = []; floatingTexts = []; explosions = [];
  camera.x = c.x; camera.y = c.y;
  showScreen(null); nextWave();
}

function startMultiplayerGame() {
  initAudio(); isMultiplayer = true; gameState = 'playing';
  score = 0; kills = 0; wave = 0; gameTime = 0;
  generateDungeon(lobbySeed);
  const c = getRoomCenter(rooms[0]);
  players = [];
  for (let i = 0; i < lobbyPlayers.length; i++) {
    const lp = lobbyPlayers[i];
    // Spread players around center room
    const angle = (i / lobbyPlayers.length) * Math.PI * 2;
    const px = c.x + Math.cos(angle) * 40, py = c.y + Math.sin(angle) * 40;
    players.push(createPlayerObj(lp.id, lp.name, lp.color, px, py));
    if (lp.id === myId) localPlayerIdx = i;
  }
  remoteInputs = {};
  bullets = []; zombies = []; particles = []; pickups = []; decals = []; floatingTexts = []; explosions = [];
  camera.x = c.x; camera.y = c.y;
  showScreen(null);
  if (isHost) nextWave();
}

// Touch
function handleTouchStart(e) { e.preventDefault(); if (gameState !== 'playing') return; for (const t of e.changedTouches) { const tx=t.clientX,ty=t.clientY,el=document.elementFromPoint(tx,ty); if (el&&(el.classList.contains('weapon-slot')||el.classList.contains('mobile-btn'))) continue; const hw=window.innerWidth/2; if (tx<hw&&!leftJoystick.active) { leftJoystick.active=true;leftJoystick.id=t.identifier;leftJoystick.cx=tx;leftJoystick.cy=ty;leftJoystick.dx=0;leftJoystick.dy=0;leftJoystick.nx=0;leftJoystick.ny=0; } else if (tx>=hw&&!rightJoystick.active) { rightJoystick.active=true;rightJoystick.id=t.identifier;rightJoystick.cx=tx;rightJoystick.cy=ty;rightJoystick.dx=0;rightJoystick.dy=0;rightJoystick.nx=0;rightJoystick.ny=0;rightJoystick.firing=false; } } }

function switchWeapon(idx) { const lp=getLocalPlayer(); if(lp&&lp.alive&&idx>=0&&idx<lp.weapons.length){lp.currentWeapon=idx;lp.weapons[idx].reloading=false;} }
function reloadWeapon() { const lp=getLocalPlayer(); if(!lp||!lp.alive) return; const w=lp.weapons[lp.currentWeapon],d=WEAPON_DEFS[w.type]; if(w.reloading||w.ammo===d.magSize||w.reserveAmmo===0) return; w.reloading=true;w.reloadTimer=d.reloadTime;playSound(400,0.05,'sine',0.08); }

function fireWeaponForPlayer(p) {
  const w=p.weapons[p.currentWeapon],d=WEAPON_DEFS[w.type],now=performance.now();
  if(w.reloading) return; if(w.ammo<=0){if(p===getLocalPlayer())reloadWeapon();return;} if(now-w.lastFired<d.fireRate) return;
  if(d.burst&&d.burst>1){w.burstLeft=d.burst-1;w.burstTimer=d.burstDelay;}
  fireSingleShot(p,w,d);
}
function fireSingleShot(p,w,d) {

  const pellets=d.pellets||1;
  for(let i=0;i<pellets;i++){const sp=(Math.random()-0.5)*d.spread*2,a=p.angle+sp,c=Math.cos(a),s=Math.sin(a); bullets.push({x:p.x+c*22,y:p.y+s*22,vx:c*d.bulletSpeed,vy:s*d.bulletSpeed,damage:d.damage,color:d.bulletColor,size:d.bulletSize,knockback:d.knockback,pierce:d.pierce,pierced:0,life:d.bulletLife||60,flame:d.flame||false,explosive:d.explosive||false,explosionRadius:d.explosionRadius||0,tracer:d.tracer||false,owner:'player',ownerId:p.id,trail:[]});}
  playSound(d.sound.freq,d.sound.duration,d.sound.type,0.12);
  if(p===getLocalPlayer()) screenShake.intensity=Math.max(screenShake.intensity,d.shakeIntensity);
  const c2=Math.cos(p.angle),s2=Math.sin(p.angle);
  for(let i=0;i<3;i++) particles.push({x:p.x+c2*24,y:p.y+s2*24,vx:c2*(3+Math.random()*3)+(Math.random()-0.5)*2,vy:s2*(3+Math.random()*3)+(Math.random()-0.5)*2,life:8+Math.random()*6,maxLife:14,size:2+Math.random()*2,color:d.bulletColor,type:'spark'});
  particles.push({x:p.x+(-s2)*8,y:p.y+c2*8,vx:(-s2)*(2+Math.random())+(Math.random()-0.5),vy:c2*(2+Math.random())+(Math.random()-0.5),life:30,maxLife:30,size:2,color:'#da3',type:'casing',gravity:0.1});

function dash() {
  const lp=getLocalPlayer(); if(!lp||!lp.alive||lp.dashCooldown>0||lp.dashTimer>0) return;
  let dx=0,dy=0;
  if(isMobile&&leftJoystick.active){dx=leftJoystick.nx;dy=leftJoystick.ny;} else {if(keys['w'])dy-=1;if(keys['s'])dy+=1;if(keys['a'])dx-=1;if(keys['d'])dx+=1;}
  if(dx===0&&dy===0){dx=Math.cos(lp.angle);dy=Math.sin(lp.angle);}
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  lp.dashAngle=Math.atan2(dy/len,dx/len);lp.dashTimer=DASH_DURATION;lp.dashCooldown=DASH_COOLDOWN;lp.invincible=DASH_DURATION;
  playDashSound();

function tryPickup() {
  const lp=getLocalPlayer(); if(!lp||!lp.alive) return;
  for(let i=pickups.length-1;i>=0;i--){ const p=pickups[i],dx=lp.x-p.x,dy=lp.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<PICKUP_RANGE){
      if(p.type==='weapon'){const ex=lp.weapons.find(w=>w.type===p.weaponType);if(ex){const d=WEAPON_DEFS[p.weaponType];ex.reserveAmmo=Math.min(ex.reserveAmmo+d.totalAmmo,d.totalAmmo*2);showPickupMsg(`+${d.totalAmmo} ${d.name} AMMO`);}else{lp.weapons.push(createWeapon(p.weaponType));lp.currentWeapon=lp.weapons.length-1;showPickupMsg(`${WEAPON_DEFS[p.weaponType].name} ACQUIRED`);}playPickupSound();pickups.splice(i,1);}
      else if(p.type==='health'){if(lp.hp<lp.maxHp){lp.hp=Math.min(lp.maxHp,lp.hp+p.amount);showPickupMsg(`+${p.amount} HP`);playPickupSound();pickups.splice(i,1);}}
      else if(p.type==='ammo'){const w=lp.weapons[lp.currentWeapon],d=WEAPON_DEFS[w.type];if(!d.infinite){w.reserveAmmo+=d.magSize*3;showPickupMsg(`+AMMO`);playPickupSound();pickups.splice(i,1);}}
    }
  }
}

function nextWave() { wave++;waveActive=true;waveZombiesLeft=5+wave*3+Math.floor(wave*wave*0.3);waveTimer=0;announceWave(wave);if(wave>1&&wave%2===0)spawnWeaponPickup();spawnHealthPickup(); }
function announceWave(n) { const el=document.getElementById('wave-announce');document.getElementById('wave-num').textContent=`WAVE ${n}`;const s=['Here they come...','Stay alive.','Lock and load.','No mercy.','They\'re hungry...','Hold the line.'];document.getElementById('wave-sub').textContent=s[Math.floor(Math.random()*s.length)];el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000); }

function spawnWeaponPickup() { const ts=['revolver','smg','burst','shotgun','rifle','minigun','flamethrower','laser','rpg'],t=ts[Math.floor(Math.random()*ts.length)],p=getRandomFloorPos();pickups.push({type:'weapon',weaponType:t,x:p.x,y:p.y,bobTimer:Math.random()*Math.PI*2}); }

function getNearestAlivePlayer(x,y) { let best=null,bd=Infinity; for(const p of players){if(!p.alive)continue;const d=Math.sqrt((p.x-x)**2+(p.y-y)**2);if(d<bd){bd=d;best=p;}} return {player:best,dist:bd}; }

function spawnZombie() {
  const ts=getZombieTypesForWave(wave),tk=ts[Math.floor(Math.random()*ts.length)],t=ZOMBIE_TYPES[tk];
  let br=null; for(let i=1;i<rooms.length;i++){const c=getRoomCenter(rooms[i]);const{dist:d}=getNearestAlivePlayer(c.x,c.y);if(d>400&&(br===null||Math.random()<0.3))br=rooms[i];}
  if(!br) br=rooms[1+Math.floor(Math.random()*(rooms.length-1))]||rooms[0];
  const x=(br.x+1+Math.random()*(br.w-2))*CELL_SIZE,y=(br.y+1+Math.random()*(br.h-2))*CELL_SIZE,sc=1+(wave-1)*0.08;
  zombies.push({x,y,vx:0,vy:0,hp:t.hp*sc,maxHp:t.hp*sc,speed:t.speed+(wave-1)*0.02,radius:t.radius,color:t.color,damage:t.damage,score:t.score,type:tk,attackCooldown:0,hitFlash:0,ranged:t.ranged||false,fireRate:t.fireRate||0,lastFired:0,explodeOnDeath:t.explodeOnDeath||false,explosionRadius:t.explosionRadius||0,angle:0,staggerTimer:0,aware:false,wanderAngle:Math.random()*Math.PI*2,wanderTimer:60+Math.floor(Math.random()*120),stuckTimer:0,lastX:0,lastY:0});
}
function getZombieTypesForWave(w) { const t=['normal'];if(w>=2)t.push('fast');if(w>=3)t.push('tank');if(w>=4)t.push('spitter');if(w>=5)t.push('exploder');if(w<5){t.push('normal');t.push('normal');}return t; }

function createExplosion(x,y,radius,damage,source='player') {
  explosions.push({x,y,radius,life:15,maxLife:15});screenShake.intensity=Math.max(screenShake.intensity,12);playExplosionSound();
  if(source==='player'){for(const z of zombies){const dx=z.x-x,dy=z.y-y,d=Math.sqrt(dx*dx+dy*dy);if(d<radius+z.radius)damageZombie(z,damage*(1-d/(radius+z.radius)),dx/d*10,dy/d*10);}}
  if(source!=='player'||source==='any'){for(const p of players){if(!p.alive)continue;const dx=p.x-x,dy=p.y-y;if(Math.sqrt(dx*dx+dy*dy)<radius+PLAYER_RADIUS)damagePlayerObj(p,damage*0.5);}}
  for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,maxLife:40,size:3+Math.random()*4,color:Math.random()>0.5?'#f80':'#fa0',type:'explosion'});}
  for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*30,maxLife:60,size:5+Math.random()*6,color:'#555',type:'smoke'});}
}
function damageZombie(z,damage,kbx=0,kby=0) {
  z.hp-=damage;z.hitFlash=6;z.vx+=kbx;z.vy+=kby;z.staggerTimer=5;z.aware=true;
  for(let i=0;i<4;i++)particles.push({x:z.x,y:z.y,vx:(Math.random()-0.5)*4+kbx*0.3,vy:(Math.random()-0.5)*4+kby*0.3,life:15+Math.random()*10,maxLife:25,size:2+Math.random()*3,color:'#a22',type:'blood'});
  if(Math.random()>0.5)decals.push({x:z.x+(Math.random()-0.5)*10,y:z.y+(Math.random()-0.5)*10,size:4+Math.random()*8,alpha:0.4+Math.random()*0.3,color:'#311'});
  playHitSound();
}
function damagePlayerObj(p,damage) {
  if(p.invincible>0) return;
  p.hp-=damage;p.damageFlash=15;p.invincible=300;
  if(p===getLocalPlayer()){playHurtSound();screenShake.intensity=Math.max(screenShake.intensity,5);}
  if(p.hp<=0){p.alive=false;p.hp=0;
    // Check if all players dead
    if(!players.some(pp=>pp.alive)){if(isHost&&isMultiplayer)sendMsg({type:'game_over'});showDeathScreen();}
  }
}
function addFloatingText(x,y,text,color='#fff'){floatingTexts.push({x,y,text,color,vy:-1.5,life:40,maxLife:40});}

function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}
function lerp(a,b,t){return a+(b-a)*t;}

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (gameState !== 'playing') return;
  gameTime++;

  const lp = getLocalPlayer();
  if (!lp) return;

  // ---- Local player input ----
  if (lp.alive) {
    let dx=0,dy=0;
    if(isMobile){dx=leftJoystick.nx;dy=leftJoystick.ny;}else{if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;}
    if(lp.dashTimer>0){lp.dashTimer-=16.67;lp.vx=Math.cos(lp.dashAngle)*DASH_SPEED;lp.vy=Math.sin(lp.dashAngle)*DASH_SPEED;if(gameTime%2===0)particles.push({x:lp.x,y:lp.y,vx:0,vy:0,life:10,maxLife:10,size:PLAYER_RADIUS,color:lp.color,type:'dashtrail'});}else{if(dx!==0&&dy!==0){const l=Math.sqrt(dx*dx+dy*dy);dx/=l;dy/=l;}lp.vx=dx*lp.speed;lp.vy=dy*lp.speed;}
    lp.x+=lp.vx;lp.y+=lp.vy;lp.x=clamp(lp.x,PLAYER_RADIUS,ARENA_W-PLAYER_RADIUS);lp.y=clamp(lp.y,PLAYER_RADIUS,ARENA_H-PLAYER_RADIUS);pushOutOfObstacles(lp,PLAYER_RADIUS);
    if(isMobile){if(rightJoystick.active&&rightJoystick.firing)lp.angle=Math.atan2(rightJoystick.ny,rightJoystick.nx);}else{mouse.worldX=mouse.x-canvas.width/2+camera.x;mouse.worldY=mouse.y-canvas.height/2+camera.y;lp.angle=Math.atan2(mouse.worldY-lp.y,mouse.worldX-lp.x);}
    if(lp.dashCooldown>0)lp.dashCooldown-=16.67;if(lp.invincible>0)lp.invincible-=16.67;if(lp.damageFlash>0)lp.damageFlash--;
    if(isMobile&&gameTime%5===0)tryPickup();

    const w=lp.weapons[lp.currentWeapon],def=WEAPON_DEFS[w.type];
    if(w.reloading){w.reloadTimer-=16.67;if(w.reloadTimer<=0){const needed=def.magSize-w.ammo;if(def.infinite)w.ammo=def.magSize;else{const fill=Math.min(needed,w.reserveAmmo);w.ammo+=fill;w.reserveAmmo-=fill;}w.reloading=false;playSound(600,0.05,'sine',0.1);}}
    if(w.muzzleFlash>0)w.muzzleFlash--;
    if(w.burstLeft>0){w.burstTimer-=16.67;if(w.burstTimer<=0&&w.ammo>0){fireSingleShot(lp,w,def);w.burstLeft--;w.burstTimer=def.burstDelay||50;}}
    const shouldFire=isMobile?rightJoystick.firing:mouse.down;
    if(shouldFire)fireWeaponForPlayer(lp);
  }

  // ---- Send input to host (non-host multiplayer) ----
  if (isMultiplayer && !isHost && gameTime % NET_SEND_RATE === 0) {
    sendMsg({ type: 'player_input', input: { x: lp.x, y: lp.y, angle: lp.angle, firing: isMobile ? rightJoystick.firing : mouse.down, weapon: lp.currentWeapon, hp: lp.hp, alive: lp.alive } });
  }

  // ---- Host: process remote player inputs ----
  if (isHost && isMultiplayer) {
    for (const p of players) {
      if (p.id === myId || !p.alive) continue;
      const inp = remoteInputs[p.id];
      if (inp) { p.x = inp.x; p.y = inp.y; p.angle = inp.angle; p.alive = inp.alive; p.hp = inp.hp; if (inp.firing) fireWeaponForPlayer(p); if (inp.weapon !== undefined && inp.weapon < p.weapons.length) p.currentWeapon = inp.weapon; }
    }
  }

  // ---- Host runs simulation ----
  if (isHost) {
    // Wave spawning
    if(waveActive){waveTimer++;const sr=Math.max(5,30-wave*2);if(waveZombiesLeft>0&&waveTimer%sr===0){spawnZombie();waveZombiesLeft--;}if(waveZombiesLeft<=0&&zombies.length===0){waveActive=false;waveTimer=0;}}else{waveTimer++;if(waveTimer>120)nextWave();}

    // Bullets
    for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.trail.push({x:b.x,y:b.y});if(b.trail.length>6)b.trail.shift();if(b.flame){b.vx*=0.96;b.vy*=0.96;b.size*=1.03;}b.x+=b.vx;b.y+=b.vy;b.life--;
      if(b.x<0||b.x>ARENA_W||b.y<0||b.y>ARENA_H){bullets.splice(i,1);continue;}if(obstacleCollision(b.x,b.y,b.size)){if(b.explosive)createExplosion(b.x,b.y,b.explosionRadius,b.damage);bullets.splice(i,1);continue;}if(b.life<=0){if(b.explosive)createExplosion(b.x,b.y,b.explosionRadius,b.damage);bullets.splice(i,1);continue;}
      if(b.owner==='player'){for(let j=zombies.length-1;j>=0;j--){const z=zombies[j];if(dist(b,z)<z.radius+b.size){const a=Math.atan2(b.vy,b.vx);damageZombie(z,b.damage,Math.cos(a)*b.knockback,Math.sin(a)*b.knockback);if(z.hp<=0){score+=z.score;kills++;addFloatingText(z.x,z.y-20,`+${z.score}`,'#ff0');if(z.explodeOnDeath)createExplosion(z.x,z.y,z.explosionRadius,z.damage*0.5,'any');for(let k=0;k<12;k++){const a2=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x:z.x,y:z.y,vx:Math.cos(a2)*s,vy:Math.sin(a2)*s,life:20+Math.random()*15,maxLife:35,size:3+Math.random()*4,color:'#622',type:'blood'});}decals.push({x:z.x,y:z.y,size:z.radius+5+Math.random()*10,alpha:0.3+Math.random()*0.2,color:'#211'});if(Math.random()<0.12)pickups.push({type:'health',amount:15,x:z.x,y:z.y,bobTimer:Math.random()*Math.PI*2});else if(Math.random()<0.25)pickups.push({type:'ammo',x:z.x,y:z.y,bobTimer:Math.random()*Math.PI*2});zombies.splice(j,1);}b.pierced++;if(b.pierced>b.pierce){if(b.explosive)createExplosion(b.x,b.y,b.explosionRadius,b.damage);bullets.splice(i,1);break;}}}}
      else if(b.owner==='zombie'){for(const p of players){if(!p.alive)continue;if(dist(b,p)<PLAYER_RADIUS+b.size){damagePlayerObj(p,b.damage);bullets.splice(i,1);break;}}}
    }

    // Zombies
    for(const z of zombies){
      if(z.hitFlash>0)z.hitFlash--;
      if(z.staggerTimer>0){z.staggerTimer--;z.vx*=0.8;z.vy*=0.8;z.x+=z.vx;z.y+=z.vy;pushOutOfObstacles(z,z.radius);continue;}
      const{player:np,dist:zd}=getNearestAlivePlayer(z.x,z.y);
      if(!np)continue;
      const zdx=np.x-z.x,zdy=np.y-z.y;

      if(!z.aware){
        if(gameTime%10===0&&zd<400&&hasLineOfSight(z.x,z.y,np.x,np.y)){z.aware=true;for(const oz of zombies){if(oz===z||oz.aware)continue;if((oz.x-z.x)**2+(oz.y-z.y)**2<200*200)oz.aware=true;}}
        if(zd<120)z.aware=true;
      }

      if(z.aware){
        z.angle=Math.atan2(zdy,zdx);
        if(z.ranged&&zd<300){if(zd<150){z.vx=-zdx/zd*z.speed*0.5;z.vy=-zdy/zd*z.speed*0.5;}else{z.vx*=0.9;z.vy*=0.9;}const now=performance.now();if(now-z.lastFired>z.fireRate){z.lastFired=now;bullets.push({x:z.x,y:z.y,vx:Math.cos(z.angle)*5,vy:Math.sin(z.angle)*5,damage:z.damage,color:'#5fa',size:4,knockback:0,pierce:0,pierced:0,life:80,owner:'zombie',trail:[]});playSound(300,0.05,'sine',0.06);}}
        else{z.vx=(zdx/zd)*z.speed;z.vy=(zdy/zd)*z.speed;}
      } else {
        z.wanderTimer--;
        if(gameTime%15===0){const md=z.x-z.lastX,mdy=z.y-z.lastY;if(md*md+mdy*mdy<4)z.stuckTimer++;else z.stuckTimer=0;z.lastX=z.x;z.lastY=z.y;}
        if(z.wanderTimer<=0||z.stuckTimer>3){z.wanderAngle+=(Math.random()-0.5)*Math.PI*(z.stuckTimer>3?1.5:0.8);z.wanderTimer=40+Math.floor(Math.random()*80);z.stuckTimer=0;}
        z.angle=z.wanderAngle;z.vx=Math.cos(z.wanderAngle)*z.speed*0.4;z.vy=Math.sin(z.wanderAngle)*z.speed*0.4;
      }

      z.x+=z.vx;z.y+=z.vy;z.x=clamp(z.x,z.radius,ARENA_W-z.radius);z.y=clamp(z.y,z.radius,ARENA_H-z.radius);pushOutOfObstacles(z,z.radius);
      for(const o of zombies){if(o===z)continue;const sx=z.x-o.x,sy=z.y-o.y,sd=Math.sqrt(sx*sx+sy*sy),md2=z.radius+o.radius;if(sd<md2&&sd>0){const p=(md2-sd)/sd*0.3;z.x+=sx*p;z.y+=sy*p;}}
      // Melee all players
      for(const p of players){if(!p.alive)continue;const pd=Math.sqrt((p.x-z.x)**2+(p.y-z.y)**2);if(pd<z.radius+PLAYER_RADIUS+2&&z.attackCooldown<=0){damagePlayerObj(p,z.damage);z.attackCooldown=30;}}
      if(z.attackCooldown>0)z.attackCooldown--;
    }
  }

  // ---- Particles, texts, explosions ----
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.gravity)p.vy+=p.gravity;p.vx*=0.95;p.vy*=0.95;p.life--;if(p.life<=0)particles.splice(i,1);}
  for(let i=floatingTexts.length-1;i>=0;i--){floatingTexts[i].y+=floatingTexts[i].vy;floatingTexts[i].life--;if(floatingTexts[i].life<=0)floatingTexts.splice(i,1);}
  for(let i=explosions.length-1;i>=0;i--){explosions[i].life--;if(explosions[i].life<=0)explosions.splice(i,1);}
  for(const p of pickups)p.bobTimer+=0.05;
  if(decals.length>200)decals.splice(0,decals.length-200);

  // Camera follows local player (or spectate alive player)
  let camTarget = lp;
  if (!lp.alive) { const alive = players.find(p => p.alive); if (alive) camTarget = alive; }
  camera.x=lerp(camera.x,camTarget.x,0.1);camera.y=lerp(camera.y,camTarget.y,0.1);

  if(screenShake.intensity>0.1){screenShake.x=(Math.random()-0.5)*screenShake.intensity*2;screenShake.y=(Math.random()-0.5)*screenShake.intensity*2;screenShake.intensity*=screenShake.decay;}else{screenShake.x=0;screenShake.y=0;screenShake.intensity=0;}

  // ---- Host broadcasts state ----
  if (isHost && isMultiplayer && gameTime % NET_SEND_RATE === 0) {
    const ps = players.map(p => ({ id:p.id,x:Math.round(p.x),y:Math.round(p.y),angle:+(p.angle.toFixed(2)),hp:Math.round(p.hp),alive:p.alive,weapon:p.currentWeapon,color:p.color,name:p.name }));
    const zs = zombies.map(z => ({ x:Math.round(z.x),y:Math.round(z.y),hp:Math.round(z.hp),maxHp:Math.round(z.maxHp),radius:z.radius,color:z.color,type:z.type,angle:+(z.angle.toFixed(2)),aware:z.aware,hitFlash:z.hitFlash }));
    sendMsg({ type: 'game_state', players: ps, zombies: zs, score, kills, wave, waveActive });
  }

  updateHUD();
}

// ---- Apply host state (non-host client) ----
function applyHostState(msg) {
  score = msg.score; kills = msg.kills; wave = msg.wave;
  // Update remote players
  for (const pd of msg.players) {
    if (pd.id === myId) continue; // don't override local
    let p = players.find(pp => pp.id === pd.id);
    if (p) { p.x=lerp(p.x,pd.x,0.3);p.y=lerp(p.y,pd.y,0.3);p.angle=pd.angle;p.hp=pd.hp;p.alive=pd.alive; }
  }
  // Sync zombies from host
  zombies = msg.zombies.map(z => ({...z, vx:0,vy:0,staggerTimer:0,attackCooldown:0,wanderAngle:0,wanderTimer:0,stuckTimer:0,lastX:0,lastY:0,ranged:ZOMBIE_TYPES[z.type]?.ranged||false,fireRate:ZOMBIE_TYPES[z.type]?.fireRate||0,lastFired:0,explodeOnDeath:ZOMBIE_TYPES[z.type]?.explodeOnDeath||false,explosionRadius:ZOMBIE_TYPES[z.type]?.explosionRadius||0,damage:ZOMBIE_TYPES[z.type]?.damage||10,score:ZOMBIE_TYPES[z.type]?.score||100}));
  // Check game over
  if (!players.some(p => p.alive) && gameState === 'playing') showDeathScreen();
}

// ============================================================
// HUD
// ============================================================
function updateHUD() {
  const lp=getLocalPlayer();if(!lp)return;
  const w=lp.weapons[lp.currentWeapon],def=WEAPON_DEFS[w.type];
  document.getElementById('weapon-name').textContent=def.name;
  const ae=document.getElementById('ammo-display');
  if(w.reloading){ae.innerHTML=`RELOADING ${Math.floor((1-w.reloadTimer/def.reloadTime)*100)}%`;ae.className='ammo reloading';}
  else{ae.innerHTML=`${w.ammo} <span class="slash">/</span> <span class="reserve">${def.infinite?'∞':w.reserveAmmo}</span>`;ae.className='ammo';}
  document.getElementById('score').textContent=score.toLocaleString();
  document.getElementById('wave-display').textContent=`WAVE ${wave}`;
  document.getElementById('kills-display').textContent=`${kills} KILLS`;
  const hp=Math.max(0,lp.hp/lp.maxHp*100),hb=document.getElementById('health-bar');
  hb.style.width=hp+'%';hb.style.background=hp>50?'#4f4':hp>25?'#fa0':'#f44';
  document.getElementById('health-text').textContent=`${Math.ceil(lp.hp)} HP`;
  const se=document.getElementById('weapon-slots');let h='';
  for(let i=0;i<lp.weapons.length;i++){const ww=lp.weapons[i],dd=WEAPON_DEFS[ww.type];h+=`<div class="weapon-slot ${i===lp.currentWeapon?'active':''}" data-idx="${i}"><span class="key">${i<9?i+1:0}</span>${dd.name.substring(0,4)}</div>`;}
  se.innerHTML=h;
  const db=document.getElementById('btn-dash');if(db)db.className=lp.dashCooldown>0?'mobile-btn dash-cooldown':'mobile-btn dash-ready';
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (gameState !== 'playing') { renderMinimap(); return; }
  const ox=-camera.x+canvas.width/2+screenShake.x,oy=-camera.y+canvas.height/2+screenShake.y;
  ctx.save();ctx.translate(ox,oy);

  // Floor + walls
  const vL=camera.x-canvas.width/2-CELL_SIZE,vR=camera.x+canvas.width/2+CELL_SIZE,vT=camera.y-canvas.height/2-CELL_SIZE,vB=camera.y+canvas.height/2+CELL_SIZE;
  const mnx=Math.max(0,Math.floor(vL/CELL_SIZE)),mxx=Math.min(GRID_W-1,Math.floor(vR/CELL_SIZE)),mny=Math.max(0,Math.floor(vT/CELL_SIZE)),mxy=Math.min(GRID_H-1,Math.floor(vB/CELL_SIZE));
  for(let cy=mny;cy<=mxy;cy++)for(let cx=mnx;cx<=mxx;cx++){
    if(dungeonGrid&&dungeonGrid[cy]&&dungeonGrid[cy][cx]){let inR=false;for(const r of rooms){if(cx>=r.x&&cx<r.x+r.w&&cy>=r.y&&cy<r.y+r.h){inR=true;break;}}ctx.fillStyle=inR?'#1e1e1e':'#181818';ctx.fillRect(cx*CELL_SIZE,cy*CELL_SIZE,CELL_SIZE,CELL_SIZE);ctx.strokeStyle='#222';ctx.lineWidth=0.5;ctx.strokeRect(cx*CELL_SIZE,cy*CELL_SIZE,CELL_SIZE,CELL_SIZE);}
    else{const h=(cx*7+cy*13)%20;ctx.fillStyle=`hsl(25,${6+h%4}%,${12+h%4}%)`;ctx.fillRect(cx*CELL_SIZE,cy*CELL_SIZE,CELL_SIZE,CELL_SIZE);if(cy>0&&dungeonGrid&&dungeonGrid[cy-1]&&dungeonGrid[cy-1][cx]){ctx.fillStyle='#2a2218';ctx.fillRect(cx*CELL_SIZE,cy*CELL_SIZE,CELL_SIZE,3);}}
  }
  ctx.strokeStyle='#f04040';ctx.lineWidth=3;ctx.strokeRect(0,0,ARENA_W,ARENA_H);

  // Decals
  for(const d of decals){ctx.globalAlpha=d.alpha;ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(d.x,d.y,d.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;

  // Pickups
  for(const p of pickups){const bob=Math.sin(p.bobTimer)*3;ctx.save();ctx.translate(p.x,p.y+bob);if(p.type==='weapon'){const d=WEAPON_DEFS[p.weaponType];ctx.shadowColor=d.color;ctx.shadowBlur=12;ctx.fillStyle=d.color;ctx.fillRect(-12,-5,24,10);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(d.name,0,18);}else if(p.type==='health'){ctx.shadowColor='#4f4';ctx.shadowBlur=10;ctx.fillStyle='#4f4';ctx.fillRect(-6,-2,12,4);ctx.fillRect(-2,-6,4,12);ctx.shadowBlur=0;}else if(p.type==='ammo'){ctx.shadowColor='#fa0';ctx.shadowBlur=10;ctx.fillStyle='#fa0';ctx.fillRect(-4,-6,8,12);ctx.shadowBlur=0;}ctx.restore();}

  // Explosions
  for(const e of explosions){const t=e.life/e.maxLife;ctx.globalAlpha=t*0.5;ctx.fillStyle='#f80';ctx.beginPath();ctx.arc(e.x,e.y,e.radius*(1.2-t*0.2),0,Math.PI*2);ctx.fill();ctx.globalAlpha=t*0.3;ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(e.x,e.y,e.radius*0.5*t,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;

  // Bullets
  for(const b of bullets){if(b.tracer&&b.trail.length>1){ctx.strokeStyle=b.color;ctx.lineWidth=2;ctx.globalAlpha=0.4;ctx.beginPath();ctx.moveTo(b.trail[0].x,b.trail[0].y);for(let j=1;j<b.trail.length;j++)ctx.lineTo(b.trail[j].x,b.trail[j].y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;}if(b.flame){ctx.globalAlpha=Math.min(1,b.life/20);const gr=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.size);gr.addColorStop(0,'#ff4');gr.addColorStop(0.5,'#f80');gr.addColorStop(1,'rgba(255,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}else{ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}

  // Zombies
  for(const z of zombies){ctx.save();ctx.translate(z.x,z.y);ctx.rotate(z.angle);ctx.fillStyle=z.hitFlash>0?'#fff':z.color;ctx.beginPath();ctx.arc(0,0,z.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#232';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=!z.aware?'#aa4':(z.type==='spitter'?'#5fa':'#f44');ctx.beginPath();ctx.arc(z.radius*0.4,-z.radius*0.3,2.5,0,Math.PI*2);ctx.arc(z.radius*0.4,z.radius*0.3,2.5,0,Math.PI*2);ctx.fill();ctx.restore();if(z.hp<z.maxHp){const bw=z.radius*2,hp2=z.hp/z.maxHp;ctx.fillStyle='#333';ctx.fillRect(z.x-bw/2,z.y-z.radius-8,bw,3);ctx.fillStyle=hp2>0.5?'#4a4':hp2>0.25?'#a84':'#a44';ctx.fillRect(z.x-bw/2,z.y-z.radius-8,bw*hp2,3);}}

  // Players (all)
  for(const p of players){
    if(!p.alive)continue;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
    if(p.invincible>0&&Math.floor(p.invincible/50)%2===0)ctx.globalAlpha=0.5;
    ctx.fillStyle=p.damageFlash>0?'#f44':p.color;
    ctx.beginPath();ctx.arc(0,0,PLAYER_RADIUS,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.stroke();
    const w=p.weapons[p.currentWeapon],def=WEAPON_DEFS[w.type];
    ctx.fillStyle=def.color;ctx.fillRect(PLAYER_RADIUS-2,-3,14,6);
    if(w.muzzleFlash>0){ctx.fillStyle='#ff8';ctx.globalAlpha=w.muzzleFlash/6;ctx.beginPath();ctx.arc(PLAYER_RADIUS+12,0,8+Math.random()*4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
    ctx.globalAlpha=1;ctx.restore();

    // Name tag
    ctx.save();
    ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.strokeText(p.name,p.x,p.y-PLAYER_RADIUS-10);
    ctx.fillStyle='#fff';ctx.fillText(p.name,p.x,p.y-PLAYER_RADIUS-10);
    ctx.restore();

    // Dash cooldown (desktop only, local player only)
    if(p===getLocalPlayer()&&p.dashCooldown>0&&!isMobile){const pct=1-p.dashCooldown/DASH_COOLDOWN;ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,PLAYER_RADIUS+6,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);ctx.stroke();}
  }

  // Particles
  for(const p of particles){ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;const sz=p.type==='smoke'?p.size*(1+(1-p.life/p.maxLife)*0.5):p.size*(p.life/p.maxLife);ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;

  // Floating texts
  for(const ft of floatingTexts){ctx.globalAlpha=ft.life/ft.maxLife;ctx.fillStyle=ft.color;ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(ft.text,ft.x,ft.y);}ctx.globalAlpha=1;
  ctx.restore();

  // Damage vignette
  const lp2=getLocalPlayer();if(lp2&&lp2.damageFlash>0){ctx.fillStyle=`rgba(255,0,0,${lp2.damageFlash/15*0.4})`;ctx.fillRect(0,0,canvas.width,canvas.height);}

  // Spectating text
  if(lp2&&!lp2.alive&&gameState==='playing'){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,canvas.width,40);ctx.fillStyle='#f04040';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText('SPECTATING',canvas.width/2,26);}

  if(isMobile&&gameState==='playing')renderJoysticks();
  renderMinimap();
}

function renderJoysticks(){
  if(leftJoystick.active){ctx.globalAlpha=0.2;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(leftJoystick.cx,leftJoystick.cy,JOYSTICK_MAX,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=0.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(leftJoystick.cx+leftJoystick.dx,leftJoystick.cy+leftJoystick.dy,20,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  if(rightJoystick.active){ctx.globalAlpha=0.2;ctx.strokeStyle=rightJoystick.firing?'#f04040':'#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(rightJoystick.cx,rightJoystick.cy,JOYSTICK_MAX,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=0.4;ctx.fillStyle=rightJoystick.firing?'#f04040':'#fff';ctx.beginPath();ctx.arc(rightJoystick.cx+rightJoystick.dx,rightJoystick.cy+rightJoystick.dy,20,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
}

function renderMinimap(){
  const mw=minimapCanvas.width,mh=minimapCanvas.height,sx=mw/ARENA_W,sy=mh/ARENA_H;
  minimapCtx.clearRect(0,0,mw,mh);minimapCtx.fillStyle='#111';minimapCtx.fillRect(0,0,mw,mh);
  if(dungeonGrid){minimapCtx.fillStyle='#2a2a2a';const step=Math.max(1,Math.floor(3/sx));for(let y=0;y<GRID_H;y+=step)for(let x=0;x<GRID_W;x+=step)if(dungeonGrid[y][x])minimapCtx.fillRect(x*CELL_SIZE*sx,y*CELL_SIZE*sy,Math.max(1,CELL_SIZE*sx*step),Math.max(1,CELL_SIZE*sy*step));}
  minimapCtx.fillStyle='#a44';for(const z of zombies)minimapCtx.fillRect(z.x*sx-1,z.y*sy-1,2,2);
  minimapCtx.fillStyle='#4f4';for(const p of pickups)minimapCtx.fillRect(p.x*sx-1,p.y*sy-1,3,3);
  for(const p of players){if(!p.alive)continue;minimapCtx.fillStyle=p.color;minimapCtx.fillRect(p.x*sx-2,p.y*sy-2,4,4);}
  minimapCtx.strokeStyle='rgba(255,255,255,0.2)';minimapCtx.lineWidth=1;minimapCtx.strokeRect((camera.x-canvas.width/2)*sx,(camera.y-canvas.height/2)*sy,canvas.width*sx,canvas.height*sy);
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(){update();render();requestAnimationFrame(gameLoop);}
gameLoop();
</script>
