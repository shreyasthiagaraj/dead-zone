<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DEAD ZONE — Zombie Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@media (orientation: portrait) {
  html { transform: rotate(0deg); } /* hint: rotate to landscape for best experience */
}
html, body {
  background: #030308; overflow: hidden; font-family: 'Courier New', monospace;
  user-select: none; -webkit-user-select: none; touch-action: none;
  -webkit-touch-callout: none; position: fixed; width: 100%; height: 100%;
  top: 0; left: 0;
}
body.desktop { cursor: crosshair; }
canvas#game { display: block; position: fixed; top: 0; left: 0; outline: none; z-index: 1; }

#top-hud { position: fixed; top: calc(6px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); text-align: left; z-index: 20; pointer-events: none; }
#top-hud .score { font-size: 16px; font-weight: bold; color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 16px rgba(0,255,255,0.3); }
#top-hud .wave { color: #f0f; font-size: 11px; text-shadow: 0 0 6px #f0f; }
#top-hud .kills { color: #8af; font-size: 10px; text-shadow: 0 0 4px rgba(128,170,255,0.5); }

#health-hud { position: fixed; top: calc(52px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); width: 120px; z-index: 20; pointer-events: none; }
#health-hud .bar-bg { width: 100%; height: 6px; background: #111; border: 1px solid #0f03; border-radius: 3px; box-shadow: 0 0 4px rgba(0,255,0,0.2); }
#health-hud .bar { height: 100%; background: #0f0; border-radius: 3px; transition: width 0.2s, background 0.2s; box-shadow: 0 0 8px currentColor; }
#health-hud .hp-text { color: #0f0; font-size: 10px; text-align: left; margin-top: 2px; text-shadow: 0 0 6px rgba(0,255,0,0.5); }

#ammo-hud { position: fixed; z-index: 20; pointer-events: none; text-shadow: 1px 1px 2px #000; text-align: center; }
body.desktop #ammo-hud { bottom: 20px; left: 20px; text-align: left; }
body.mobile #ammo-hud { bottom: calc(66px + env(safe-area-inset-bottom)); right: calc(6px + env(safe-area-inset-right)); left: auto; transform: none; text-align: right; }
#ammo-hud .weapon-name { font-size: 14px; font-weight: bold; color: #f0c040; text-transform: uppercase; letter-spacing: 1px; }
#ammo-hud .ammo { font-size: 22px; font-weight: bold; color: #fff; }
#ammo-hud .ammo .slash { color: #666; font-size: 14px; }
#ammo-hud .ammo .reserve { color: #999; font-size: 14px; }
#ammo-hud .ammo.reloading { color: #f04040; font-size: 16px; }

#weapon-slots { position: fixed; z-index: 25; display: flex; gap: 3px; }
body.desktop #weapon-slots { bottom: 70px; left: 20px; flex-direction: row; pointer-events: none; }
body.mobile #weapon-slots { bottom: calc(16px + env(safe-area-inset-bottom)); right: calc(8px + env(safe-area-inset-right) * 0.5); left: auto; transform: none; flex-direction: row; }
.weapon-slot { width: 48px; height: 48px; border: 2px solid #0ff3; border-radius: 8px; background: rgba(0,10,20,0.75); display: flex; align-items: center; justify-content: center; font-size: 9px; color: #0ff6; text-align: center; line-height: 1.1; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.08s; box-shadow: 0 0 4px rgba(0,255,255,0.1); }
.weapon-slot:active { transform: scale(1.15); }
body.mobile .weapon-slot { width: 46px; height: 46px; font-size: 9px; }
.weapon-slot.active { border-color: #f0f; color: #f0f; background: rgba(255,0,255,0.1); box-shadow: 0 0 10px rgba(255,0,255,0.3); text-shadow: 0 0 4px rgba(255,0,255,0.4); }
.weapon-slot .key { position: absolute; top: 1px; left: 3px; font-size: 7px; color: #0ff4; }
.weapon-slot.active .key { color: #f0f; }
body.mobile .weapon-slot .key { display: none; }

.joystick-zone { position: fixed; bottom: 0; width: 50%; height: 100%; z-index: 15; display: none; }
body.mobile .joystick-zone { display: block; }
#joystick-left { left: 0; }
#joystick-right { right: 0; }

#mobile-buttons { position: fixed; z-index: 25; display: none; }
body.mobile #mobile-buttons { display: flex; flex-direction: column; gap: 8px; right: calc(8px + env(safe-area-inset-right) * 0.5); bottom: calc(160px + env(safe-area-inset-bottom)); }
.mobile-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #0ff4; background: rgba(0,10,20,0.7); color: #0ff6; font-size: 10px; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: center; line-height: 1.1; box-shadow: 0 0 6px rgba(0,255,255,0.15); }
.mobile-btn { transition: transform 0.08s; }
.mobile-btn:active, .mobile-btn.pressed { background: rgba(0,255,255,0.15); border-color: #0ff; color: #0ff; transform: scale(1.15); box-shadow: 0 0 16px rgba(0,255,255,0.4); }
.mobile-btn.dash-ready { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px rgba(0,255,255,0.3); text-shadow: 0 0 6px rgba(0,255,255,0.5); }
.mobile-btn.dash-cooldown { border-color: #222; color: #333; box-shadow: none; }
.mobile-btn.reload-btn { border-color: #a4f; color: #a4f; box-shadow: 0 0 8px rgba(170,68,255,0.25); text-shadow: 0 0 6px rgba(170,68,255,0.4); }

#minimap { display: none; }

/* ---- Screen overlays ---- */
.screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,3,12,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 10px; touch-action: manipulation; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; overflow-y: auto; }
.screen-overlay h1 { font-size: clamp(24px, 6vw, 48px); color: #f0f; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 2px; text-shadow: 0 0 30px rgba(255,0,255,0.6), 0 0 60px rgba(255,0,255,0.2); }
.screen-overlay .subtitle { color: #0ff; font-size: clamp(10px, 2.5vw, 14px); letter-spacing: 3px; margin-bottom: 10px; text-shadow: 0 0 8px rgba(0,255,255,0.4); }
.screen-overlay .stats { color: #8af; font-size: 12px; margin-bottom: 8px; line-height: 1.6; text-align: center; }
.screen-overlay .stats .val { color: #0ff; font-weight: bold; text-shadow: 0 0 6px rgba(0,255,255,0.4); }
.screen-overlay .highscore { color: #ff0; font-size: 12px; margin-top: 4px; text-shadow: 0 0 8px rgba(255,255,0,0.4); }
@media (orientation: landscape) and (max-height: 500px) {
  .screen-overlay { padding: 6px 10px; justify-content: center; }
  .screen-overlay h1 { font-size: clamp(18px, 4vh, 28px); margin-bottom: 2px; }
  .screen-overlay .subtitle { margin-bottom: 6px; font-size: 10px; }
  .screen-overlay .stats { font-size: 11px; line-height: 1.4; margin-bottom: 4px; columns: 2; column-gap: 24px; }
  .menu-btn { padding: 8px 20px; margin: 4px; font-size: 13px; }
  .menu-input { padding: 6px 12px; margin: 3px; font-size: 15px; width: 160px; }
  .menu-label { margin-top: 4px; margin-bottom: 2px; font-size: 10px; }
  .lobby-code { font-size: 32px; margin: 6px 0; }
  .lobby-players li { font-size: 13px; padding: 2px 0; }
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ---- Menu buttons ---- */
.menu-btn {
  display: inline-block; padding: 14px 36px; margin: 8px;
  font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold;
  color: #0ff; background: rgba(0,255,255,0.04); border: 2px solid #0ff;
  cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 0 8px rgba(0,255,255,0.2), inset 0 0 8px rgba(0,255,255,0.05);
  text-shadow: 0 0 6px rgba(0,255,255,0.4);
}
.menu-btn:hover { background: rgba(0,255,255,0.12); box-shadow: 0 0 16px rgba(0,255,255,0.4), inset 0 0 12px rgba(0,255,255,0.1); }
.menu-btn:active, .menu-btn.tapped { transform: scale(0.92); background: rgba(0,255,255,0.2); }
.menu-btn { touch-action: manipulation; transition: transform 0.1s, background 0.15s, box-shadow 0.2s; }
.menu-btn.primary { border-color: #f0f; color: #f0f; background: rgba(255,0,255,0.04); box-shadow: 0 0 8px rgba(255,0,255,0.2), inset 0 0 8px rgba(255,0,255,0.05); text-shadow: 0 0 6px rgba(255,0,255,0.4); }
.menu-btn.primary:hover { background: rgba(255,0,255,0.12); box-shadow: 0 0 16px rgba(255,0,255,0.4), inset 0 0 12px rgba(255,0,255,0.1); }
.menu-btn.danger { border-color: #f44; color: #f44; background: rgba(255,68,68,0.04); box-shadow: 0 0 8px rgba(255,68,68,0.2); text-shadow: 0 0 6px rgba(255,68,68,0.4); }

.menu-input {
  padding: 10px 16px; margin: 6px; font-family: 'Courier New', monospace; font-size: 18px;
  color: #0ff; background: rgba(0,255,255,0.04); border: 2px solid #0ff4;
  text-align: center; letter-spacing: 4px; text-transform: uppercase; outline: none; width: 200px;
  box-shadow: 0 0 6px rgba(0,255,255,0.15); text-shadow: 0 0 4px rgba(0,255,255,0.3);
}
.menu-input:focus { border-color: #0ff; box-shadow: 0 0 12px rgba(0,255,255,0.3); }
.menu-input::placeholder { color: #0ff4; letter-spacing: 1px; text-transform: none; text-shadow: none; }
.menu-input { touch-action: manipulation; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; -webkit-appearance: none; }

.menu-label { color: #8af; font-size: 12px; margin-top: 12px; margin-bottom: 4px; text-shadow: 0 0 4px rgba(128,170,255,0.3); }
.menu-error { color: #f44; font-size: 13px; margin-top: 8px; min-height: 18px; text-shadow: 0 0 6px rgba(255,68,68,0.4); }
.menu-info { color: #8af; font-size: 13px; margin-top: 6px; }

/* Lobby */
.lobby-code { font-size: 48px; color: #ff0; letter-spacing: 12px; font-weight: bold; margin: 16px 0; text-shadow: 0 0 20px rgba(255,255,0,0.4), 0 0 40px rgba(255,255,0,0.15); }
.lobby-players { list-style: none; margin: 16px 0; }
.lobby-players li { font-size: 16px; color: #8af; padding: 6px 0; display: flex; align-items: center; gap: 10px; justify-content: center; }
.lobby-players .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px currentColor; }
.lobby-players .host-tag { color: #ff0; font-size: 11px; text-shadow: 0 0 4px rgba(255,255,0,0.4); }
.lobby-waiting { color: #0ff6; font-size: 14px; animation: pulse 1.5s ease-in-out infinite; margin-top: 12px; text-shadow: 0 0 6px rgba(0,255,255,0.3); }

#wave-announce { position: fixed; top: 25%; width: 100%; text-align: center; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#wave-announce .wave-num { font-size: clamp(22px, 5vw, 44px); color: #f0f; font-weight: bold; text-shadow: 0 0 20px rgba(255,0,255,0.6), 0 0 40px rgba(255,0,255,0.2); }
#wave-announce .wave-sub { font-size: clamp(10px, 2.5vw, 14px); color: #0ff; margin-top: 4px; text-shadow: 0 0 8px rgba(0,255,255,0.4); }
#pickup-msg { position: fixed; top: 55%; width: 100%; text-align: center; z-index: 30; pointer-events: none; font-size: 16px; color: #0f0; opacity: 0; text-shadow: 0 0 12px rgba(0,255,0,0.5), 0 0 24px rgba(0,255,0,0.2); }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<canvas id="minimap"></canvas>

<div id="top-hud"><div class="score" id="score">0</div><div class="wave" id="wave-display">WAVE 1</div><div class="kills" id="kills-display">0 KILLS</div></div>
<div id="perk-display" style="display:none"></div>
<div id="health-hud"><div class="bar-bg"><div class="bar" id="health-bar"></div></div><div class="hp-text" id="health-text">100 HP</div></div>
<div id="streak-hud" style="display:none">
</div>
<div id="horde-timer" style="display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;font-family:'Courier New',monospace;font-size:20px;font-weight:bold;color:#0ff;text-shadow:0 0 10px #0ff,0 0 20px rgba(0,255,255,0.3);letter-spacing:2px"></div>
<div id="effects-bar" style="position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:20;pointer-events:none;display:flex;gap:6px;justify-content:flex-end"></div>
<div id="gun-stats" style="display:none"></div>
<div id="ammo-hud" style="display:none"><div class="weapon-name" id="weapon-name"></div><div class="ammo" id="ammo-display"></div></div>
<div id="weapon-slots" style="display:none"></div>
<div id="mobile-buttons">
  <div class="mobile-btn dash-ready" id="btn-dash">BLAST</div>
  <div class="mobile-btn reload-btn" id="btn-reload" style="display:none">RLD</div>
  <div id="btn-swap" style="display:none;position:fixed;bottom:calc(180px + env(safe-area-inset-bottom));right:calc(20px + env(safe-area-inset-right));z-index:22;width:70px;height:70px;border-radius:50%;border:3px solid #f0c040;background:rgba(240,192,64,0.2);color:#f0c040;font-family:'Courier New',monospace;font-size:10px;font-weight:bold;text-align:center;line-height:1.2;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;padding-top:22px;box-sizing:border-box"></div>
</div>
<div class="joystick-zone" id="joystick-left"></div>
<div class="joystick-zone" id="joystick-right"></div>
<div id="wave-announce"><div class="wave-num" id="wave-num"></div><div class="wave-sub" id="wave-sub"></div></div>
<div id="pickup-msg"></div>
<button id="btn-menu" style="position:fixed;top:calc(78px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));z-index:25;background:rgba(0,10,20,0.7);border:1px solid #0ff4;color:#0ff8;font-family:'Courier New',monospace;font-size:11px;padding:6px 12px;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:4px;box-shadow:0 0 6px rgba(0,255,255,0.15);text-shadow:0 0 4px rgba(0,255,255,0.3)">MENU</button>

<!-- ---- MAIN MENU ---- -->
<div class="screen-overlay" id="start-screen">
  <h1>DEAD ZONE</h1>
  <div class="subtitle">ZOMBIE SHOOTER</div>
  <div style="margin-top:10px;display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="menu-btn" id="btn-solo">SOLO</button>
    <button class="menu-btn" id="btn-multi">MULTIPLAYER</button>
  </div>
  <div style="display:none" id="start-controls"></div>
  <div id="install-prompt" style="display:none"></div>
</div>

<!-- ---- SOLO MODE PICKER ---- -->
<div class="screen-overlay" id="solo-mode-screen" style="display:none">
  <button class="menu-btn danger" id="btn-back-solo" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));font-size:10px;padding:5px 14px;margin:0;z-index:101">BACK</button>
  <h1 style="font-size:clamp(18px,4vw,28px);margin-bottom:6px">GAME MODE</h1>
  <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px">
    <button class="menu-btn" id="btn-solo-descent" style="min-width:120px;padding:8px 14px;font-size:13px">DESCENT<br><span style="color:#0ff8;font-size:9px;font-weight:normal">How deep can you go?</span></button>
    <button class="menu-btn" id="btn-solo-survival" style="min-width:120px;padding:8px 14px;font-size:13px">SURVIVAL<br><span style="color:#0ff8;font-size:9px;font-weight:normal">Endless waves</span></button>
    <button class="menu-btn" id="btn-solo-horde" style="min-width:120px;padding:8px 14px;font-size:13px">HORDE<br><span style="color:#0ff8;font-size:9px;font-weight:normal">Nonstop chaos</span></button>
  </div>
</div>

<!-- ---- MULTIPLAYER MENU ---- -->
<div class="screen-overlay" id="multi-screen" style="display:none">
  <h1 style="font-size:clamp(18px,4vw,32px)">MULTIPLAYER</h1>
  <div class="menu-label">YOUR NAME</div>
  <input class="menu-input" id="name-input" placeholder="Name" maxlength="16" value="">
  <div style="display:flex;flex-direction:row;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center">
    <div style="text-align:center">
      <button class="menu-btn primary" id="btn-create">CREATE GAME</button>
    </div>
    <div style="text-align:center">
      <span class="menu-label" style="display:block;margin:0 0 2px">JOIN WITH CODE</span>
      <input class="menu-input" id="code-input" placeholder="CODE" maxlength="4" style="width:100px">
      <button class="menu-btn" id="btn-join" style="padding:8px 14px">JOIN</button>
    </div>
  </div>
  <div class="menu-error" id="multi-error"></div>
  <button class="menu-btn danger" id="btn-back-main" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));font-size:10px;padding:5px 14px;margin:0;z-index:101">BACK</button>
</div>

<!-- ---- CREATE GAME MODE PICKER ---- -->
<div class="screen-overlay" id="create-mode-screen" style="display:none">
  <button class="menu-btn danger" id="btn-back-multi" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));font-size:10px;padding:5px 14px;margin:0;z-index:101">BACK</button>
  <h1 style="font-size:clamp(18px,4vw,28px);margin-bottom:6px">GAME MODE</h1>
  <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px">
    <button class="menu-btn" id="btn-create-descent" style="min-width:120px;padding:8px 14px;font-size:13px">DESCENT<br><span style="color:#0ff8;font-size:9px;font-weight:normal">Descend together</span></button>
    <button class="menu-btn" id="btn-create-survival" style="min-width:120px;padding:8px 14px;font-size:13px">SURVIVAL<br><span style="color:#0ff8;font-size:9px;font-weight:normal">Endless waves</span></button>
    <button class="menu-btn" id="btn-create-horde" style="min-width:120px;padding:8px 14px;font-size:13px">HORDE<br><span style="color:#0ff8;font-size:9px;font-weight:normal">Nonstop chaos</span></button>
  </div>
</div>

<!-- ---- LOBBY SCREEN ---- -->
<div class="screen-overlay" id="lobby-screen" style="display:none">
  <div style="display:flex;flex-direction:row;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center">
    <div style="text-align:center">
      <div style="color:#888;font-size:11px">LOBBY CODE</div>
      <div class="lobby-code" id="lobby-code">----</div>
      <div style="color:#666;font-size:10px">Share this code</div>
      <div id="mode-display" style="color:#f0c040;font-size:12px;margin:4px 0"></div>
    </div>
    <div style="text-align:center">
      <ul class="lobby-players" id="lobby-players" style="margin:4px 0"></ul>
      <button class="menu-btn primary" id="btn-start-game" style="display:none">START GAME</button>
      <div class="lobby-waiting" id="lobby-waiting" style="font-size:12px;margin-top:4px">Waiting for host to start...</div>
      <button class="menu-btn danger" id="btn-leave" style="margin-top:6px;font-size:11px;padding:5px 16px">LEAVE</button>
    </div>
  </div>
</div>

<!-- ---- DEATH SCREEN (AFTER-ACTION REPORT) ---- -->
<div class="screen-overlay" id="death-screen" style="display:none;overflow-y:auto">
  <div id="death-content"></div>
</div>

<!-- ---- WAVE SUMMARY ---- -->
<div id="wave-summary-screen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:39;background:rgba(3,3,12,0.8);font-family:'Courier New',monospace;text-align:center">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:500px">
    <div style="color:#0f0;font-size:clamp(16px,4vw,28px);font-weight:bold;letter-spacing:3px;margin-bottom:2px;text-shadow:0 0 12px rgba(0,255,0,0.5)" id="wave-summary-title">WAVE COMPLETE</div>
    <div style="color:#0ff8;font-size:11px;margin-bottom:8px" id="wave-summary-sub"></div>
    <div id="wave-summary-stats" style="text-align:center;font-size:11px"></div>
  </div>
</div>

<!-- ---- PAUSE MENU ---- -->
<div id="pause-screen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:45;background:rgba(3,3,12,0.8);font-family:'Courier New',monospace;text-align:center">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:350px">
    <div style="color:#0ff;font-size:clamp(18px,4vw,28px);font-weight:bold;letter-spacing:4px;margin-bottom:4px;text-shadow:0 0 12px rgba(0,255,255,0.5)">PAUSED</div>
    <div id="pause-mode-label" style="color:#888;font-size:11px;margin-bottom:6px"></div>
    <div id="pause-inventory" style="text-align:left;margin-bottom:8px;font-size:10px;max-height:25vh;overflow-y:auto"></div>
    <div style="display:flex;flex-direction:row;align-items:center;gap:8px;justify-content:center">
      <button class="menu-btn primary" id="btn-resume">RESUME</button>
      <button class="menu-btn danger" id="btn-quit-game">QUIT</button>
    </div>
  </div>
</div>

// ---- CONSTANTS ----

// ---- THE DESCENT ----
const DESCENT_SECTION_HEIGHT = 14; // cells per section (fits many in the grid)

function generateDescentMap(seed) {
  const rng = seededRandom(seed || Date.now());
  const numSections = 30;
  const descentH = (numSections * DESCENT_SECTION_HEIGHT) * CELL_SIZE;
  setArenaDimensions(DEFAULT_ARENA_W, descentH);
  dungeonGrid = [];
  for (let y = 0; y < GRID_H; y++) { dungeonGrid[y] = []; for (let x = 0; x < GRID_W; x++) dungeonGrid[y][x] = false; }
  rooms = [];
  const marginX = Math.floor((GRID_W - DESCENT_WIDTH) / 2);
  const arena = { x: marginX, y: 0, w: DESCENT_WIDTH, h: GRID_H };
  for (let y = 0; y < GRID_H; y++) for (let x = marginX; x < marginX + DESCENT_WIDTH && x < GRID_W; x++) dungeonGrid[y][x] = true;
  rooms.push(arena);
  // Central pillar per section
  const cx = marginX + Math.floor(DESCENT_WIDTH / 2);
  for (let si = 0; si < numSections; si++) {
    const py = si * DESCENT_SECTION_HEIGHT + Math.floor(DESCENT_SECTION_HEIGHT / 2);
    for (let dy = 0; dy < 2; dy++) for (let dx = -1; dx <= 0; dx++) {
      const gy = py + dy, gx = cx + dx;
      if (gy >= 0 && gy < GRID_H && gx >= 0 && gx < GRID_W) dungeonGrid[gy][gx] = false;
    }
  }
  arena.theme = ROOM_THEMES[4];
  arena.brightness = 1.0;
  arena.flicker = false;
  roomDetails = [{ ri: 0, theme: arena.theme, details: [], brightness: 1.0, flicker: false }];
  // Build roomGrid for the taller grid
  roomGrid = [];
  for (let y = 0; y < GRID_H; y++) { roomGrid[y] = new Int8Array(GRID_W); roomGrid[y].fill(-1); for (let x = marginX; x < marginX + DESCENT_WIDTH && x < GRID_W; x++) roomGrid[y][x] = 0; }
  // Build obstacles
  obstacles = [];
  for (let y = 0; y < GRID_H; y++) { let rs = -1; for (let x = 0; x <= GRID_W; x++) { const isW = x < GRID_W ? !dungeonGrid[y][x] : true; if (isW && rs === -1) rs = x; else if (!isW && rs !== -1) { obstacles.push({ x: rs*CELL_SIZE, y: y*CELL_SIZE, w: (x-rs)*CELL_SIZE, h: CELL_SIZE, color: '#0c0a08' }); rs = -1; } } }
  uploadDungeonGrid();
}

function initDescentSections() {
  descentSections = [];
  const marginX = Math.floor((GRID_W - DESCENT_WIDTH) / 2);
  for (let i = 0; i < 30; i++) { // pre-generate 30 sections (matches grid height)
    const sectionY = i * DESCENT_SECTION_HEIGHT * CELL_SIZE;
    const isBoss = i > 0 && i % 5 === 0;
    const isDark = i > 3 && i % 4 === 3;
    // Enemy composition scales with section
    let enemyCount = Math.min(8, 3 + Math.floor(i * 0.7));
    if (isBoss) enemyCount = Math.floor(enemyCount * 0.5); // fewer regular enemies with boss
    // Section types
    const types = ['normal'];
    if (i >= 2) types.push('fast');
    if (i >= 3) types.push('spitter');
    if (i >= 4) types.push('tank');
    if (i >= 5) types.push('splitter');
    if (i >= 7) types.push('mini'); // sniper
    if (i >= 8) types.push('exploder');
    descentSections.push({
      y: sectionY,
      height: DESCENT_SECTION_HEIGHT * CELL_SIZE,
      enemyCount,
      types,
      spawned: false,
      cleared: false,
      isBoss,
      isDark,
      gateY: sectionY + DESCENT_SECTION_HEIGHT * CELL_SIZE - CELL_SIZE,
    });
  }
}

function startDescent() {
  descentSection = 0;
  descentGateOpen = false;
  descentEnemiesTotal = 0;
  descentEnemiesKilled = 0;
  descentTopWall = 0;
  initDescentSections();
  // Announce
  const el = document.getElementById('wave-announce');
  document.getElementById('wave-num').textContent = 'THE DESCENT';
  document.getElementById('wave-sub').textContent = 'How deep can you go?';
  el.style.opacity = '1'; setTimeout(() => el.style.opacity = '0', 2500);
  playWaveStartSound();
  // Spawn first section enemies
  spawnDescentSection(0);
}

function spawnDescentSection(idx) {
  const sec = descentSections[idx];
  if (!sec || sec.spawned) return;
  sec.spawned = true;
  descentEnemiesTotal = sec.enemyCount;
  descentEnemiesKilled = 0;
  descentGateOpen = false;
  const marginX = Math.floor((GRID_W - DESCENT_WIDTH) / 2);
  const cx = (marginX + DESCENT_WIDTH / 2) * CELL_SIZE;
  // Spawn enemies spread across the section
  for (let ei = 0; ei < sec.enemyCount; ei++) {
    const tk = sec.types[Math.floor(Math.random() * sec.types.length)];
    const t = ZOMBIE_TYPES[tk]; if (!t) continue;
    const ex = (marginX + 2 + Math.random() * (DESCENT_WIDTH - 4)) * CELL_SIZE;
    const ey = sec.y + (0.3 + Math.random() * 0.5) * sec.height;
    const sc = 1 + idx * 0.06;
    zombies.push({ zid: _nextZombieId++, x: ex, y: ey, vx: 0, vy: 0, hp: t.hp * sc, maxHp: t.hp * sc, speed: t.speed + idx * 0.01, radius: t.radius, color: t.color, damage: t.damage, score: t.score, type: tk, attackCooldown: 0, hitFlash: 0, ranged: t.ranged||false, fireRate: t.fireRate||0, lastFired: 0, explodeOnDeath: t.explodeOnDeath||false, explosionRadius: t.explosionRadius||0, angle: 0, staggerTimer: 0, aware: true, wanderAngle: Math.random()*Math.PI*2, wanderTimer: 0, stuckTimer: 0, lastX: 0, lastY: 0, charger: t.charger||false, groundPound: t.groundPound||false, spreadShot: t.spreadShot||false, bomber: t.bomber||false, shielded: t.shielded||false, sniper: t.sniper||false, summoner: t.summoner||false });
  }
  // Spawn boss on boss sections
  if (sec.isBoss) {
    const bt = ZOMBIE_TYPES.boss;
    const tier = Math.floor(idx / 5);
    const bossHp = bt.hp + tier * 200;
    zombies.push({ zid: _nextZombieId++, x: cx, y: sec.y + sec.height * 0.4, vx: 0, vy: 0, hp: bossHp, maxHp: bossHp, speed: bt.speed, radius: bt.radius, color: bt.color, damage: bt.damage, score: bt.score * (1 + tier), type: 'boss', attackCooldown: 0, hitFlash: 0, ranged: false, fireRate: bt.fireRate||300, lastFired: 0, explodeOnDeath: true, explosionRadius: 90, angle: 0, staggerTimer: 0, aware: true, wanderAngle: 0, wanderTimer: 0, stuckTimer: 0, lastX: 0, lastY: 0, boss: true, summoner: true });
    descentEnemiesTotal++; // boss counts
  }
  // Spawn element zone
  const ezx = (marginX + 3 + Math.random() * (DESCENT_WIDTH - 6)) * CELL_SIZE;
  const ezy = sec.y + (0.4 + Math.random() * 0.3) * sec.height;
  const elem = ELEMENT_TYPES[Math.floor(Math.random() * ELEMENT_TYPES.length)];
  elementZones.push({ x: ezx, y: ezy, radius: 40, element: elem.id, life: 9999 }); // persist until section clears
  // Spawn barrels
  for (let bi = 0; bi < 2; bi++) {
    const bx = (marginX + 3 + Math.random() * (DESCENT_WIDTH - 6)) * CELL_SIZE;
    const by = sec.y + (0.2 + Math.random() * 0.6) * sec.height;
    barrels.push({ x: bx, y: by, radius: 14, hp: 1 });
  }
  // Announce section
  addFloatingText(cx, sec.y + 100, `SECTION ${idx + 1}`, '#f0c040');
  if (sec.isBoss) addFloatingText(cx, sec.y + 130, 'BOSS', '#f44');
  if (sec.isDark) addFloatingText(cx, sec.y + 130, 'DARKNESS', '#888');
}

function updateDescent() {
  if (!isHost || gameMode !== 'descent') return;
  const sec = descentSections[descentSection];
  if (!sec) {
    // Past all sections — keep players blocked at the last gate
    const lastSec = descentSections[descentSections.length - 1];
    if (lastSec) { for (const _dp of players) { if (_dp.alive && _dp.y > lastSec.gateY - PLAYER_RADIUS) _dp.y = lastSec.gateY - PLAYER_RADIUS; } }
    return;
  }
  // Count alive enemies in current section
  const sectionZombies = zombies.filter(z => z.y >= sec.y && z.y < sec.y + sec.height);
  // Track kills for this section
  const aliveInSection = sectionZombies.length;
  // Gate opens when all section enemies are dead
  if (sec.spawned && aliveInSection === 0 && !sec.cleared) {
    sec.cleared = true;
    score += 200 * (descentSection + 1);
    // Check if this is the last section — victory!
    if (descentSection >= descentSections.length - 1) {
      const lp = getLocalPlayer();
      score += 5000;
      addFloatingText(lp.x, lp.y - 50, 'YOU ESCAPED!', '#f0c040');
      addFloatingText(lp.x, lp.y - 25, '+5000 BONUS', '#4f4');
      screenShake.intensity = 15;
      playLevelCompleteSound();
      setTimeout(() => showDeathScreen(), 2500);
      return;
    }
    descentGateOpen = true;
    addFloatingText(getLocalPlayer().x, getLocalPlayer().y - 30, 'GATE OPEN!', '#0ff');
    playExitFoundSound();
    if (sec.isBoss && !hasPowerUpAnywhere()) {
      const pwr = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
      pickups.push({ type: 'powerup', powerupId: pwr.id, x: getLocalPlayer().x, y: getLocalPlayer().y + 30, bobTimer: 0 });
    }
  }
  // Check if player passed through the gate to next section
  if (descentGateOpen) {
    const lp = getLocalPlayer();
    if (lp && Math.abs(lp.y - sec.gateY) < 30) {
      descentSection++;
      descentGateOpen = false;
      descentTopWall = sec.y + sec.height * 0.5;
      if (descentSections[descentSection]) spawnDescentSection(descentSection);
    }
  }
  // Closing wall + gate blocking — applies to ALL players
  for (const _dp of players) {
    if (!_dp.alive) continue;
    // Closing wall: push down if going back up
    if (_dp.y < descentTopWall + PLAYER_RADIUS + 10) _dp.y = descentTopWall + PLAYER_RADIUS + 10;
    // Gate blocks when locked
    if (!descentGateOpen && sec.gateY > 0 && _dp.y > sec.gateY - PLAYER_RADIUS - 5) _dp.y = sec.gateY - PLAYER_RADIUS - 5;
  }
}

// ---- ELEMENT ZONES ----
const ELEMENT_TYPES = [
  { id: 'fire',      name: 'FIRE',      color: '#f80', icon: '🔥' },
  { id: 'ice',       name: 'ICE',       color: '#aef', icon: '🧊' },
  { id: 'lightning',  name: 'LIGHTNING', color: '#4ff', icon: '⚡' },
];
let elementZones = []; // { x, y, radius, element, life }
let activeElement = null; // { id, timer }

function spawnElementZone() {
  const pos = getRandomFloorPos();
  const elem = ELEMENT_TYPES[Math.floor(Math.random() * ELEMENT_TYPES.length)];
  elementZones.push({ x: pos.x, y: pos.y, radius: 40, element: elem.id, life: 900 }); // 15 seconds on ground
}

function updateElementZones() {
  const lp = getLocalPlayer();
  for (let i = elementZones.length - 1; i >= 0; i--) {
    const ez = elementZones[i];
    ez.life--;
    if (ez.life <= 0) { elementZones.splice(i, 1); continue; }
    // Check player collision
    if (lp && lp.alive && Math.sqrt((lp.x - ez.x) ** 2 + (lp.y - ez.y) ** 2) < ez.radius + PLAYER_RADIUS) {
      activeElement = { id: ez.element, timer: 720 }; // 12 seconds
      const et = ELEMENT_TYPES.find(e => e.id === ez.element);
      addFloatingText(lp.x, lp.y - 40, et.icon + ' ' + et.name + '!', et.color);
      showPickupMsg(et.icon + ' ' + et.name, 'Bullets gain ' + et.name.toLowerCase() + ' for 12s');
      elementZones.splice(i, 1);
    }
  }
  // Tick active element
  if (activeElement) { activeElement.timer--; if (activeElement.timer <= 0) activeElement = null; }
}

function applyElementOnHit(z, damage) {
  if (!activeElement || !isHost) return;
  const el = activeElement.id;
  if (el === 'fire') {
    z._burning = (z._burning || 0) + Math.floor(damage * 0.8);
    z._burnTimer = 300;
  } else if (el === 'ice') {
    z._iceStacks = (z._iceStacks || 0) + 1;
    z._slowTimer = Math.max(z._slowTimer || 0, 120);
    if (z._iceStacks >= 3) { z._frozenTimer = 120; z._iceStacks = 0; }
  } else if (el === 'lightning') {
    // Shock effect on primary target — visible sparks for 2 seconds
    z._shocked = 45; z.staggerTimer = Math.max(z.staggerTimer, 10);
    // Lightning bolt visual from bullet to zombie
    const lp = getLocalPlayer();
    if(lp){particles.push({x:lp.x+Math.cos(lp.angle)*22,y:lp.y+Math.sin(lp.angle)*22,vx:0,vy:0,life:18,maxLife:18,size:1,color:'#4ff',type:'lightning',tx:z.x,ty:z.y});}
    for(let si=0;si<4;si++)particles.push({x:z.x+(Math.random()-0.5)*15,y:z.y+(Math.random()-0.5)*15,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:12,maxLife:12,size:2+Math.random()*3,color:'#4ff',type:'spark'});
    // Chain to 5 enemies at 20% damage each
    let lastZ = z; const hitSet = new Set();
    for (let ci = 0; ci < 5; ci++) {
      let bestD = 150, bestZ = null;
      for (const oz of zombies) { if (oz === lastZ || hitSet.has(oz)) continue; const d = Math.sqrt((oz.x-lastZ.x)**2+(oz.y-lastZ.y)**2); if (d < bestD) { bestD = d; bestZ = oz; } }
      if (!bestZ) break; hitSet.add(bestZ);
      damageZombie(bestZ, Math.floor(damage * 0.2), 0, 0);
      bestZ.staggerTimer = Math.max(bestZ.staggerTimer, 15); // stun on chain
      particles.push({x:lastZ.x,y:lastZ.y,vx:0,vy:0,life:20,maxLife:20,size:1,color:'#4ff',type:'lightning',tx:bestZ.x,ty:bestZ.y});
      particles.push({x:lastZ.x,y:lastZ.y,vx:0,vy:0,life:14,maxLife:14,size:1,color:'#fff',type:'lightning',tx:bestZ.x,ty:bestZ.y});
      // Sparks at chain point
      for(let li=0;li<3;li++)particles.push({x:bestZ.x+(Math.random()-0.5)*12,y:bestZ.y+(Math.random()-0.5)*12,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:10,maxLife:10,size:2+Math.random()*2,color:'#4ff',type:'spark'});
      bestZ._shocked = 45;
      lastZ = bestZ;
    }
    // Lightning chains detonate nearby barrels
    for(let bi=barrels.length-1;bi>=0;bi--){const br=barrels[bi];const bd=Math.sqrt((br.x-z.x)**2+(br.y-z.y)**2);if(bd<100){explodeBarrel(br,bi);break;}}
  }
}

// Player's active modifiers: { projectile: 'spread'|null, element: 'fire'|null, behavior: 'homing'|null }
let weaponMods = { projectile: null, element: null, behavior: null };
let _weaponLastFired = 0, _weaponMuzzleFlash = 0;

function resetWeaponMods() { weaponMods = { projectile: null, element: null, behavior: null }; _weaponLastFired = 0; _weaponMuzzleFlash = 0; }

function getEffectiveWeapon() {
  let w = { ...BASE_WEAPON };
  // Apply projectile mod
  if (weaponMods.projectile === 'spread') { w.pellets = 5; w.spread = 0.2; w.damage = Math.floor(w.damage * 0.6); }
  else if (weaponMods.projectile === 'beam') { w.fireRate = 40; w.damage = Math.floor(w.damage * 0.3); w.bulletSize = 2; w.bulletColor = '#f4f'; }
  else if (weaponMods.projectile === 'orb') { w.damage = w.damage * 2; w.bulletSpeed = 6; w.bulletSize = 10; w.bulletLife = 90; w.pierce = 99; w.bulletColor = '#af4'; }
  else if (weaponMods.projectile === 'piercing') { w.pierce = 3; w.bulletSpeed = 24; w.damage = Math.floor(w.damage * 1.3); w.bulletSize = 4; w.bulletColor = '#4ff'; }
  // Apply element (visual — effects applied on hit)
  if (weaponMods.element === 'fire') { w.bulletColor = '#f80'; }
  else if (weaponMods.element === 'ice') { w.bulletColor = '#aef'; }
  else if (weaponMods.element === 'lightning') { w.bulletColor = '#4ff'; }
  return w;
}

// Fire the single modified weapon
function fireModifiedWeapon(p) {
  const w = getEffectiveWeapon();
  const now = performance.now();
  // Fire rate (use player perks for lead storm etc)
  let effectiveFireRate = w.fireRate / (1 + getPlayerPerkCount(p, 'lead_storm') * 0.2);
  if (playerHasPowerUp(p, 'overcharge')) effectiveFireRate /= 3;
  else if (playerHasPowerUp(p, 'rage')) effectiveFireRate /= 1.5;
  if (now - _weaponLastFired < effectiveFireRate) return;
  _weaponLastFired = now;
  _weaponMuzzleFlash = 6;
  // Set muzzle flash on player's weapon object so renderer picks it up
  if (p.weapons && p.weapons[p.currentWeapon]) p.weapons[p.currentWeapon].muzzleFlash = 6;
  const pellets = w.pellets || 1;
  const spreadMult = Math.pow(0.5, getPlayerPerkCount(p, 'steady_aim'));
  for (let i = 0; i < pellets; i++) {
    const sp = (Math.random() - 0.5) * w.spread * 2 * spreadMult;
    const a = p.angle + sp, c = Math.cos(a), s = Math.sin(a);
    let dmg = w.damage;
    if (playerHasPowerUp(p, 'rage')) dmg *= 2;
    if (playerHasPowerUp(p, 'frenzy')) dmg *= 3;
    if (playerHasPerk(p, 'berserker') && p.hp < p.maxHp * 0.3) dmg *= 1 + getPlayerPerkCount(p, 'berserker') * 0.4;
    let isCrit = false;
    const critChance = 0.05 + getPlayerPerkCount(p, 'critical') * 0.15;
    if (Math.random() < critChance) { dmg *= 3; isCrit = true; }
    bullets.push({
      x: p.x + c * 22, y: p.y + s * 22, vx: c * w.bulletSpeed, vy: s * w.bulletSpeed,
      damage: dmg, color: isCrit ? '#f0f' : w.bulletColor, size: isCrit ? w.bulletSize + 2 : w.bulletSize,
      knockback: w.knockback, pierce: w.pierce + getPlayerPerkCount(p, 'ricochet'), pierced: 0,
      life: w.bulletLife, flame: false, explosive: false, explosionRadius: 0,
      tracer: w.projectile === 'beam', chain: false, chainRange: 0, chainCount: 0,
      laserGlow: false, grenade: false, owner: 'player', ownerId: p.id, trail: [], crit: isCrit,
      _element: weaponMods.element, _behavior: weaponMods.behavior, _homing: weaponMods.behavior === 'homing',
      _bouncing: weaponMods.behavior === 'bouncing' ? 3 : 0,
    });
  }
  // Sound and muzzle FX
  const freq = weaponMods.element === 'lightning' ? 1800 : weaponMods.element === 'ice' ? 1200 : weaponMods.element === 'fire' ? 400 : 600;
  playSound(freq, 0.05, 'square', 0.2);
  if (p === getLocalPlayer()) screenShake.intensity = Math.max(screenShake.intensity, 2);
  const c2 = Math.cos(p.angle), s2 = Math.sin(p.angle);
  for (let i = 0; i < 3; i++) particles.push({ x: p.x + c2 * 24, y: p.y + s2 * 24, vx: c2 * (3 + Math.random() * 3) + (Math.random() - 0.5) * 2, vy: s2 * (3 + Math.random() * 3) + (Math.random() - 0.5) * 2, life: 8 + Math.random() * 6, maxLife: 14, size: 2 + Math.random() * 2, color: w.bulletColor, type: 'spark' });
}

// Apply element effects when bullet hits zombie
function applyElementEffect(z, element, damage) {
  if (!element || !isHost) return;
  if (element === 'fire') {
    z._burning = (z._burning || 0) + Math.floor(damage * 0.15);
    z._burnTimer = 180; // 3 seconds
  } else if (element === 'ice') {
    z._iceStacks = (z._iceStacks || 0) + 1;
    z._slowTimer = Math.max(z._slowTimer || 0, 120); // 2 seconds slow
    if (z._iceStacks >= 3) { z._frozenTimer = 120; z._iceStacks = 0; } // frozen 2s
  } else if (element === 'lightning') {
    // Chain to 2 nearby enemies
    let lastZ = z; const hitSet = new Set();
    for (let ci = 0; ci < 2; ci++) {
      let bestD = 180, bestZ = null;
      for (const oz of zombies) { if (oz === lastZ || hitSet.has(oz)) continue; const d = Math.sqrt((oz.x - lastZ.x) ** 2 + (oz.y - lastZ.y) ** 2); if (d < bestD) { bestD = d; bestZ = oz; } }
      if (!bestZ) break;
      hitSet.add(bestZ);
      damageZombie(bestZ, Math.floor(damage * 0.4), 0, 0);
      particles.push({ x: lastZ.x, y: lastZ.y, vx: 0, vy: 0, life: 18, maxLife: 18, size: 1, color: '#4ff', type: 'lightning', tx: bestZ.x, ty: bestZ.y });
      lastZ = bestZ;
    }
  }
}

// Blessing picker (replaces perk picker for modifier selection)
function showBlessingPicker() {

let weaponKillCounts = {}; // { weaponType: killCount }

function trackWeaponKill(weaponType) {
  if (!weaponType) return;
  // Track the base type (evolved weapons map back to their origin)
  const baseType = Object.keys(WEAPON_EVOLUTIONS).find(k => WEAPON_EVOLUTIONS[k].to === weaponType) || weaponType;
  weaponKillCounts[baseType] = (weaponKillCounts[baseType] || 0) + 1;
  const evo = WEAPON_EVOLUTIONS[baseType];
  if (evo && weaponKillCounts[baseType] === evo.kills) {
    // Evolution! Find and upgrade the weapon in the player's inventory
    const lp = getLocalPlayer();
    if (!lp) return;
    for (let i = 0; i < lp.weapons.length; i++) {
      if (lp.weapons[i].type === baseType) {
        evolveWeapon(lp, i, baseType);
        break;
      }
    }
  }
}

function evolveWeapon(player, slotIdx, baseType) {
  const evo = WEAPON_EVOLUTIONS[baseType];
  if (!evo) return;
  const w = player.weapons[slotIdx];
  // Create evolved weapon def dynamically
  if (!WEAPON_DEFS[evo.to]) {
    WEAPON_DEFS[evo.to] = { ...WEAPON_DEFS[baseType], ...evo.changes, name: evo.name, _evolved: true, _baseType: baseType };
  }
  const newW = createWeapon(evo.to);
  newW.ammo = Math.min(w.ammo, newW.ammo); // keep current ammo
  newW.reserveAmmo = w.reserveAmmo;
  player.weapons[slotIdx] = newW;
  // Dramatic announcement
  addFloatingText(player.x, player.y - 50, `${evo.name} EVOLVED!`, '#f0c040');
  screenShake.intensity = Math.max(screenShake.intensity, 12);
  playLevelCompleteSound();
  // Sparkle particles
  for (let k = 0; k < 15; k++) { const a = Math.random()*Math.PI*2, s = 2+Math.random()*4; particles.push({x:player.x,y:player.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*15,maxLife:40,size:3+Math.random()*3,color:Math.random()>0.5?'#f0c040':'#fff',type:'spark'}); }
}

}

let _sfxLoadStatus = { total: 0, loaded: 0, failed: 0, errors: [] };
function loadSfx() {
  if (!audioCtx) return;
  const allFiles = [...SFX_FILES, ...MUSIC_FILES];
  _sfxLoadStatus.total = allFiles.length;
  for (const name of allFiles) {
    const url = `sounds/${name}.mp3`;
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = () => {
      if (xhr.status === 200 || xhr.status === 0) {
        audioCtx.decodeAudioData(xhr.response,
          decoded => { sfxBuffers[name] = decoded; _sfxLoadStatus.loaded++; },
          () => { _sfxLoadStatus.failed++; _sfxLoadStatus.errors.push(`${name}: decode err`); }
        );
      } else { _sfxLoadStatus.failed++; _sfxLoadStatus.errors.push(`${name}: HTTP ${xhr.status}`); }
    };
    xhr.onerror = () => { _sfxLoadStatus.failed++; _sfxLoadStatus.errors.push(`${name}: XHR err`); };
    xhr.send();
  }

function playSfx(name, vol = 0.5) {

  try {
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = sfxBuffers[name];
    gain.gain.value = vol;
    src.connect(gain);
    gain.connect(sfxBus || audioCtx.destination);
    src.start();
  } catch(e) {}
  return true;
}

// Spatial sound — volume attenuates with distance from player
function playSfxSpatial(name, x, y, vol = 0.5, maxDist = 600) {
  if (!audioCtx || !sfxBuffers[name]) return false;
  const lp = getLocalPlayer();
  if (!lp) return playSfx(name, vol);
  const dx = x - lp.x, dy = y - lp.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > maxDist) return false;
  const attenuation = 1 - (dist / maxDist);
  const finalVol = vol * attenuation * attenuation; // quadratic falloff
  if (finalVol < 0.01) return false;
  return playSfx(name, finalVol);
}

        const pool = isCombat ? COMBAT_TRACKS : AMBIENT_TRACKS;
        const next = pickRandomTrack(pool, name);
        if (isCombat) _lastCombatTrack = next; else _lastAmbientTrack = next;
        playMusic(next, 1.5);
      };
    } catch(e) {}
  };
  if (sfxBuffers[name]) startTrack();
  else setTimeout(startTrack, 2000); // retry after load
}

function stopMusic(fadeOut = 1.5) {
  if (!currentMusic || !audioCtx) return;
  const { source, gain } = currentMusic;
  currentMusic = null;
  try {
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + fadeOut);
    setTimeout(() => { try { source.stop(); } catch(e) {} }, fadeOut * 1000 + 100);
  } catch(e) { try { source.stop(); } catch(e2) {} }
}

// ---- Ambient Sound Layer ----
let ambientDripTimer = 0;
let zombieGroanTimer = 0;
let healthLowTimer = 0;

function updateAmbientAudio() {
  if (gameState !== 'playing') return;
  const lp = getLocalPlayer();
  if (!lp || !lp.alive) return;

  // Occasional ambient drip sounds
  ambientDripTimer--;
  if (ambientDripTimer <= 0) {
    playSfx('ambient_drip', 0.08 + Math.random() * 0.1);
    ambientDripTimer = 300 + Math.floor(Math.random() * 400); // every 5-12 seconds
  }

  // Zombie groans — prioritize zombies in the fog (unseen = scarier)
  zombieGroanTimer--;
  if (zombieGroanTimer <= 0) {
    const fogZombies = []; const nearZombies = [];
    for (const z of zombies) {
      const d = Math.sqrt((z.x-lp.x)**2 + (z.y-lp.y)**2);
      if (d > 800) continue;
      // Check if zombie is outside flashlight cone (in the fog)
      const aToZ = Math.atan2(z.y-lp.y, z.x-lp.x);
      const angleDiff = Math.abs(((aToZ - lp.angle + Math.PI*3) % (Math.PI*2)) - Math.PI);
      const inBeam = d < 400 && angleDiff < 0.5;
      if (!inBeam && d > 200) fogZombies.push({z, d});
      else if (d < 500) nearZombies.push({z, d});
    }
    // Fog groans are creepier — play at lower volume with more reverb feel
    if (fogZombies.length > 0) {
      const pick = fogZombies[Math.floor(Math.random() * fogZombies.length)];
      playSfxSpatial('zombie_groan', pick.z.x, pick.z.y, 0.12 + Math.random() * 0.08, 800);
      // Occasional deep moan for atmosphere
      if (Math.random() < 0.3) playSound(60 + Math.random() * 40, 0.4, 'sawtooth', 0.03);
    } else if (nearZombies.length > 0) {
      const pick = nearZombies[Math.floor(Math.random() * nearZombies.length)];
      playSfxSpatial('zombie_groan', pick.z.x, pick.z.y, 0.15 + Math.random() * 0.1, 500);
    }
    zombieGroanTimer = 120 + Math.floor(Math.random() * 200); // every 2-5 seconds (more frequent)
  }

  // Zombie shuffling footsteps — faint sounds from off-screen zombies
  if (gameTime % 45 === 0) {
    const offscreen = zombies.filter(z => {
      const d = Math.sqrt((z.x-lp.x)**2 + (z.y-lp.y)**2);
      return d > 300 && d < 700 && z.aware;
    });
    if (offscreen.length > 0) {
      const z = offscreen[Math.floor(Math.random() * offscreen.length)];
      playSfxSpatial('zombie_groan', z.x, z.y, 0.04 + Math.random() * 0.03, 700);
      // Faint scratching/shuffling sound
      playSound(150 + Math.random() * 100, 0.06, 'sawtooth', 0.02);
    }
  }

  // Rare distant scream (pure atmosphere — every 20-40 seconds)
  if (gameTime % 60 === 0 && Math.random() < 0.04 && zombies.length > 5) {
    playSound(200 + Math.random() * 300, 0.3 + Math.random() * 0.2, 'sawtooth', 0.04);
    setTimeout(() => playSound(150 + Math.random() * 100, 0.2, 'square', 0.02), 100);
  }

  // Low health heartbeat (repeating warning)
  if (lp.hp <= lp.maxHp * 0.25) {
    healthLowTimer--;
    if (healthLowTimer <= 0) {
      playSfx('health_low', 0.25);
      healthLowTimer = 90; // every 1.5 seconds
    }
  } else {
    healthLowTimer = 0;
  }

  // Dynamic music: combat starts at 3+ aware zombies nearby,
  // randomly picks from combat track pool. Switches ambient tracks too.
  const inCombat = currentMusic && COMBAT_TRACKS.includes(currentMusic.name);
  const triggerRange = 350;   // range to START combat music
  const sustainRange = 600;   // wider range to KEEP combat music going
  const range = inCombat ? sustainRange : triggerRange;
  let nearAwareCount = 0;
  for (const z of zombies) {
    const d = Math.sqrt((z.x-lp.x)**2 + (z.y-lp.y)**2);
    if (d < range && z.aware) nearAwareCount++;
  }
  if (!inCombat && nearAwareCount > 2) {
    const track = pickRandomTrack(COMBAT_TRACKS, _lastCombatTrack);
    _lastCombatTrack = track;
    playMusic(track, 1.5);
  } else if (inCombat && nearAwareCount === 0) {
    const track = pickRandomTrack(AMBIENT_TRACKS, _lastAmbientTrack);
    _lastAmbientTrack = track;
    playMusic(track, 3.0);
  }
}

// ============================================================
// DUNGEON GENERATOR (seeded)
// ============================================================
function seededRandom(seed) { let s = seed; return function() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }

function generateDungeon(seed) {
  setArenaDimensions(DEFAULT_ARENA_W, DEFAULT_ARENA_H);
  const rng = seededRandom(seed || Date.now());
  dungeonGrid = [];
  for (let y = 0; y < GRID_H; y++) { dungeonGrid[y] = []; for (let x = 0; x < GRID_W; x++) dungeonGrid[y][x] = false; }
  rooms = [];
  // Spawn room in top-left corner
  const cr = { x: 2, y: 2, w: 12, h: 12 };
  carveRoom(cr); rooms.push(cr);
  // Exit room in bottom-right corner
  const er = { x: GRID_W - 14, y: GRID_H - 14, w: 12, h: 12 };
  carveRoom(er); rooms.push(er);
  // 12-18 rooms for a longer winding path
  const numRooms = 12 + Math.floor(rng() * 7);
  for (let att = 0; att < 600 && rooms.length < numRooms + 1; att++) {
    const w = 10+Math.floor(rng()*7), h = 10+Math.floor(rng()*7);
    const x = 2+Math.floor(rng()*(GRID_W-w-4)), y = 2+Math.floor(rng()*(GRID_H-h-4));
    const room = { x, y, w, h };
    let ov = false;
    for (const r of rooms) { if (room.x < r.x+r.w+4 && room.x+room.w+4 > r.x && room.y < r.y+r.h+4 && room.y+room.h+4 > r.y) { ov = true; break; } }
    if (!ov) { carveRoom(room); rooms.push(room); }
  }
  // Connect rooms in a winding chain — sort by angle from center to create a path that snakes through the map
  const cx = GRID_W/2, cy = GRID_H/2;
  const roomOrder = rooms.map((r,i) => ({i, ax: r.x+r.w/2-cx, ay: r.y+r.h/2-cy}));
  // Sort rooms into a path: start from room 0, greedily connect to nearest unvisited (creates long winding path)
  const visited = [0], unvisited = [];
  for (let i = 1; i < rooms.length; i++) unvisited.push(i);
  // But force room 1 (exit) to be LAST in the chain
  const exitIdx = unvisited.indexOf(1);
  if (exitIdx !== -1) unvisited.splice(exitIdx, 1);
  while (unvisited.length > 0) {
    const last = visited[visited.length - 1];
    const lc = rooms[last];
    let bestIdx = -1, bestDist = Infinity;
    for (let ui = 0; ui < unvisited.length; ui++) {
      const ri = unvisited[ui];
      const rc = rooms[ri];
      const d = Math.abs(lc.x+lc.w/2-rc.x-rc.w/2)+Math.abs(lc.y+lc.h/2-rc.y-rc.h/2);
      if (d < bestDist) { bestDist = d; bestIdx = ui; }
    }
    const next = unvisited[bestIdx];
    carveCorridor(rooms[last], rooms[next]); visited.push(next); unvisited.splice(bestIdx, 1);
  }
  // Connect last room in chain to the exit
  carveCorridor(rooms[visited[visited.length-1]], rooms[1]);
  // Only add a few extra connections (20% chance) to keep the path mostly linear
  for (let i = 2; i < rooms.length; i++) {
    if (rng() < 0.2) {
      // Connect to a random non-adjacent room
      const candidates = [];
      for (let j = 0; j < rooms.length; j++) {
        if (j === i) continue;
        const d = Math.abs(rooms[i].x+rooms[i].w/2-rooms[j].x-rooms[j].w/2)+Math.abs(rooms[i].y+rooms[i].h/2-rooms[j].y-rooms[j].h/2);
        if (d < 30) candidates.push(j);
      }
      if (candidates.length > 0) carveCorridor(rooms[i], rooms[candidates[Math.floor(rng()*candidates.length)]]);
    }
  }
  // Assign visual themes and generate room details (debris, stains, props)
  roomDetails = [];
  for (let ri = 0; ri < rooms.length; ri++) {
    const r = rooms[ri];
    const theme = ri === 0 ? ROOM_THEMES[1] : ri === 1 ? ROOM_THEMES[7] : ROOM_THEMES[1 + Math.floor(rng() * (ROOM_THEMES.length - 1))];
    r.theme = theme;
    r.brightness = 0.8 + rng() * 0.4; // 0.8-1.2
    r.flicker = rng() < 0.15;
    const details = [];
    const numProps = 2 + Math.floor(rng() * 5);
    for (let pi = 0; pi < numProps; pi++) {
      const px = (r.x + 2 + rng() * (r.w - 4)) * CELL_SIZE;
      const py = (r.y + 2 + rng() * (r.h - 4)) * CELL_SIZE;
      const kind = rng();
      if (kind < 0.2) details.push({ type: 'crate', x: px, y: py, size: 12 + rng() * 8, angle: rng() * 0.3 - 0.15 });
      else if (kind < 0.35) details.push({ type: 'table', x: px, y: py, w: 20 + rng() * 15, h: 10 + rng() * 8, angle: rng() * Math.PI });
      else if (kind < 0.5) details.push({ type: 'rubble', x: px, y: py, size: 6 + rng() * 10, count: 3 + Math.floor(rng() * 4) });
      else if (kind < 0.7) details.push({ type: 'stain', x: px, y: py, size: 10 + rng() * 20, color: rng() < 0.5 ? '#2a1515' : '#1a1a10' });
      else if (kind < 0.85) details.push({ type: 'pipes', x: (r.x + (rng() < 0.5 ? 0 : r.w - 1)) * CELL_SIZE, y: (r.y + 1 + rng() * (r.h - 2)) * CELL_SIZE, len: 2 + Math.floor(rng() * 4), vertical: rng() < 0.5 });
      else details.push({ type: 'scratch', x: px, y: py, angle: rng() * Math.PI, len: 8 + rng() * 15 });
    }
    if (rng() < 0.4) {
      const bx = (r.x + 1 + rng() * (r.w - 2)) * CELL_SIZE;
      const by = (r.y + 1 + rng() * (r.h - 2)) * CELL_SIZE;
      details.push({ type: 'bloodsmear', x: bx, y: by, angle: rng() * Math.PI * 2, len: 30 + rng() * 50 });
    }
    roomDetails.push({ ri, theme, details, brightness: r.brightness, flicker: r.flicker });
  }

  buildRoomGrid();
  obstacles = [];
  for (let y = 0; y < GRID_H; y++) { let rs = -1; for (let x = 0; x <= GRID_W; x++) { const isW = x < GRID_W ? !dungeonGrid[y][x] : true; if (isW && rs === -1) rs = x; else if (!isW && rs !== -1) { obstacles.push({ x: rs*CELL_SIZE, y: y*CELL_SIZE, w: (x-rs)*CELL_SIZE, h: CELL_SIZE, color: '#0c0a08' }); rs = -1; } } }
  uploadDungeonGrid();
}
function carveRoom(r) { for (let y = r.y; y < r.y+r.h && y < GRID_H; y++) for (let x = r.x; x < r.x+r.w && x < GRID_W; x++) if (y >= 0 && x >= 0) dungeonGrid[y][x] = true; }
// Precompute room index per cell — O(1) lookup during rendering instead of O(rooms) per cell
function buildRoomGrid() {
  roomGrid = [];
  for (let y = 0; y < GRID_H; y++) { roomGrid[y] = new Int8Array(GRID_W); roomGrid[y].fill(-1); }
  for (let ri = 0; ri < rooms.length; ri++) {
    const r = rooms[ri];
    for (let y = r.y; y < r.y + r.h && y < GRID_H; y++)
      for (let x = r.x; x < r.x + r.w && x < GRID_W; x++)
        if (y >= 0 && x >= 0) roomGrid[y][x] = ri;
  }
}
function carveCorridor(a, b) {
  const ax=a.x+Math.floor(a.w/2), ay=a.y+Math.floor(a.h/2), bx=b.x+Math.floor(b.w/2), by=b.y+Math.floor(b.h/2), half=1;
  for (let x = Math.min(ax,bx); x <= Math.max(ax,bx); x++) for (let dy=-half; dy<=half; dy++) { const cy=ay+dy; if (cy>=0&&cy<GRID_H&&x>=0&&x<GRID_W) dungeonGrid[cy][x]=true; }
  for (let y = Math.min(ay,by); y <= Math.max(ay,by); y++) for (let dx=-half; dx<=half; dx++) { const cx=bx+dx; if (y>=0&&y<GRID_H&&cx>=0&&cx<GRID_W) dungeonGrid[y][cx]=true; }
}
function generateArena(seed) {
  setArenaDimensions(DEFAULT_ARENA_W, DEFAULT_ARENA_H);
  const rng = seededRandom(seed || Date.now());
  dungeonGrid = [];
  for (let y = 0; y < GRID_H; y++) { dungeonGrid[y] = []; for (let x = 0; x < GRID_W; x++) dungeonGrid[y][x] = false; }
  rooms = [];
  // Tight arena for intense survival combat
  const margin = 24;
  const arena = { x: margin, y: margin, w: GRID_W - margin * 2, h: GRID_H - margin * 2 };
  carveRoom(arena);
  rooms.push(arena);
  // Scatter cover obstacles (wall blocks) throughout the arena
  const numObstacles = 22 + Math.floor(rng() * 12);
  const placed = [];
  const centerX = GRID_W / 2, centerY = GRID_H / 2;
  for (let att = 0; att < 200 && placed.length < numObstacles; att++) {
    const ow = 2 + Math.floor(rng() * 4), oh = 2 + Math.floor(rng() * 4);
    const ox = margin + 3 + Math.floor(rng() * (arena.w - ow - 6));
    const oy = margin + 3 + Math.floor(rng() * (arena.h - oh - 6));
    // Don't block center spawn area
    const ocx = ox + ow / 2, ocy = oy + oh / 2;
    if (Math.abs(ocx - centerX) < 6 && Math.abs(ocy - centerY) < 6) continue;
    // Don't overlap other obstacles (with gap)
    let overlap = false;
    for (const p of placed) { if (ox < p.x + p.w + 2 && ox + ow + 2 > p.x && oy < p.y + p.h + 2 && oy + oh + 2 > p.y) { overlap = true; break; } }
    if (overlap) continue;
    // Carve obstacle back to wall
    for (let y = oy; y < oy + oh && y < GRID_H; y++) for (let x = ox; x < ox + ow && x < GRID_W; x++) dungeonGrid[y][x] = false;
    placed.push({ x: ox, y: oy, w: ow, h: oh });
  }
  // Arena visual theme
  arena.theme = ROOM_THEMES[4]; // furnace theme for survival
  arena.brightness = 1.0;
  arena.flicker = false;
  roomDetails = [];
  const arenaDetails = [];
  const numDebris = 15 + Math.floor(rng() * 10);
  for (let di = 0; di < numDebris; di++) {
    const px = (arena.x + 3 + rng() * (arena.w - 6)) * CELL_SIZE;
    const py = (arena.y + 3 + rng() * (arena.h - 6)) * CELL_SIZE;
    if (dungeonGrid[Math.floor(py/CELL_SIZE)] && dungeonGrid[Math.floor(py/CELL_SIZE)][Math.floor(px/CELL_SIZE)]) {
      const kind = rng();
      if (kind < 0.3) arenaDetails.push({ type: 'stain', x: px, y: py, size: 10 + rng() * 25, color: rng() < 0.5 ? '#2a1515' : '#1a1a10' });
      else if (kind < 0.5) arenaDetails.push({ type: 'rubble', x: px, y: py, size: 6 + rng() * 10, count: 3 + Math.floor(rng() * 4) });
      else if (kind < 0.7) arenaDetails.push({ type: 'scratch', x: px, y: py, angle: rng() * Math.PI, len: 8 + rng() * 15 });
      else arenaDetails.push({ type: 'crate', x: px, y: py, size: 10 + rng() * 8, angle: rng() * 0.3 - 0.15 });
    }
  }
  roomDetails.push({ ri: 0, theme: arena.theme, details: arenaDetails, brightness: 1.0, flicker: false });

  buildRoomGrid();
  // Build obstacles array from grid
  obstacles = [];
  for (let y = 0; y < GRID_H; y++) { let rs = -1; for (let x = 0; x <= GRID_W; x++) { const isW = x < GRID_W ? !dungeonGrid[y][x] : true; if (isW && rs === -1) rs = x; else if (!isW && rs !== -1) { obstacles.push({ x: rs*CELL_SIZE, y: y*CELL_SIZE, w: (x-rs)*CELL_SIZE, h: CELL_SIZE, color: '#0c0a08' }); rs = -1; } } }
  uploadDungeonGrid();
}

function generateHordeArena(seed) {
  setArenaDimensions(DEFAULT_ARENA_W, DEFAULT_ARENA_H);
  const rng = seededRandom(seed || Date.now());
  dungeonGrid = [];
  for (let y = 0; y < GRID_H; y++) { dungeonGrid[y] = []; for (let x = 0; x < GRID_W; x++) dungeonGrid[y][x] = false; }
  rooms = [];

  const arena = { x: cx - radius, y: cy - radius, w: radius * 2, h: radius * 2 };
  // Carve circle
  for (let y = cy - radius; y <= cy + radius; y++) for (let x = cx - radius; x <= cx + radius; x++) {
    if (y >= 0 && y < GRID_H && x >= 0 && x < GRID_W) {

    const kind = rng();
    if (kind < 0.4) details.push({ type: 'stain', x: px, y: py2, size: 10 + rng() * 20, color: '#2a1515' });

    else details.push({ type: 'scratch', x: px, y: py2, angle: rng() * Math.PI, len: 8 + rng() * 12 });
  }
  roomDetails.push({ ri: 0, theme: arena.theme, details, brightness: 1.0, flicker: false });
  buildRoomGrid();
  obstacles = [];
  for (let y = 0; y < GRID_H; y++) { let rs = -1; for (let x = 0; x <= GRID_W; x++) { const isW = x < GRID_W ? !dungeonGrid[y][x] : true; if (isW && rs === -1) rs = x; else if (!isW && rs !== -1) { obstacles.push({ x: rs*CELL_SIZE, y: y*CELL_SIZE, w: (x-rs)*CELL_SIZE, h: CELL_SIZE, color: '#0c0a08' }); rs = -1; } } }
  uploadDungeonGrid();
}

function getRoomCenter(r) { return { x: (r.x+r.w/2)*CELL_SIZE, y: (r.y+r.h/2)*CELL_SIZE }; }
function getRandomFloorPos() {
  if (gameMode === 'survival' && rooms.length > 0) {
    // Pick random floor cell in the arena
    const r = rooms[0];
    for (let att = 0; att < 50; att++) {
      const gx = r.x + 2 + Math.floor(Math.random() * (r.w - 4));
      const gy = r.y + 2 + Math.floor(Math.random() * (r.h - 4));
      if (dungeonGrid[gy] && dungeonGrid[gy][gx]) return { x: gx * CELL_SIZE, y: gy * CELL_SIZE };
    }
    return { x: ARENA_W / 2, y: ARENA_H / 2 };
  }
  if (rooms.length <= 1) return { x: ARENA_W/2, y: ARENA_H/2 };
  const r = rooms[1+Math.floor(Math.random()*(rooms.length-1))];
  return { x: (r.x+1+Math.random()*(r.w-2))*CELL_SIZE, y: (r.y+1+Math.random()*(r.h-2))*CELL_SIZE };
}

function obstacleCollision(ox, oy, r) {
  const mnx=Math.max(0,Math.floor((ox-r)/CELL_SIZE)), mxx=Math.min(GRID_W-1,Math.floor((ox+r)/CELL_SIZE));
  const mny=Math.max(0,Math.floor((oy-r)/CELL_SIZE)), mxy=Math.min(GRID_H-1,Math.floor((oy+r)/CELL_SIZE));
  for (let gy=mny;gy<=mxy;gy++) for (let gx=mnx;gx<=mxx;gx++) { if (!dungeonGrid[gy]||!dungeonGrid[gy][gx]) { const wx=gx*CELL_SIZE,wy=gy*CELL_SIZE; const cx=Math.max(wx,Math.min(ox,wx+CELL_SIZE)),cy=Math.max(wy,Math.min(oy,wy+CELL_SIZE)); const dx=ox-cx,dy=oy-cy; if (dx*dx+dy*dy<r*r) return true; } }
  return false;
}
function pushOutOfObstacles(e, r) {
  const mnx=Math.max(0,Math.floor((e.x-r-CELL_SIZE)/CELL_SIZE)), mxx=Math.min(GRID_W-1,Math.floor((e.x+r+CELL_SIZE)/CELL_SIZE));
  const mny=Math.max(0,Math.floor((e.y-r-CELL_SIZE)/CELL_SIZE)), mxy=Math.min(GRID_H-1,Math.floor((e.y+r+CELL_SIZE)/CELL_SIZE));
  for (let gy=mny;gy<=mxy;gy++) for (let gx=mnx;gx<=mxx;gx++) { if (!dungeonGrid[gy]||!dungeonGrid[gy][gx]) { const wx=gx*CELL_SIZE,wy=gy*CELL_SIZE; const cx=Math.max(wx,Math.min(e.x,wx+CELL_SIZE)),cy=Math.max(wy,Math.min(e.y,wy+CELL_SIZE)); const dx=e.x-cx,dy=e.y-cy; const d=Math.sqrt(dx*dx+dy*dy); if (d<r) { if (d===0){e.x+=1;continue;} const p=(r-d)/d; e.x+=dx*p; e.y+=dy*p; } } }
}
function hasLineOfSight(ax,ay,bx,by) { const dx=bx-ax,dy=by-ay,dist=Math.sqrt(dx*dx+dy*dy),steps=Math.ceil(dist/(CELL_SIZE*0.5)); for (let i=1;i<steps;i++) { const t=i/steps,cx=ax+dx*t,cy=ay+dy*t,gx=Math.floor(cx/CELL_SIZE),gy=Math.floor(cy/CELL_SIZE); if (gx<0||gx>=GRID_W||gy<0||gy>=GRID_H) return false; if (!dungeonGrid[gy]||!dungeonGrid[gy][gx]) return false; } return true; }

// ---- WEBGL LIGHTING ----
const lightCanvas = document.createElement('canvas');
const GL_ATTRS = { alpha: true, premultipliedAlpha: false, antialias: false, depth: false, stencil: false };
const gl = lightCanvas.getContext('webgl', GL_ATTRS) || lightCanvas.getContext('experimental-webgl', GL_ATTRS);
let glReady = false;
const webglSupported = (gl !== null);
lightCanvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glReady = false; });
lightCanvas.addEventListener('webglcontextrestored', () => { initGL(); });

// Shaders
const LIGHT_VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){
  vUV = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const LIGHT_FS = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uGrid;
uniform vec2 uResolution;
uniform vec2 uCameraPos;
uniform float uCellSize;
uniform vec2 uGridSize;
uniform vec2 uArenaSize;

const int MAX_LIGHTS = 4;
uniform int uNumLights;
uniform vec2 uLightPos[4];
uniform float uLightAngle[4];
uniform float uLightRadius[4];

bool isWall(vec2 worldPos) {
  vec2 gridUV = worldPos / uArenaSize;
  if (gridUV.x < 0.0 || gridUV.x > 1.0 || gridUV.y < 0.0 || gridUV.y > 1.0) return true;
  return texture2D(uGrid, gridUV).r < 0.5;
}

bool rayHitsWall(vec2 from, vec2 to) {
  vec2 dir = to - from;
  float len = length(dir);
  if (len < 1.0) return false;
  float stepSize = uCellSize * 0.4;
  int steps = int(ceil(len / stepSize));
  if (steps > 200) steps = 200;
  for (int i = 1; i <= 200; i++) {
    if (i > steps) break;
    if (isWall(from + dir * (float(i) / float(steps)))) return true;
  }
  return false;
}

float computeLight(vec2 worldPos, vec2 lightPos, float lightAngle, float lightRadius) {
  vec2 diff = worldPos - lightPos;
  float dist = length(diff);
  if (dist >= lightRadius) return 0.0;
  if (rayHitsWall(lightPos, worldPos)) return 0.0;

  float distFactor = dist / lightRadius;

  // Ambient glow — very smooth exponential falloff, no hard edges
  float ambient = 0.25 * exp(-distFactor * distFactor * 8.0);

  // Flashlight cone — smooth in all dimensions
  float angle = atan(diff.y, diff.x);
  float angleDiff = angle - lightAngle;
  angleDiff = mod(angleDiff + 3.14159265, 6.28318530) - 3.14159265;
  float coneHalf = 0.7;
  float absDiff = abs(angleDiff);
  float angularFade = exp(-absDiff * absDiff / (coneHalf * coneHalf * 0.35));
  float distanceFade = exp(-distFactor * distFactor * 1.2);
  float cone = angularFade * distanceFade;

  // Additive blend — no max() crossover seam
  return min(ambient + cone, 1.0);
}

void main() {
  vec2 screenPos = vec2(vUV.x, 1.0 - vUV.y) * uResolution;
  vec2 worldPos = screenPos + uCameraPos - uResolution * 0.5;

  float totalLight = 0.0;
  float bestConeAngleDiff = 999.0;
  float bestConeLight = 0.0;

  for (int i = 0; i < 4; i++) {
    if (i >= uNumLights) break;
    float l = computeLight(worldPos, uLightPos[i], uLightAngle[i], uLightRadius[i]);
    totalLight = max(totalLight, l);

    vec2 diff = worldPos - uLightPos[i];
    float angle = atan(diff.y, diff.x);
    float ad = angle - uLightAngle[i];
    ad = mod(ad + 3.14159265, 6.28318530) - 3.14159265;
    if (abs(ad) < 0.5 && abs(ad) < bestConeAngleDiff) {
      bestConeAngleDiff = abs(ad);
      bestConeLight = l;
    }
  }

  float light = 0.15 + min(totalLight * 1.1, 1.0) * 0.85;

  float warmR = light;
  float warmG = light;
  float warmB = light;
  if (light > 0.3 && bestConeAngleDiff < 0.55) {
    float warmth = (light - 0.3) * 0.7;
    warmR -= warmth * 0.04;
    warmG += warmth * 0.02;
    warmB += warmth * 0.12;
  }

  gl_FragColor = vec4(warmR, warmG, warmB, 1.0);
}`;

// Two-pass separable Gaussian blur (sigma=4, radius=10 texels)
// Wider separable Gaussian (sigma=6, radius=14 texels = ~28px at full res)
const BLUR_FS = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uDir;
void main() {
  vec4 sum = texture2D(uTex, vUV) * 0.133;
  sum += (texture2D(uTex, vUV + uDir * 1.5) + texture2D(uTex, vUV - uDir * 1.5)) * 0.126;
  sum += (texture2D(uTex, vUV + uDir * 3.5) + texture2D(uTex, vUV - uDir * 3.5)) * 0.107;
  sum += (texture2D(uTex, vUV + uDir * 5.5) + texture2D(uTex, vUV - uDir * 5.5)) * 0.081;
  sum += (texture2D(uTex, vUV + uDir * 7.5) + texture2D(uTex, vUV - uDir * 7.5)) * 0.055;
  sum += (texture2D(uTex, vUV + uDir *10.0) + texture2D(uTex, vUV - uDir *10.0)) * 0.033;
  sum += (texture2D(uTex, vUV + uDir *12.5) + texture2D(uTex, vUV - uDir *12.5)) * 0.017;
  sum += (texture2D(uTex, vUV + uDir *14.0) + texture2D(uTex, vUV - uDir *14.0)) * 0.006;
  gl_FragColor = sum;
}`;

// GL state holders
let lightProg, blurProg, quadBuf, gridTex;
let uGrid, uResolution, uCameraPos, uCellSize, uGridSize, uArenaSize;
let uNumLights, uLightPos, uLightAngle, uLightRadius;
let lightFBO, lightFBOTexA, lightFBOTexB, uBlurTex, uBlurDir;

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(s));
    console.error('Source:\n' + src.split('\n').map((l,i) => (i+1)+': '+l).join('\n'));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

function initGL() {
  if (!webglSupported) { console.log('[Lighting] WebGL not supported, using canvas fallback'); return; }
  const vs = createShader(gl.VERTEX_SHADER, LIGHT_VS);
  const fs = createShader(gl.FRAGMENT_SHADER, LIGHT_FS);
  if (!vs || !fs) { console.error('[Lighting] Shader compile failed'); glReady = false; return; }
  lightProg = gl.createProgram();
  gl.attachShader(lightProg, vs);
  gl.attachShader(lightProg, fs);
  gl.linkProgram(lightProg);
  if (!gl.getProgramParameter(lightProg, gl.LINK_STATUS)) { console.error('[Lighting] Link:', gl.getProgramInfoLog(lightProg)); return; }

  quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  uGrid = gl.getUniformLocation(lightProg, 'uGrid');
  uResolution = gl.getUniformLocation(lightProg, 'uResolution');
  uCameraPos = gl.getUniformLocation(lightProg, 'uCameraPos');
  uCellSize = gl.getUniformLocation(lightProg, 'uCellSize');
  uGridSize = gl.getUniformLocation(lightProg, 'uGridSize');
  uArenaSize = gl.getUniformLocation(lightProg, 'uArenaSize');
  uNumLights = gl.getUniformLocation(lightProg, 'uNumLights');
  uLightPos = []; uLightAngle = []; uLightRadius = [];
  for (let i = 0; i < 4; i++) {
    uLightPos.push(gl.getUniformLocation(lightProg, 'uLightPos['+i+']'));
    uLightAngle.push(gl.getUniformLocation(lightProg, 'uLightAngle['+i+']'));
    uLightRadius.push(gl.getUniformLocation(lightProg, 'uLightRadius['+i+']'));
  }

  gridTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // Blur shader + FBO for smooth shadow edges
  const blurVs = createShader(gl.VERTEX_SHADER, LIGHT_VS);
  const blurFs = createShader(gl.FRAGMENT_SHADER, BLUR_FS);
  if (blurVs && blurFs) {
    blurProg = gl.createProgram();
    gl.attachShader(blurProg, blurVs); gl.attachShader(blurProg, blurFs);
    gl.linkProgram(blurProg);
    if (gl.getProgramParameter(blurProg, gl.LINK_STATUS)) {
      uBlurTex = gl.getUniformLocation(blurProg, 'uTex');
      uBlurDir = gl.getUniformLocation(blurProg, 'uDir');
    } else { blurProg = null; }
  }
  // FBO + two textures for ping-pong blur
  const w = lightCanvas.width || 1, h = lightCanvas.height || 1;
  lightFBO = gl.createFramebuffer();
  lightFBOTexA = gl.createTexture();
  lightFBOTexB = gl.createTexture();
  [lightFBOTexA, lightFBOTexB].forEach(tex => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  glReady = true;
  if (dungeonGrid) uploadDungeonGrid();
  console.log('[Lighting] WebGL lighting ready');
}

// Power-of-two ceiling for texture compatibility on mobile GPUs
function _nextPow2(v){let p=1;while(p<v)p<<=1;return p;}
let _gridTexW=0, _gridTexH=0; // actual texture dimensions (may be padded to POT)

function uploadDungeonGrid() {
  if (!dungeonGrid || !webglSupported) return;
  // Pad to power-of-two for mobile GPU compatibility
  _gridTexW = _nextPow2(GRID_W);
  _gridTexH = _nextPow2(GRID_H);
  const data = new Uint8Array(_gridTexW * _gridTexH * 4);
  // Fill with walls (0) then carve floor cells
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {
    const i = (y * _gridTexW + x) * 4;
    const v = (dungeonGrid[y] && dungeonGrid[y][x]) ? 255 : 0;
    data[i] = v; data[i+1] = v; data[i+2] = v; data[i+3] = 255;
  }
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, _gridTexW, _gridTexH, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

function renderLighting(lights, camX, camY) {
  if (!glReady || gl.isContextLost()) return;
  // Half-res for performance; GPU blur pass handles smoothing
  const targetW = Math.ceil(canvas.width / 2);
  const targetH = Math.ceil(canvas.height / 2);
  if (lightCanvas.width !== targetW || lightCanvas.height !== targetH) {
    lightCanvas.width = targetW;
    lightCanvas.height = targetH;
    initGL();
  }
  const w = lightCanvas.width, h = lightCanvas.height;

  // Pass 1: Render lighting to FBO texA
  gl.bindFramebuffer(gl.FRAMEBUFFER, lightFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, lightFBOTexA, 0);
  gl.viewport(0, 0, w, h);
  gl.disable(gl.BLEND);
  const _brightMode = gameMode === 'horde' || gameMode === 'gauntlet' || gameMode === 'survival' || gameMode === 'descent';
  const baseBright = _brightMode ? 0.35 : 0.25;
  gl.clearColor(baseBright, baseBright, baseBright, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(lightProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, gridTex);
  gl.uniform1i(uGrid, 0);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform2f(uCameraPos, camX, camY);
  gl.uniform1f(uCellSize, CELL_SIZE);
  gl.uniform2f(uGridSize, GRID_W, GRID_H);
  // Use padded texture dimensions for correct UV mapping
  gl.uniform2f(uArenaSize, (_gridTexW||GRID_W)*CELL_SIZE, (_gridTexH||GRID_H)*CELL_SIZE);

  const n = Math.min(lights.length, 4);
  gl.uniform1i(uNumLights, n);
  for (let i = 0; i < n; i++) {
    gl.uniform2f(uLightPos[i], lights[i].x, lights[i].y);
    gl.uniform1f(uLightAngle[i], lights[i].angle);
    gl.uniform1f(uLightRadius[i], lights[i].radius);
  }

  const aPos = gl.getAttribLocation(lightProg, 'aPos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (blurProg) {
    const blurAPos = gl.getAttribLocation(blurProg, 'aPos');

    // Pass 2: Horizontal blur — read texA, write texB
    gl.bindFramebuffer(gl.FRAMEBUFFER, lightFBO);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, lightFBOTexB, 0);
    gl.viewport(0, 0, w, h);
    gl.useProgram(blurProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, lightFBOTexA);
    gl.uniform1i(uBlurTex, 0);
    gl.uniform2f(uBlurDir, 1.0 / w, 0.0);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(blurAPos);
    gl.vertexAttribPointer(blurAPos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Pass 3: Vertical blur — read texB, write to canvas
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.bindTexture(gl.TEXTURE_2D, lightFBOTexB);
    gl.uniform2f(uBlurDir, 0.0, 1.0 / h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else {
    // Fallback: copy FBO directly to canvas without blur
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
}

let debugLighting = false;

// Initial GL setup
initGL();

// NETWORKING
// ============================================================
// For native app (Capacitor), set the server URL here. Leave null for web (auto-detects).
const MULTIPLAYER_SERVER_URL = null; // e.g. 'wss://your-server.fly.dev'
function connectWS() {
  const url = MULTIPLAYER_SERVER_URL || `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
  ws = new WebSocket(url);
  ws.onopen = () => console.log('Connected to server');
  ws.onclose = () => { console.log('Disconnected'); ws = null; };
  ws.onerror = (e) => { showMultiError('Connection failed. Is the server running?'); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleServerMessage(msg);
  };
}

function sendMsg(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'lobby_created':
      myId = msg.playerId; lobbyCode = msg.code; lobbySeed = msg.seed; isHost = true;
      sendMsg({ type: 'set_mode', mode: gameMode });
      showLobbyScreen();
      break;
    case 'lobby_joined':
      myId = msg.playerId; lobbyCode = msg.code; lobbySeed = msg.seed; isHost = false;
      showLobbyScreen();
      break;
    case 'lobby_update':
      lobbyPlayers = msg.players;
      isHost = msg.hostId === myId;
      if (msg.mode) gameMode = msg.mode;
      updateLobbyUI();
      break;
    case 'game_start':
      lobbySeed = msg.seed;
      if (msg.mode) gameMode = msg.mode;
      startMultiplayerGame();
      break;
    case 'game_state':
      if (!isHost) applyHostState(msg);
      break;
    case 'player_input':
      if (isHost) remoteInputs[msg.fromId] = msg.input;
      break;
    case 'player_disconnected': {
      const pi = players.findIndex(p => p.id === msg.playerId);
      if (pi !== -1) { players[pi].alive = false; players[pi].hp = 0; }
      break;
    }
    case 'game_over':
      if (!isHost) showDeathScreen();
      break;
    case 'error':
      showMultiError(msg.message);
      break;
  }
}

function showMultiError(txt) { document.getElementById('multi-error').textContent = txt; }
