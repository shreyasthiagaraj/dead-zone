// MENU NAVIGATION
// ============================================================
function showScreen(id) {
  ['start-screen','solo-mode-screen','multi-screen','create-mode-screen','lobby-screen','death-screen'].forEach(s => document.getElementById(s).style.display = 'none');
  document.getElementById('perk-screen').style.display = 'none'; perkSelectionActive = false;
  document.getElementById('wave-summary-screen').style.display = 'none'; waveSummaryActive = false; if(waveSummaryTimer){clearTimeout(waveSummaryTimer);waveSummaryTimer=0;}
  document.getElementById('pause-screen').style.display = 'none'; gamePaused = false;
  if (id) document.getElementById(id).style.display = 'flex';
  // Hide in-game HUD on menu screens, show when playing
  const inGame = !id || id === 'pause-screen' || id === 'wave-summary-screen' || id === 'perk-screen';
  const hudVis = inGame ? '' : 'none';
  ['top-hud','health-hud','mobile-buttons','horde-timer','effects-bar'].forEach(h => { const el=document.getElementById(h); if(el) el.style.display=hudVis; });
}

function showLobbyScreen() { showScreen('lobby-screen'); document.getElementById('lobby-code').textContent = lobbyCode; updateLobbyUI(); }
// Periodically request lobby state as fallback
setInterval(() => { if (gameState === 'menu' && document.getElementById('lobby-screen').style.display !== 'none' && ws && ws.readyState === 1) sendMsg({ type: 'request_lobby_update' }); }, 3000);

function updateLobbyUI() {
  const ul = document.getElementById('lobby-players');
  let html = '';
  // Filled slots
  for (let i = 0; i < lobbyPlayers.length; i++) {
    const p = lobbyPlayers[i];
    const you = p.id === myId ? ' (You)' : '';
    const host = p.id === myId && isHost ? ' <span class="host-tag">HOST</span>' : '';
    html += `<li><span class="dot" style="background:${p.color}"></span>${p.name}${you}${host}</li>`;
  }
  // Empty slots
  for (let i = lobbyPlayers.length; i < 4; i++) {
    html += `<li style="color:#444"><span class="dot" style="background:#333"></span>Empty slot</li>`;
  }
  ul.innerHTML = html;
  // Show start button for host when 2+ players, or waiting message for non-host
  const startBtn = document.getElementById('btn-start-game');
  const waitMsg = document.getElementById('lobby-waiting');
  if (isHost) {
    startBtn.style.display = lobbyPlayers.length >= 2 ? 'inline-block' : 'none';
    waitMsg.textContent = lobbyPlayers.length < 2 ? 'Waiting for players to join...' : '';
    waitMsg.style.display = lobbyPlayers.length < 2 ? 'block' : 'none';
  } else {
    startBtn.style.display = 'none';
    waitMsg.textContent = 'Waiting for host to start...';
    waitMsg.style.display = 'block';
  }
  document.getElementById('lobby-code').textContent = lobbyCode;
  // Show game mode label
  const modeDisp = document.getElementById('mode-display');
  modeDisp.textContent = gameMode === 'descent' ? 'MODE: DESCENT' : gameMode === 'gauntlet' ? 'MODE: GAUNTLET' : gameMode === 'horde' ? 'MODE: HORDE' : gameMode === 'survival' ? 'MODE: SURVIVAL' : 'MODE: CO-OP';
}

function showDeathScreen() {
  gameState = 'dead';
  document.getElementById('btn-menu').style.display = 'none';
  if (score > highScore) { highScore = score; localStorage.setItem('deadzone_highscore', highScore.toString()); }

  // Calculate after-action report
  const survivalTime = Math.floor((Date.now() - runStats.startTime) / 1000);
  const survivalMin = Math.floor(survivalTime / 60);
  const survivalSec = survivalTime % 60;
  const accuracy = runStats.shotsFired > 0 ? Math.floor(runStats.shotsHit / runStats.shotsFired * 100) : 0;
  const killsPerMin = survivalTime > 0 ? (kills / (survivalTime / 60)).toFixed(1) : 0;

  // Rating formula: kills/min × accuracy% × survival_seconds / 100
  const ratingScore = (killsPerMin * accuracy * survivalTime) / 10000;
  let rating, ratingColor;
  if (ratingScore > 8) { rating = 'S'; ratingColor = '#f0c040'; }
  else if (ratingScore > 5) { rating = 'A'; ratingColor = '#4f4'; }
  else if (ratingScore > 3) { rating = 'B'; ratingColor = '#4af'; }
  else if (ratingScore > 1.5) { rating = 'C'; ratingColor = '#fa0'; }
  else if (ratingScore > 0.5) { rating = 'D'; ratingColor = '#f80'; }
  else { rating = 'F'; ratingColor = '#f44'; }

  // Best element
  const elemEntries = Object.entries(runStats.elemKills).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  const bestElem = elemEntries.length > 0 ? elemEntries[0] : null;

}

let gamePaused = false;
function togglePauseMenu() {
  if (gameState !== 'playing' && !gamePaused) return;
  const pauseEl = document.getElementById('pause-screen');
  if (gamePaused) {
    // Resume
    gamePaused = false;
    pauseEl.style.display = 'none';
    gameState = 'playing';
    canvas.focus();
  } else {
    // Pause
    gamePaused = true;
    pauseEl.style.display = 'block';
    const modeLabel = gameMode === 'descent' ? `DESCENT — SECTION ${descentSection+1}` : gameMode === 'gauntlet' ? `GAUNTLET — ROOM ${gauntletRoom}` : gameMode === 'horde' ? `HORDE — ${Math.floor(hordeTimer/60)}s` : gameMode === 'survival' ? `SURVIVAL — WAVE ${survivalWave}` : `DUNGEON — LEVEL ${level}`;
    document.getElementById('pause-mode-label').textContent = isMultiplayer ? modeLabel + ' (multiplayer)' : modeLabel;
    // Build inventory display
    const lp = getLocalPlayer();
    let inv = '';
    if (lp) {
      // Weapons
      inv += '<div style="color:#f0c040;font-weight:bold;margin-bottom:4px">WEAPONS</div>';
      for (let wi = 0; wi < lp.weapons.length; wi++) {
        const ww = lp.weapons[wi], wd = WEAPON_DEFS[ww.type];
        if (wd) inv += `<div style="color:${wd.color};padding:2px 0">${wi === lp.currentWeapon ? '► ' : '  '}${wd.name}${wd.infinite ? '' : ` (${ww.ammo})`}</div>`;
      }
      // Perks
      const perkEntries = Object.entries(playerPerks).filter(([,c]) => c > 0);
      if (perkEntries.length > 0) {
        inv += '<div style="color:#f0c040;font-weight:bold;margin-top:8px;margin-bottom:4px">PERKS</div>';
        for (const [pid, count] of perkEntries) {
          const pd = PERK_DEFS.find(p => p.id === pid);
          if (pd) inv += `<div style="color:${pd.color};padding:2px 0">${pd.icon} ${pd.name}${count > 1 ? ' x' + count : ''} — ${pd.desc}</div>`;
        }
      }
      // Synergies
      const syns = getActiveSynergies();
      if (syns.length > 0) {
        inv += '<div style="color:#f0c040;font-weight:bold;margin-top:8px;margin-bottom:4px">SYNERGIES</div>';
        for (const s of syns) inv += `<div style="color:${s.color};padding:2px 0">★ ${s.name} — ${s.desc}</div>`;
      }
      // Power-up
      if (activePowerUp) {
        const pdef = POWERUP_TYPES.find(p => p.id === activePowerUp.id);
        if (pdef) inv += `<div style="color:${pdef.color};font-weight:bold;margin-top:8px">${pdef.icon} ${pdef.name} — ${Math.ceil(activePowerUp.timer / 60)}s left</div>`;
      }
    }
    document.getElementById('pause-inventory').innerHTML = inv;
    // Only actually freeze the game loop in single player
    if (!isMultiplayer) gameState = 'paused';
  }
}

function startSoloGame() {
  initAudio(); loadSfx(); isMultiplayer = false; isHost = true;
  gameState = 'playing'; score = 0; kills = 0; gameTime = 0; level = 1; spawnTimer = 0; gamePaused = false;
  activePowerUp = null; activeElement = null; elementZones = []; hazeParticles = [];
  runStats = { shotsFired: 0, shotsHit: 0, damageDealt: 0, damageTaken: 0, bestStreak: 0, shockwavesUsed: 0, elemKills: { fire: 0, ice: 0, lightning: 0 }, startTime: Date.now() };
  // Reset joysticks to prevent stuck state on restart
  leftJoystick.active=false;leftJoystick.dx=0;leftJoystick.dy=0;leftJoystick.nx=0;leftJoystick.ny=0;
  rightJoystick.active=false;rightJoystick.dx=0;rightJoystick.dy=0;rightJoystick.nx=0;rightJoystick.ny=0;rightJoystick.aiming=false;rightJoystick.firing=false;
  for(const k in keys) delete keys[k];
  window._currentLevelSeed = Date.now();
  if (gameMode === 'descent') {
    generateDescentMap(window._currentLevelSeed);
    exitPos = null;
  } else if (gameMode === 'survival') {
    generateArena(window._currentLevelSeed);
    exitPos = null;
    resetSurvivalState();
  } else if (gameMode === 'horde') {
    generateHordeArena(window._currentLevelSeed);
    exitPos = null;
    hordeTimer = 0; hordeCircleTimer = 0;
  } else if (gameMode === 'gauntlet') {
    gauntletRoom = 0; gauntletState = 'intro'; gauntletTimer = 0;
    generateGauntletRoom(1);
  } else {
    generateDungeon(window._currentLevelSeed);
  }
  const _spawnArena = rooms[0];
  const marginX = Math.floor((GRID_W - DESCENT_WIDTH) / 2);
  const c = gameMode === 'descent' ? { x: (marginX + DESCENT_WIDTH/2) * CELL_SIZE, y: 3 * CELL_SIZE } : (gameMode === 'gauntlet' && _spawnArena._spawnX) ? { x: _spawnArena._spawnX, y: _spawnArena._spawnY } : getRoomCenter(rooms[0]);
  players = [createPlayerObj(0, 'You', PLAYER_COLORS[0], c.x, c.y)];
  localPlayerIdx = 0;
  bullets = []; zombies = []; particles = []; pickups = []; decals = []; floatingTexts = []; explosions = []; barrels = [];
  _nextZombieId = 1;
  camera.x = c.x; camera.y = c.y;
  if (gameMode === 'dungeon') placeExit();
  showScreen(null); document.getElementById('btn-menu').style.display = 'block';
  ambientDripTimer = 100; zombieGroanTimer = 200; healthLowTimer = 0;
  playMusic(gameMode === 'horde' ? pickRandomTrack(COMBAT_TRACKS, _lastCombatTrack) : pickRandomTrack(AMBIENT_TRACKS, _lastAmbientTrack), 2.0);
  document.activeElement?.blur(); canvas.focus();
  if (gameMode === 'descent') startDescent();
  else if (gameMode === 'survival') startSurvivalWave();
  else if (gameMode === 'horde') startHorde();
  else if (gameMode === 'gauntlet') startGauntlet();
  else startLevel();
}

function resetSurvivalState() {
  survivalWave = 0; survivalWaveState = 'countdown'; survivalWaveTimer = 180;
  survivalZombiesTotal = 0; survivalZombiesSpawned = 0; survivalZombiesKilled = 0;
  currentWaveMod = null;
}

function startMultiplayerGame() {
  initAudio(); loadSfx(); isMultiplayer = true; gameState = 'playing';
  score = 0; kills = 0; gameTime = 0; spawnTimer = 0; resetPerks();
  window._currentLevelSeed = lobbySeed;
  if (gameMode === 'survival') {
    generateArena(lobbySeed);
    exitPos = null;
    resetSurvivalState();
  } else if (gameMode === 'horde') {
    generateHordeArena(lobbySeed);
    exitPos = null;
    hordeTimer = 0; hordeCircleTimer = 0;
    { const _hc = getRoomCenter(rooms[0]); hordeCircleCx = _hc.x; hordeCircleCy = _hc.y; }
  } else if (gameMode === 'descent') {
    generateDescentMap(lobbySeed);
    initDescentSections();
    exitPos = null;
  } else if (gameMode === 'gauntlet') {
    gauntletRoom = 0; gauntletState = 'intro'; gauntletTimer = 0;
    generateGauntletRoom(1);
  } else {
    generateDungeon(lobbySeed);
  }
  const marginX2 = Math.floor((GRID_W - DESCENT_WIDTH) / 2);
  const c = gameMode === 'descent' ? { x: (marginX2 + DESCENT_WIDTH/2) * CELL_SIZE, y: 3 * CELL_SIZE } : getRoomCenter(rooms[0]);
  players = [];
  for (let i = 0; i < lobbyPlayers.length; i++) {
    const lp = lobbyPlayers[i];
    const angle = (i / lobbyPlayers.length) * Math.PI * 2;
    const px = c.x + Math.cos(angle) * 40, py = c.y + Math.sin(angle) * 40;
    players.push(createPlayerObj(lp.id, lp.name, lp.color, px, py));
    if (lp.id === myId) localPlayerIdx = i;
  }
  remoteInputs = {};
  bullets = []; zombies = []; particles = []; pickups = []; decals = []; floatingTexts = []; explosions = []; barrels = [];
  _nextZombieId = 1;
  camera.x = c.x; camera.y = c.y;
  if (gameMode === 'dungeon') { placeExit(); }
  level = 1;
  ambientDripTimer = 100; zombieGroanTimer = 200; healthLowTimer = 0;
  playMusic(gameMode === 'horde' ? pickRandomTrack(COMBAT_TRACKS, _lastCombatTrack) : pickRandomTrack(AMBIENT_TRACKS, _lastAmbientTrack), 2.0);
  showScreen(null); document.getElementById('btn-menu').style.display = 'block';
  document.activeElement?.blur(); canvas.focus();
  if (isHost) {
    if (gameMode === 'descent') startDescent();
    else if (gameMode === 'survival') startSurvivalWave();
    else if (gameMode === 'horde') startHorde();
    else if (gameMode === 'gauntlet') startGauntlet();
    else startLevel();
  }
}

function handleKeyDown(e) { keys[e.key.toLowerCase()] = true; if (e.key === 'F9') { debugLighting = !debugLighting; e.preventDefault(); } if (e.key === 'Escape') { e.preventDefault(); togglePauseMenu(); return; } if (gameState === 'playing') { if (e.key === 'r') reloadWeapon(); if (e.key >= '1' && e.key <= '9') switchWeapon(parseInt(e.key)-1); if (e.key === '0') switchWeapon(9); if (e.key === 'e') tryPickup(true); if (e.key === ' ') { e.preventDefault(); dash(); } } }
function handleKeyUp(e) { keys[e.key.toLowerCase()] = false; }
window.addEventListener('keydown', handleKeyDown);

window.addEventListener('wheel', e => { if (gameState !== 'playing') return; const lp = getLocalPlayer(); if (!lp) return; switchWeapon((lp.currentWeapon + (e.deltaY > 0 ? 1 : -1) + lp.weapons.length) % lp.weapons.length); });

// Touch
function handleTouchStart(e) { if (gameState !== 'playing') return; e.preventDefault(); for (const t of e.changedTouches) { const tx=t.clientX,ty=t.clientY,el=document.elementFromPoint(tx,ty); if (el&&(el.classList.contains('weapon-slot')||el.classList.contains('mobile-btn'))) continue; const hw=window.innerWidth/2; if (tx<hw&&!leftJoystick.active) { leftJoystick.active=true;leftJoystick.id=t.identifier;leftJoystick.cx=tx;leftJoystick.cy=ty;leftJoystick.dx=0;leftJoystick.dy=0;leftJoystick.nx=0;leftJoystick.ny=0; } else if (tx>=hw&&!rightJoystick.active) { rightJoystick.active=true;rightJoystick.id=t.identifier;rightJoystick.cx=tx;rightJoystick.cy=ty;rightJoystick.dx=0;rightJoystick.dy=0;rightJoystick.nx=0;rightJoystick.ny=0;rightJoystick.firing=false; } } }
function handleTouchMove(e) { if (gameState !== 'playing') return; e.preventDefault(); for (const t of e.changedTouches) { if (leftJoystick.active&&t.identifier===leftJoystick.id) { let dx=t.clientX-leftJoystick.cx,dy=t.clientY-leftJoystick.cy; const d=Math.sqrt(dx*dx+dy*dy); if (d>JOYSTICK_LEFT_MAX){dx=dx/d*JOYSTICK_LEFT_MAX;dy=dy/d*JOYSTICK_LEFT_MAX;} leftJoystick.dx=dx;leftJoystick.dy=dy;leftJoystick.nx=dx/JOYSTICK_LEFT_MAX;leftJoystick.ny=dy/JOYSTICK_LEFT_MAX; } if (rightJoystick.active&&t.identifier===rightJoystick.id) { let dx=t.clientX-rightJoystick.cx,dy=t.clientY-rightJoystick.cy; const d=Math.sqrt(dx*dx+dy*dy); if (d>JOYSTICK_RIGHT_MAX){dx=dx/d*JOYSTICK_RIGHT_MAX;dy=dy/d*JOYSTICK_RIGHT_MAX;} rightJoystick.dx=dx;rightJoystick.dy=dy;rightJoystick.nx=dx/JOYSTICK_RIGHT_MAX;rightJoystick.ny=dy/JOYSTICK_RIGHT_MAX;const mag=Math.sqrt(rightJoystick.nx*rightJoystick.nx+rightJoystick.ny*rightJoystick.ny);rightJoystick.aiming=mag>0.15;rightJoystick.firing=mag>0.65; } } }
function handleTouchEnd(e) { if (gameState !== 'playing') return; e.preventDefault(); for (const t of e.changedTouches) { if (leftJoystick.active&&t.identifier===leftJoystick.id){leftJoystick.active=false;leftJoystick.dx=0;leftJoystick.dy=0;leftJoystick.nx=0;leftJoystick.ny=0;} if (rightJoystick.active&&t.identifier===rightJoystick.id){rightJoystick.active=false;rightJoystick.dx=0;rightJoystick.dy=0;rightJoystick.nx=0;rightJoystick.ny=0;rightJoystick.aiming=false;rightJoystick.firing=false;} } }

function switchWeapon(idx) { const lp=getLocalPlayer(); if(lp&&lp.alive&&idx>=0&&idx<lp.weapons.length&&idx!==lp.currentWeapon){stopWeaponLoop();lp.currentWeapon=idx;lp.weapons[idx].reloading=false;playWeaponSwitchSound();} }
function reloadWeapon() { const lp=getLocalPlayer(); if(!lp||!lp.alive) return; const w=lp.weapons[lp.currentWeapon],d=WEAPON_DEFS[w.type]; if(w.reloading||w.ammo===d.magSize||w.reserveAmmo===0) return; stopWeaponLoop();w.reloading=true;w.reloadTimer=d.reloadTime;playReloadSound(); }

function fireWeaponForPlayer(p) {
  // Smooth scaling gun — same weapon, just gets stronger
  const gun = getScaledGun();
  const now = performance.now();
  let effectiveFireRate = gun.fireRate;
  if (playerHasPowerUp(p, 'rage')) effectiveFireRate /= 1.5;
  if (now - _weaponLastFired < effectiveFireRate) return;
  _weaponLastFired = now;
  if (p.weapons && p.weapons[p.currentWeapon]) p.weapons[p.currentWeapon].muzzleFlash = 6;
  // Triple shot: 3 bullets in a spread
  const isTriple = hasPowerUp('triple');
  const shotCount = isTriple ? 3 : 1;
  if (p === getLocalPlayer()) runStats.shotsFired += shotCount;
  for (let si = 0; si < shotCount; si++) {
    const spreadOff = shotCount > 1 ? (si - 1) * 0.15 : 0;
    const sp = (Math.random()-0.5) * gun.spread * 2 + spreadOff;
    const a = p.angle + sp, c = Math.cos(a), s = Math.sin(a);
    let dmg = isTriple ? Math.floor(gun.damage * 0.5) : gun.damage; // triple: 50% damage per bullet
    if (playerHasPowerUp(p, 'rage')) dmg *= 2;
    let isCrit = false;
    if (Math.random() < 0.05) { dmg *= 3; isCrit = true; }
    const elColor = activeElement ? ELEMENT_TYPES.find(e=>e.id===activeElement.id)?.color : null;
    const bSize = isTriple ? Math.max(2, gun.bulletSize - 1) : gun.bulletSize; // triple: smaller bullets
    bullets.push({
      x: p.x+c*22, y: p.y+s*22, vx: c*gun.bulletSpeed, vy: s*gun.bulletSpeed,
      damage: dmg, color: isCrit?'#f0f':(elColor||gun.bulletColor), size: isCrit?bSize+2:bSize,
      knockback: 0, pierce: gun.pierce, pierced: 0, life: 35,
      flame: false, explosive: false, explosionRadius: 0,
      tracer: false, chain: false, chainRange: 0, chainCount: 0,
      laserGlow: false, grenade: false,
      owner: 'player', ownerId: p.id, trail: [], crit: isCrit,
      _element: activeElement?.id || null, _homing: false, _bouncing: 0,
    });
  }
  // Sound pitch shifts slightly with power
  const freq = 600 - Math.min(runKills, 200);
  playSound(freq, 0.05, 'square', 0.2);
  if (p === getLocalPlayer()) screenShake.intensity = Math.max(screenShake.intensity, 2 + Math.min(runKills/100, 2));
  const c2=Math.cos(p.angle),s2=Math.sin(p.angle);
  for(let k=0;k<3;k++)particles.push({x:p.x+c2*24,y:p.y+s2*24,vx:c2*(3+Math.random()*3)+(Math.random()-0.5)*2,vy:s2*(3+Math.random()*3)+(Math.random()-0.5)*2,life:8+Math.random()*6,maxLife:14,size:2+Math.random()*2,color:gun.bulletColor,type:'spark'});
  return;
}
function fireSingleShot(p,w,d) { /* legacy — unused */
  w.lastFired=performance.now();
  // Overcharge: don't consume ammo
  if(!playerHasPowerUp(p,'overcharge')) w.ammo--;
  w.muzzleFlash=6;
  const spreadMult=Math.pow(0.5,getPlayerPerkCount(p,'steady_aim'));
  const extraPierce=getPlayerPerkCount(p,'ricochet');
  const blastMult=1+getPlayerPerkCount(p,'blast')*0.5;
  const pellets=d.pellets||1;
  for(let i=0;i<pellets;i++){const sp=(Math.random()-0.5)*d.spread*2*spreadMult,a=p.angle+sp,c=Math.cos(a),s=Math.sin(a);
    let dmg=d.damage, isCrit=false;
    // Power-up damage boosts
    if(playerHasPowerUp(p,'rage')) dmg*=2;
    if(playerHasPowerUp(p,'frenzy')) dmg*=3;
    if(playerHasPerk(p,'berserker')&&p.hp<p.maxHp*0.3) dmg*=1+getPlayerPerkCount(p,'berserker')*0.4;
    // Base 5% crit chance + 15% per crit perk stack
    const critChance=0.05+getPlayerPerkCount(p,'critical')*0.15;
    if(Math.random()<critChance){dmg*=3;isCrit=true;}
    bullets.push({x:p.x+c*22,y:p.y+s*22,vx:c*d.bulletSpeed,vy:s*d.bulletSpeed,damage:dmg,color:isCrit?'#f0f':d.bulletColor,size:isCrit?d.bulletSize+2:d.bulletSize,knockback:isCrit?d.knockback*2:d.knockback,pierce:d.pierce+extraPierce,pierced:0,life:d.bulletLife||60,flame:d.flame||false,explosive:d.explosive||false,explosionRadius:(d.explosionRadius||0)*blastMult,tracer:d.tracer||false,chain:d.chain||false,chainRange:d.chainRange||0,chainCount:d.chainCount||0,laserGlow:d.laserGlow||false,grenade:d.grenade||false,owner:'player',ownerId:p.id,trail:[],crit:isCrit});}
  playWeaponSound(w.type,d.sound);
  if(p===getLocalPlayer()) screenShake.intensity=Math.max(screenShake.intensity,d.shakeIntensity);
  const c2=Math.cos(p.angle),s2=Math.sin(p.angle);
  for(let i=0;i<3;i++) particles.push({x:p.x+c2*24,y:p.y+s2*24,vx:c2*(3+Math.random()*3)+(Math.random()-0.5)*2,vy:s2*(3+Math.random()*3)+(Math.random()-0.5)*2,life:8+Math.random()*6,maxLife:14,size:2+Math.random()*2,color:d.bulletColor,type:'spark'});
  particles.push({x:p.x+(-s2)*8,y:p.y+c2*8,vx:(-s2)*(2+Math.random())+(Math.random()-0.5),vy:c2*(2+Math.random())+(Math.random()-0.5),life:30,maxLife:30,size:2,color:'#da3',type:'casing',gravity:0.1});
}

function dash() {
  const lp=getLocalPlayer(); if(!lp||!lp.alive||lp.dashCooldown>0) return;
  lp.dashCooldown=DASH_COOLDOWN;
  lp.invincible=Math.max(lp.invincible, 200); // brief invincibility during shockwave
  // ELEMENTAL SHOCKWAVE — blast inherits active element
  runStats.shockwavesUsed++;
  const SHOCKWAVE_RADIUS = 150;
  const blastElem = activeElement?.id || null;
  if (isHost) {
    for (const z of zombies) {
      const sd = Math.sqrt((z.x-lp.x)**2+(z.y-lp.y)**2);
      if (sd < SHOCKWAVE_RADIUS && sd > 0.1) {
        const closeness = 1 - sd/SHOCKWAVE_RADIUS;
        const pushForce = 10 + closeness * 30;
        const dmg = Math.floor(100 * closeness);
        damageZombie(z, dmg, (z.x-lp.x)/sd * pushForce, (z.y-lp.y)/sd * pushForce);
        z.staggerTimer = Math.max(z.staggerTimer, Math.floor(15 + closeness * 20));
        // Apply element from blast
        if (blastElem === 'fire') { z._burning = (z._burning||0) + 20; z._burnTimer = 240; }
        else if (blastElem === 'ice') { z._iceStacks = (z._iceStacks||0) + 2; z._slowTimer = Math.max(z._slowTimer||0, 180); if (z._iceStacks >= 3) { z._frozenTimer = 150; z._iceStacks = 0; } }
        else if (blastElem === 'lightning') { z._shocked = 45; z.staggerTimer = Math.max(z.staggerTimer, 25); damageZombie(z, 15, 0, 0); }
      }
    }
    // Blast detonates nearby barrels
    for(let bi=barrels.length-1;bi>=0;bi--){const br=barrels[bi];const bd=Math.sqrt((br.x-lp.x)**2+(br.y-lp.y)**2);if(bd<SHOCKWAVE_RADIUS){explodeBarrel(br,bi);}}
  }
  // Elemental shockwave visuals — color and effect match element
  const blastColor = blastElem === 'fire' ? '#f80' : blastElem === 'ice' ? '#aef' : blastElem === 'lightning' ? '#4ff' : '#4af';
  const blastColor2 = blastElem === 'fire' ? '#fa0' : blastElem === 'ice' ? '#cef' : blastElem === 'lightning' ? '#8ff' : '#fff';
  for (let si = 0; si < 32; si++) { const sa = si/32*Math.PI*2; particles.push({x:lp.x+Math.cos(sa)*15,y:lp.y+Math.sin(sa)*15,vx:Math.cos(sa)*10,vy:Math.sin(sa)*10,life:22,maxLife:22,size:5,color:blastColor,type:'spark'}); }
  for (let si = 0; si < 16; si++) { const sa = si/16*Math.PI*2; particles.push({x:lp.x+Math.cos(sa)*10,y:lp.y+Math.sin(sa)*10,vx:Math.cos(sa)*6,vy:Math.sin(sa)*6,life:18,maxLife:18,size:4,color:blastColor2,type:'spark'}); }
  // Lightning blast: chain arcs between hit enemies + radiating bolts
  if (blastElem === 'lightning') {
    // Gather enemies hit by the blast
    const hitZombies = zombies.filter(z => { const sd = Math.sqrt((z.x-lp.x)**2+(z.y-lp.y)**2); return sd < SHOCKWAVE_RADIUS && sd > 0.1; });
    // Arc from player to each hit enemy
    for (const hz of hitZombies) {
      particles.push({x:lp.x,y:lp.y,vx:0,vy:0,life:22,maxLife:22,size:1,color:'#4ff',type:'lightning',tx:hz.x,ty:hz.y});
      particles.push({x:lp.x,y:lp.y,vx:0,vy:0,life:16,maxLife:16,size:1,color:'#fff',type:'lightning',tx:hz.x,ty:hz.y});
      for(let li=0;li<4;li++){particles.push({x:hz.x+(Math.random()-0.5)*14,y:hz.y+(Math.random()-0.5)*14,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:10+Math.random()*8,maxLife:18,size:2+Math.random()*2,color:'#4ff',type:'spark'});}
    }
    // Chain arcs between hit enemies (nearest-neighbor chain)
    if (hitZombies.length >= 2) {
      const chained = new Set();
      let lastZ = hitZombies[0]; chained.add(lastZ);
      for (let ci = 0; ci < hitZombies.length - 1; ci++) {
        let bestD = Infinity, bestZ = null;
        for (const hz of hitZombies) { if (chained.has(hz)) continue; const cd = Math.sqrt((hz.x-lastZ.x)**2+(hz.y-lastZ.y)**2); if (cd < bestD) { bestD = cd; bestZ = hz; } }
        if (!bestZ) break; chained.add(bestZ);
        particles.push({x:lastZ.x,y:lastZ.y,vx:0,vy:0,life:20,maxLife:20,size:1,color:'#4ff',type:'lightning',tx:bestZ.x,ty:bestZ.y});
        particles.push({x:lastZ.x,y:lastZ.y,vx:0,vy:0,life:14,maxLife:14,size:1,color:'#fff',type:'lightning',tx:bestZ.x,ty:bestZ.y});
        for(let li=0;li<3;li++){particles.push({x:bestZ.x+(Math.random()-0.5)*10,y:bestZ.y+(Math.random()-0.5)*10,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:8+Math.random()*8,maxLife:16,size:2+Math.random()*2,color:Math.random()>0.3?'#4ff':'#fff',type:'spark'});}
        lastZ = bestZ;
      }
    }
    // Radiating lightning bolts from player — always visible even with no enemies
    const boltCount = 8 + Math.floor(Math.random() * 4);
    for (let bi = 0; bi < boltCount; bi++) {
      const ba = (bi / boltCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const bDist = 80 + Math.random() * (SHOCKWAVE_RADIUS - 80);
      const tx = lp.x + Math.cos(ba) * bDist, ty = lp.y + Math.sin(ba) * bDist;
      particles.push({x:lp.x,y:lp.y,vx:0,vy:0,life:18+Math.floor(Math.random()*8),maxLife:26,size:1,color:'#4ff',type:'lightning',tx,ty});
      // Branch bolt from midpoint of some arcs
      if (Math.random() > 0.5) {
        const mx = lp.x + Math.cos(ba) * bDist * 0.5, my = lp.y + Math.sin(ba) * bDist * 0.5;
        const branchA = ba + (Math.random() - 0.5) * 1.2;
        const branchD = 40 + Math.random() * 60;
        particles.push({x:mx,y:my,vx:0,vy:0,life:14+Math.floor(Math.random()*6),maxLife:20,size:1,color:'#8ff',type:'lightning',tx:mx+Math.cos(branchA)*branchD,ty:my+Math.sin(branchA)*branchD});
      }
      // Sparks at bolt endpoints
      for(let si=0;si<2;si++){particles.push({x:tx+(Math.random()-0.5)*10,y:ty+(Math.random()-0.5)*10,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:8+Math.random()*8,maxLife:16,size:2+Math.random()*3,color:Math.random()>0.4?'#4ff':'#fff',type:'spark'});}
    }
  }
  // Ground decal from elemental blast
  if (blastElem) { for (let di = 0; di < 8; di++) { const da = di/8*Math.PI*2, dd = 40+Math.random()*80; decals.push({x:lp.x+Math.cos(da)*dd,y:lp.y+Math.sin(da)*dd,size:10+Math.random()*15,alpha:0.4,color:blastElem==='fire'?'#420':blastElem==='ice'?'#245':blastElem==='lightning'?'#234':'#223'}); } }
  decals.push({x:lp.x,y:lp.y,size:60+Math.random()*20,alpha:0.3,color:blastElem==='fire'?'#420':blastElem==='ice'?'#245':blastElem==='lightning'?'#234':'#223'});
  screenShake.intensity = Math.max(screenShake.intensity, 10);
  // Elemental blast sound — layered: base blast + elemental SFX
  playSfx('blast_default', 0.4);
  if (blastElem === 'fire') { playSfx('blast_fire', 0.5); }
  else if (blastElem === 'ice') { playSfx('blast_ice', 0.5); }
  else if (blastElem === 'lightning') { playSfx('blast_lightning', 0.5); }
}


// In multiplayer, only the host runs authoritative pickups for ALL players.
// Non-host only gets visual feedback — state syncs from host.
let _nearbyWeaponPickup = null; // {weaponType, index} — shown as swap prompt in HUD

function tryPickup(manual) {
  const lp=getLocalPlayer(); if(!lp||!lp.alive) return;
  tryPickupForPlayer(lp, true, manual);
}
function tryPickupForPlayer(pl, isLocalUI, manual) {
  if(!pl||!pl.alive) return;
  for(let i=pickups.length-1;i>=0;i--){ const p=pickups[i],dx=pl.x-p.x,dy=pl.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<PICKUP_RANGE){
      if(p.dropCooldown>0) continue;
      if(p.type==='weapon'){const ex=pl.weapons.find(w=>w.type===p.weaponType);if(ex){const d=WEAPON_DEFS[p.weaponType];if(d){ex.reserveAmmo=Math.min(ex.reserveAmmo+d.totalAmmo,d.totalAmmo*2);if(isLocalUI)showPickupMsg(`+${d.totalAmmo} ${d.name} AMMO`,`${d.name}: ${d.damage} dmg`);};}else if(pl.weapons.length<MAX_WEAPONS){const nd=WEAPON_DEFS[p.weaponType];pl.weapons.push(createWeapon(p.weaponType));pl.currentWeapon=pl.weapons.length-1;if(isLocalUI)showPickupMsg(`${nd?nd.name:'?'} ACQUIRED`,nd?`${nd.damage} dmg${nd.chain?' — chains to '+nd.chainCount+' targets':''}${nd.explosive?' — explosive':''}${nd.pellets?' — '+nd.pellets+' pellets':''}${nd.pierce?' — pierces '+nd.pierce:''}`:'')}else{
        // At max weapons: only swap on manual pickup (E key), show prompt otherwise
        if(!manual){if(isLocalUI&&pl===getLocalPlayer())_nearbyWeaponPickup={weaponType:p.weaponType,index:i};continue;}
        const droppedWeapon=pl.weapons[pl.currentWeapon];
        pickups.push({type:'weapon',weaponType:droppedWeapon.type,x:pl.x,y:pl.y,bobTimer:Math.random()*Math.PI*2,dropCooldown:90});
        pl.weapons[pl.currentWeapon]=createWeapon(p.weaponType);
        if(isLocalUI)showPickupMsg(`${WEAPON_DEFS[p.weaponType].name} SWAPPED`);
      }if(isLocalUI)playPickupSound();pickups.splice(i,1);}
      else if(p.type==='health'){if(pl.hp<pl.maxHp){pl.hp=Math.min(pl.maxHp,pl.hp+p.amount);if(isLocalUI){showPickupMsg(`+${p.amount} HP`);playHealthPickupSound();}pickups.splice(i,1);}}
      else if(p.type==='ammo'){const w=pl.weapons[pl.currentWeapon],d=WEAPON_DEFS[w.type];if(!d.infinite){w.reserveAmmo+=d.magSize*3;if(isLocalUI){showPickupMsg('+AMMO');playPickupSound();}pickups.splice(i,1);}}
      else if(p.type==='powerup'){
        if(isLocalUI){stopSunbeamLoop();const ppd=POWERUP_TYPES.find(t=>t.id===p.powerupId);activatePowerUp(p.powerupId);playPickupSound();if(ppd)showPickupMsg(`${ppd.icon} ${ppd.name}`,ppd.desc);}
        if(p.powerupId==='nuke'&&isHost){for(const z of zombies){z.hp=0;}}
        pickups.splice(i,1);}
      else if(p.type==='orbital'){
        if(isLocalUI){activateOrbital(p.orbitalId);playPickupSound();}
        pickups.splice(i,1);}
    }
  }
}

function placeExit() {
  // Exit is always in rooms[1] (opposite corner from spawn rooms[0])
  exitPos = getRoomCenter(rooms[1]);
}

function advanceLevel() {
  level++;
  score += 500 * level;
  playLevelCompleteSound(); playExitFoundSound();
  addFloatingText(getLocalPlayer().x, getLocalPlayer().y - 30, `LEVEL ${level}!`, '#f0c040');
  document.getElementById('wave-num').textContent = `LEVEL ${level}`;
  document.getElementById('wave-sub').textContent = 'Find the exit...';
  document.getElementById('wave-announce').style.opacity = '1';
  setTimeout(() => document.getElementById('wave-announce').style.opacity = '0', 2500);
  // Perk selection on level up
  showPerkSelection();
  // Generate new dungeon with synced seed
  window._currentLevelSeed = Date.now() + level;
  generateDungeon(window._currentLevelSeed);
  const c = getRoomCenter(rooms[0]);
  for (const p of players) { if (p.alive) { p.x = c.x + (Math.random() - 0.5) * 40; p.y = c.y + (Math.random() - 0.5) * 40; } }
  camera.x = c.x; camera.y = c.y;
  bullets = []; zombies = []; pickups = []; decals = []; floatingTexts = []; explosions = []; barrels = [];
  spawnTimer = 0;
  placeExit();
  startLevel();
  playPickupSound();
}

function startLevel() {
  const el=document.getElementById('wave-announce');
  document.getElementById('wave-num').textContent=`LEVEL ${level}`;
  const subs=['Here they come...','Stay alive.','Lock and load.','No mercy.','They\'re hungry...','Hold the line.','Find the exit.','Survive.'];
  document.getElementById('wave-sub').textContent=subs[Math.floor(Math.random()*subs.length)];
  el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000);
  spawnLevelPickups(); spawnHealthPickup(); spawnBarrels(6 + Math.floor(Math.random() * 5));
  elementZones = []; spawnElementZone(); spawnElementZone();
}
function showPickupMsg(t, sub) { const el=document.getElementById('pickup-msg');el.innerHTML=sub?`<span style="font-size:18px;font-weight:bold">${t}</span><br><span style="font-size:12px;color:#aaa">${sub}</span>`:t;el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000); }

function spawnHealthPickup() { const ts=['burst','shotgun','rifle','minigun','flamethrower','laser','lightning','rpg'],t=ts[Math.floor(Math.random()*ts.length)],p=getRandomFloorPos();pickups.push({type:'weapon',weaponType:t,x:p.x,y:p.y,bobTimer:Math.random()*Math.PI*2}); }
function spawnHealthPickup() { const p=getRandomFloorPos();pickups.push({type:'health',amount:25,x:p.x,y:p.y,bobTimer:Math.random()*Math.PI*2}); }
function spawnBarrels(count) {

function updateSurvivalWaves() {

const GAUNTLET_ROOMS = [

function generateGauntletRoom(roomNum) {
  setArenaDimensions(DEFAULT_ARENA_W, DEFAULT_ARENA_H);
  const seed = (window._currentLevelSeed || Date.now()) + roomNum * 777;
  const rng = seededRandom(seed);
  dungeonGrid = [];
  for (let y = 0; y < GRID_H; y++) { dungeonGrid[y] = []; for (let x = 0; x < GRID_W; x++) dungeonGrid[y][x] = false; }
  rooms = [];
  // Horizontal room: wider than tall, player enters from left, exits right
  const baseW = 34 + Math.min(roomNum, 8) * 2;
  const baseH = 22 + Math.min(roomNum, 6);
  const cx = Math.floor(GRID_W / 2), cy = Math.floor(GRID_H / 2);
  const arena = { x: cx - Math.floor(baseW / 2), y: cy - Math.floor(baseH / 2), w: baseW, h: baseH };
  carveRoom(arena);
  rooms.push(arena);
  // Player spawn point (left side) and exit (right side)
  const spawnX = (arena.x + 2) * CELL_SIZE + CELL_SIZE / 2;
  const spawnY = (arena.y + Math.floor(arena.h / 2)) * CELL_SIZE;
  const exitX = (arena.x + arena.w - 3) * CELL_SIZE + CELL_SIZE / 2;
  const exitY = (arena.y + Math.floor(arena.h / 2)) * CELL_SIZE;
  // Store spawn/exit for use by game logic
  arena._spawnX = spawnX; arena._spawnY = spawnY;
  exitPos = { x: exitX, y: exitY, _locked: true };
  // Scatter cover obstacles (sparse — rooms should feel open)
  const numObs = 1 + Math.floor(rng() * 2) + Math.min(roomNum, 4);
  for (let att = 0; att < 100 && att < numObs * 10; att++) {
    const ow = 2 + Math.floor(rng() * 2), oh = 2 + Math.floor(rng() * 2);
    const ox = arena.x + 4 + Math.floor(rng() * (arena.w - ow - 8));
    const oy = arena.y + 3 + Math.floor(rng() * (arena.h - oh - 6));
    // Keep spawn and exit areas clear
    const ocx = (ox + ow / 2) * CELL_SIZE, ocy = (oy + oh / 2) * CELL_SIZE;
    if (Math.sqrt((ocx - spawnX) ** 2 + (ocy - spawnY) ** 2) < 120) continue;
    if (Math.sqrt((ocx - exitX) ** 2 + (ocy - exitY) ** 2) < 120) continue;
    for (let y = oy; y < oy + oh && y < GRID_H; y++) for (let x = ox; x < ox + ow && x < GRID_W; x++) dungeonGrid[y][x] = false;
  }
  // Flood fill from spawn — remove isolated floor cells
  const spawnGX = Math.floor(spawnX / CELL_SIZE), spawnGY = Math.floor(spawnY / CELL_SIZE);
  const visited = [];
  for (let y = 0; y < GRID_H; y++) { visited[y] = []; for (let x = 0; x < GRID_W; x++) visited[y][x] = false; }
  const stack = [[spawnGX, spawnGY]]; if (spawnGY >= 0 && spawnGY < GRID_H && spawnGX >= 0 && spawnGX < GRID_W) visited[spawnGY][spawnGX] = true;
  while (stack.length > 0) {
    const [sx, sy] = stack.pop();
    for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
      const nx = sx+dx, ny = sy+dy;
      if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && !visited[ny][nx] && dungeonGrid[ny][nx]) {
        visited[ny][nx] = true; stack.push([nx, ny]);
      }
    }
  }
  for (let y = arena.y; y < arena.y + arena.h; y++) for (let x = arena.x; x < arena.x + arena.w; x++) {
    if (y >= 0 && y < GRID_H && x >= 0 && x < GRID_W && dungeonGrid[y][x] && !visited[y][x]) dungeonGrid[y][x] = false;
  }
  // Room theme varies
  const themes = [ROOM_THEMES[1], ROOM_THEMES[3], ROOM_THEMES[4], ROOM_THEMES[6], ROOM_THEMES[7]];
  arena.theme = themes[roomNum % themes.length];
  arena.brightness = 1.0;
  arena.flicker = roomNum % 3 === 2;
  roomDetails = [{ ri: 0, theme: arena.theme, details: [], brightness: 1.0, flicker: arena.flicker }];
  buildRoomGrid();
  obstacles = [];
  for (let y = 0; y < GRID_H; y++) { let rs = -1; for (let x = 0; x <= GRID_W; x++) { const isW = x < GRID_W ? !dungeonGrid[y][x] : true; if (isW && rs === -1) rs = x; else if (!isW && rs !== -1) { obstacles.push({ x: rs*CELL_SIZE, y: y*CELL_SIZE, w: (x-rs)*CELL_SIZE, h: CELL_SIZE, color: '#0c0a08' }); rs = -1; } } }
  uploadDungeonGrid();
}

  zombies = updatedZombies;
  // Player bullets are local. Only sync zombie projectiles from host.
  if (msg.zBullets) {
    // Remove old zombie bullets and replace with host state
    bullets = bullets.filter(b => b.owner !== 'zombie');
    for (const zb of msg.zBullets) {
      bullets.push({...zb, pierced:0, pierce:0, knockback:0, trail:[{x:zb.x-zb.vx*2,y:zb.y-zb.vy*2},{x:zb.x-zb.vx,y:zb.y-zb.vy},{x:zb.x,y:zb.y}]});
    }
  }
  // Sync pickups from host
  if (msg.pickups) { pickups = msg.pickups; }
  // Sync barrels from host
  if (msg.barrels) { barrels = msg.barrels.map(br => ({...br, hp: 1})); }
  // Check game over
  if (!players.some(p => p.alive) && gameState === 'playing') showDeathScreen();
}

  document.getElementById('kills-display').textContent=`${kills} KILLS`;

// ---- Neon tunnel menu background ----
function renderMenuBackground() {
  const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;
  const t=performance.now()*0.001;
  ctx.fillStyle='#030308';ctx.fillRect(0,0,w,h);

  // Perspective grid tunnel — rings receding into center
  const numRings=14;
  for(let i=0;i<numRings;i++){
    const depth=(i+t*0.4%1)/numRings; // 0=far, 1=near
    const scale=0.02+depth*depth*0.98; // perspective: small far, big near
    const rw=w*0.9*scale,rh=h*0.9*scale;
    const alpha=(1-depth)*0.35;
    // Color cycles through neon palette
    const hue=(i*25+t*30)%360;
    const color=`hsl(${hue},100%,60%)`;
    ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=8*scale;
    ctx.lineWidth=1+scale*2;
    // Rotating rectangles
    ctx.save();ctx.translate(cx,cy);ctx.rotate(t*0.15+i*0.12);
    ctx.strokeRect(-rw/2,-rh/2,rw,rh);
    ctx.restore();
  }

  // Radiating grid lines from center
  ctx.shadowBlur=0;
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2+t*0.1;
    const c=Math.cos(a),s=Math.sin(a);
    ctx.globalAlpha=0.06;ctx.strokeStyle='#f0f';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+c*w,cy+s*h);ctx.stroke();
  }

  // Floating neon particles drifting outward from center
  for(let i=0;i<20;i++){
    const seed=i*137.5+t*0.3;
    const a=seed%6.28;const spd=(seed*0.7)%1;
    const dist=spd*Math.max(w,h)*0.6;
    const px=cx+Math.cos(a)*dist,py=cy+Math.sin(a)*dist;
    const sz=1+spd*2;
    const hue2=(i*40+t*50)%360;
    ctx.globalAlpha=(1-spd)*0.4;ctx.fillStyle=`hsl(${hue2},100%,70%)`;
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);ctx.fill();
  }

  // Vignette
  const vg=ctx.createRadialGradient(cx,cy,w*0.15,cx,cy,w*0.65);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(3,3,8,0.8)');
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);

  // Scanlines on menu too
  if(window._scanlineCanvas){ctx.globalAlpha=0.06;ctx.fillStyle=ctx.createPattern(window._scanlineCanvas,'repeat');ctx.fillRect(0,0,w,h);}
  ctx.globalAlpha=1;
}

function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (gameState !== 'playing' && gameState !== 'paused') { renderMenuBackground(); renderMinimap(); return; }
  const ox=-camera.x+canvas.width/2+screenShake.x,oy=-camera.y+canvas.height/2+screenShake.y;
  ctx.save();ctx.translate(ox,oy);

  // Floor + walls with room themes
  const vL=camera.x-canvas.width/2-CELL_SIZE,vR=camera.x+canvas.width/2+CELL_SIZE,vT=camera.y-canvas.height/2-CELL_SIZE,vB=camera.y+canvas.height/2+CELL_SIZE;
  const _gridH=GRID_H;
  const mnx=Math.max(0,Math.floor(vL/CELL_SIZE)),mxx=Math.min(GRID_W-1,Math.floor(vR/CELL_SIZE)),mny=Math.max(0,Math.floor(vT/CELL_SIZE)),mxy=Math.min(_gridH-1,Math.floor(vB/CELL_SIZE));
  const _corridorTheme=ROOM_THEMES[0];
  for(let cy=mny;cy<=mxy;cy++)for(let cx=mnx;cx<=mxx;cx++){
    if(dungeonGrid&&dungeonGrid[cy]&&dungeonGrid[cy][cx]){
      // Floor cell — dark with neon grid lines
      const ri=roomGrid&&roomGrid[cy]?roomGrid[cy][cx]:-1;
      const theme=ri>=0&&rooms[ri]?.theme?rooms[ri].theme:_corridorTheme;
      ctx.fillStyle=theme.floor;
      ctx.fillRect(cx*CELL_SIZE,cy*CELL_SIZE,CELL_SIZE,CELL_SIZE);
      // Neon grid lines
      ctx.strokeStyle=theme.grid;ctx.lineWidth=0.5;
      ctx.strokeRect(cx*CELL_SIZE,cy*CELL_SIZE,CELL_SIZE,CELL_SIZE);
      // Corridor neon strip — center line in corridors (not in rooms)
      if(ri<0){const px=cx*CELL_SIZE,py=cy*CELL_SIZE;
        const hFloor=(cx>0&&dungeonGrid[cy][cx-1])&&(cx<GRID_W-1&&dungeonGrid[cy][cx+1]);
        const vFloor=(cy>0&&dungeonGrid[cy-1]&&dungeonGrid[cy-1][cx])&&(cy<_gridH-1&&dungeonGrid[cy+1]&&dungeonGrid[cy+1][cx]);
        ctx.globalAlpha=0.12;ctx.fillStyle='#a4f';
        if(hFloor)ctx.fillRect(px,py+CELL_SIZE/2-1,CELL_SIZE,2);
        if(vFloor)ctx.fillRect(px+CELL_SIZE/2-1,py,2,CELL_SIZE);
        ctx.globalAlpha=1;}
    } else {
      ctx.fillStyle='#050508';
      ctx.fillRect(cx*CELL_SIZE,cy*CELL_SIZE,CELL_SIZE,CELL_SIZE);
      // Neon wall edges — glowing outlines where walls meet floor
      const px=cx*CELL_SIZE,py=cy*CELL_SIZE;
      const floorAbove=cy>0&&dungeonGrid[cy-1]&&dungeonGrid[cy-1][cx];
      const floorBelow=cy<GRID_H-1&&dungeonGrid[cy+1]&&dungeonGrid[cy+1][cx];
      const floorLeft=cx>0&&dungeonGrid[cy][cx-1];
      const floorRight=cx<GRID_W-1&&dungeonGrid[cy][cx+1];
      if(floorAbove||floorBelow||floorLeft||floorRight){
        let accent='#2a1a3a';
        const adj=floorAbove?roomGrid[cy-1][cx]:floorBelow?roomGrid[cy+1][cx]:floorLeft?roomGrid[cy][cx-1]:roomGrid[cy][cx+1];
        if(adj>=0&&rooms[adj]?.theme) accent=rooms[adj].theme.accent;
        // Neon glow edge — wider dim glow
        ctx.globalAlpha=0.25;ctx.fillStyle=accent;
        if(floorAbove) ctx.fillRect(px,py,CELL_SIZE,5);
        if(floorBelow) ctx.fillRect(px,py+CELL_SIZE-5,CELL_SIZE,5);
        if(floorLeft) ctx.fillRect(px,py,5,CELL_SIZE);
        if(floorRight) ctx.fillRect(px+CELL_SIZE-5,py,5,CELL_SIZE);
        // Bright neon line on top
        ctx.globalAlpha=0.9;ctx.fillStyle=accent;
        if(floorAbove) ctx.fillRect(px,py,CELL_SIZE,2);
        if(floorBelow) ctx.fillRect(px,py+CELL_SIZE-2,CELL_SIZE,2);
        if(floorLeft) ctx.fillRect(px,py,2,CELL_SIZE);
        if(floorRight) ctx.fillRect(px+CELL_SIZE-2,py,2,CELL_SIZE);
        ctx.globalAlpha=1;
      }
    }
  }
  const _renderH=ARENA_H;
  ctx.shadowColor='#f0f';ctx.shadowBlur=8;ctx.strokeStyle='#f0f';ctx.lineWidth=2;ctx.strokeRect(0,0,ARENA_W,_renderH);ctx.shadowBlur=0;

  // Room neon accents — corner brackets + subtle pulse glow
  const _neonPulse=0.06+Math.sin(performance.now()*0.002)*0.03;
  for(const r of rooms){
    if(!r||!r.theme)continue;
    const rx=r.x*CELL_SIZE,ry=r.y*CELL_SIZE,rw=r.w*CELL_SIZE,rh=r.h*CELL_SIZE;
    if(rx+rw<vL||rx>vR||ry+rh<vT||ry>vB)continue;
    // Subtle pulsing room fill — clamp to viewport for huge rooms
    const pfx=Math.max(rx,vL),pfy=Math.max(ry,vT),pfw=Math.min(rx+rw,vR)-pfx,pfh=Math.min(ry+rh,vB)-pfy;
    ctx.globalAlpha=_neonPulse;ctx.fillStyle=r.theme.accent;ctx.fillRect(pfx,pfy,pfw,pfh);
    // Corner brackets — only draw if corner is in viewport
    ctx.globalAlpha=0.8;ctx.shadowColor=r.theme.accent;ctx.shadowBlur=6;ctx.strokeStyle=r.theme.accent;ctx.lineWidth=2;
    const cb=14;
    if(rx>vL-cb&&rx<vR&&ry>vT-cb&&ry<vB){ctx.beginPath();ctx.moveTo(rx,ry+cb);ctx.lineTo(rx,ry);ctx.lineTo(rx+cb,ry);ctx.stroke();}
    if(rx+rw>vL&&rx+rw<vR+cb&&ry>vT-cb&&ry<vB){ctx.beginPath();ctx.moveTo(rx+rw-cb,ry);ctx.lineTo(rx+rw,ry);ctx.lineTo(rx+rw,ry+cb);ctx.stroke();}
    if(rx>vL-cb&&rx<vR&&ry+rh>vT&&ry+rh<vB+cb){ctx.beginPath();ctx.moveTo(rx,ry+rh-cb);ctx.lineTo(rx,ry+rh);ctx.lineTo(rx+cb,ry+rh);ctx.stroke();}
    if(rx+rw>vL&&rx+rw<vR+cb&&ry+rh>vT&&ry+rh<vB+cb){ctx.beginPath();ctx.moveTo(rx+rw-cb,ry+rh);ctx.lineTo(rx+rw,ry+rh);ctx.lineTo(rx+rw,ry+rh-cb);ctx.stroke();}
    ctx.shadowBlur=0;
    // For large rooms: add grid of accent dots across the floor
    if(rw>CELL_SIZE*10||rh>CELL_SIZE*10){
      ctx.globalAlpha=0.12;ctx.fillStyle=r.theme.accent;
      const spacing=CELL_SIZE*4;
      const sx=Math.ceil(Math.max(rx,vL)/spacing)*spacing,sy=Math.ceil(Math.max(ry,vT)/spacing)*spacing;
      for(let dy=sy;dy<Math.min(ry+rh,vB);dy+=spacing)for(let dx=sx;dx<Math.min(rx+rw,vR);dx+=spacing){
        ctx.beginPath();ctx.arc(dx,dy,2,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }

  // Room debris and props
  for(const rd of roomDetails){
    const r=rooms[rd.ri]; if(!r)continue;
    const rc=getRoomCenter(r);
    // Skip if room not in viewport
    if(rc.x+r.w*CELL_SIZE/2<vL||rc.x-r.w*CELL_SIZE/2>vR||rc.y+r.h*CELL_SIZE/2<vT||rc.y-r.h*CELL_SIZE/2>vB)continue;
    for(const d of rd.details){
      if(d.x<vL-40||d.x>vR+40||d.y<vT-40||d.y>vB+40)continue;
      ctx.save();
      if(d.type==='crate'){
        ctx.translate(d.x,d.y);ctx.rotate(d.angle||0);
        ctx.fillStyle='#0a0a10';ctx.fillRect(-d.size/2,-d.size/2,d.size,d.size);
        ctx.shadowColor='#4a3';ctx.shadowBlur=4;ctx.strokeStyle='#4a3';ctx.lineWidth=1;ctx.strokeRect(-d.size/2,-d.size/2,d.size,d.size);ctx.shadowBlur=0;
        ctx.globalAlpha=0.3;ctx.strokeStyle='#4a3';ctx.beginPath();ctx.moveTo(-d.size/2,0);ctx.lineTo(d.size/2,0);ctx.stroke();ctx.globalAlpha=1;
      } else if(d.type==='table'){
        ctx.translate(d.x,d.y);ctx.rotate(d.angle||0);
        ctx.fillStyle='#08080e';ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);
        ctx.shadowColor='#448';ctx.shadowBlur=3;ctx.strokeStyle='#448';ctx.lineWidth=1;ctx.strokeRect(-d.w/2,-d.h/2,d.w,d.h);ctx.shadowBlur=0;
      } else if(d.type==='rubble'){
        for(let ri=0;ri<d.count;ri++){
          const rx=d.x+(Math.sin(ri*7.3))*d.size*1.5,ry=d.y+(Math.cos(ri*5.1))*d.size*1.5;
          ctx.fillStyle='#0a0a10';
          ctx.beginPath();ctx.arc(rx,ry,2+d.size*0.3,0,Math.PI*2);ctx.fill();
          ctx.globalAlpha=0.3;ctx.strokeStyle='#336';ctx.lineWidth=0.5;ctx.stroke();ctx.globalAlpha=1;
        }
      } else if(d.type==='stain'){
        ctx.globalAlpha=0.4;
        const g=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.size);
        g.addColorStop(0,d.color);g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.fillRect(d.x-d.size,d.y-d.size,d.size*2,d.size*2);
        ctx.globalAlpha=1;
      } else if(d.type==='pipes'){
        ctx.strokeStyle='#0a0a10';ctx.lineWidth=4;
        ctx.beginPath();
        if(d.vertical){ctx.moveTo(d.x+CELL_SIZE/2,d.y);ctx.lineTo(d.x+CELL_SIZE/2,d.y+d.len*CELL_SIZE);}
        else{ctx.moveTo(d.x,d.y+CELL_SIZE/2);ctx.lineTo(d.x+d.len*CELL_SIZE,d.y+CELL_SIZE/2);}
        ctx.stroke();
        ctx.shadowColor='#448';ctx.shadowBlur=4;ctx.strokeStyle='#448';ctx.lineWidth=1;ctx.stroke();ctx.shadowBlur=0;
      } else if(d.type==='scratch'){
        ctx.globalAlpha=0.3;ctx.strokeStyle='#444';ctx.lineWidth=1;
        ctx.translate(d.x,d.y);ctx.rotate(d.angle);
        for(let si=0;si<3;si++){ctx.beginPath();ctx.moveTo(-d.len/2,si*2-2);ctx.lineTo(d.len/2,si*2-2);ctx.stroke();}
        ctx.globalAlpha=1;
      } else if(d.type==='bloodsmear'){
        ctx.globalAlpha=0.3;ctx.translate(d.x,d.y);ctx.rotate(d.angle);
        const g=ctx.createLinearGradient(-d.len/2,0,d.len/2,0);
        g.addColorStop(0,'rgba(60,10,10,0)');g.addColorStop(0.3,'#3a1010');g.addColorStop(0.7,'#301010');g.addColorStop(1,'rgba(40,8,8,0)');
        ctx.fillStyle=g;ctx.fillRect(-d.len/2,-6,d.len,12);
        ctx.globalAlpha=1;
      }
      ctx.restore();
    }
  }

  // Decals — with faint neon edge glow
  for(const d of decals){ctx.globalAlpha=d.alpha;ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(d.x,d.y,d.size,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=d.alpha*0.3;ctx.shadowColor=d.color;ctx.shadowBlur=6;ctx.strokeStyle=d.color;ctx.lineWidth=1;ctx.stroke();ctx.shadowBlur=0;}ctx.globalAlpha=1;

  // Ground haze wisps — brighter in flashlight beam
  {const _hlp=getLocalPlayer();
  const _ha=_hlp?_hlp.angle:0;
  for(const h of hazeParticles){
    if(h.alpha<0.005)continue;
    let litMult=1;
    if(_hlp&&_hlp.alive){
      const dx=h.x-_hlp.x,dy=h.y-_hlp.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<400&&d>1){
        const aToH=Math.atan2(dy,dx);
        let aDiff=aToH-_ha;while(aDiff>Math.PI)aDiff-=Math.PI*2;while(aDiff<-Math.PI)aDiff+=Math.PI*2;
        if(Math.abs(aDiff)<0.5){
          const distFade=1-d/400;
          const coneFade=1-Math.abs(aDiff)/0.5;
          litMult=1+distFade*coneFade*4; // up to 5x brighter in beam center
        }
      }
    }
    const g=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.size);
    const litColor=litMult>1.5?'#fff':h.color;
    g.addColorStop(0,litColor);g.addColorStop(0.5,litColor);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=Math.min(0.15,h.alpha*litMult);ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(h.x,h.y,h.size,0,Math.PI*2);ctx.fill();
  }ctx.globalAlpha=1;}

  // Horde mode: defend circle on the ground
  if (gameMode === 'horde') {
    const claimRatio = Math.min(1, hordeCircleTimer / HORDE_CIRCLE_CLAIM_TIME);
    const pulse = 0.5 + Math.sin(performance.now() * 0.004) * 0.15;
    // Circle color: transitions from cyan (safe) → yellow (warning) → red (danger)
    const cr = Math.floor(claimRatio < 0.5 ? claimRatio * 2 * 255 : 255);
    const cg = Math.floor(claimRatio < 0.5 ? 255 : (1 - (claimRatio - 0.5) * 2) * 255);
    const cb = Math.floor(claimRatio < 0.3 ? (1 - claimRatio / 0.3) * 255 : 0);
    const circleColor = `rgb(${cr},${cg},${cb})`;
    // Outer glow ring
    ctx.save();
    ctx.globalAlpha = pulse * 0.3;
    ctx.strokeStyle = circleColor; ctx.lineWidth = 8; ctx.shadowColor = circleColor; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(hordeCircleCx, hordeCircleCy, HORDE_CIRCLE_RADIUS, 0, Math.PI * 2); ctx.stroke();
    // Fill with low opacity — shows the territory
    ctx.globalAlpha = pulse * 0.08 + claimRatio * 0.12;
    ctx.fillStyle = circleColor;
    ctx.beginPath(); ctx.arc(hordeCircleCx, hordeCircleCy, HORDE_CIRCLE_RADIUS, 0, Math.PI * 2); ctx.fill();
    // Inner ring (thinner, brighter)
    ctx.globalAlpha = pulse * 0.6;
    ctx.strokeStyle = circleColor; ctx.lineWidth = 2; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(hordeCircleCx, hordeCircleCy, HORDE_CIRCLE_RADIUS - 6, 0, Math.PI * 2); ctx.stroke();
    // Rotating dashed ring
    ctx.globalAlpha = pulse * 0.25;ctx.lineWidth = 1;ctx.setLineDash([6,8]);
    ctx.save();ctx.translate(hordeCircleCx,hordeCircleCy);ctx.rotate(performance.now()*0.001);
    ctx.beginPath();ctx.arc(0,0,HORDE_CIRCLE_RADIUS+16,0,Math.PI*2);ctx.stroke();
    ctx.restore();ctx.setLineDash([]);
    // Claim progress arc (fills clockwise as zombies invade)
    if (claimRatio > 0.01) {
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = '#f44'; ctx.lineWidth = 5; ctx.shadowColor = '#f44'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(hordeCircleCx, hordeCircleCy, HORDE_CIRCLE_RADIUS + 8, -Math.PI/2, -Math.PI/2 + claimRatio * Math.PI * 2); ctx.stroke();
    }
    // Warning text when under attack — neon glow
    if (claimRatio > 0.1) {
      ctx.globalAlpha = 0.5 + Math.sin(performance.now() * 0.008) * 0.3;
      const warnColor = claimRatio > 0.6 ? '#f44' : '#fa0';
      ctx.shadowColor = warnColor; ctx.shadowBlur = 12;
      ctx.fillStyle = warnColor;
      ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(claimRatio > 0.6 ? 'CIRCLE FALLING!' : 'DEFEND!', hordeCircleCx, hordeCircleCy - HORDE_CIRCLE_RADIUS - 20);
      ctx.shadowBlur = 0;
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.restore();
  }

  // Barrels — red with pulsing glow and hazard stripe
  for(const br of barrels){ctx.save();ctx.translate(br.x,br.y);
    // Pulsing danger glow
    const bPulse=0.3+Math.sin(performance.now()*0.004+br.x)*0.15;
    ctx.shadowColor='#f40';ctx.shadowBlur=18;ctx.globalAlpha=bPulse;ctx.fillStyle='#f40';ctx.beginPath();ctx.arc(0,0,br.radius+5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
    // Barrel body — dark with neon outline
    ctx.fillStyle='#1a0808';ctx.beginPath();ctx.arc(0,0,br.radius,0,Math.PI*2);ctx.fill();

    ctx.beginPath();ctx.arc(z.radius*0.4,-z.radius*0.3,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(z.radius*0.4,z.radius*0.3,5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.shadowColor=eyeC2;ctx.shadowBlur=12;ctx.fillStyle=eyeC2;
    ctx.beginPath();ctx.arc(z.radius*0.4,-z.radius*0.3,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(z.radius*0.4,z.radius*0.3,2.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }
  ctx.restore();}

  // ---- Screen Effects ----
  const lp2=getLocalPlayer();
  if(lp2){
    const hpRatio=lp2.hp/lp2.maxHp;
    // Damage flash — red overlay on hit
    if(lp2.damageFlash>0){
      const flashAlpha=lp2.damageFlash/15*0.4;
      ctx.fillStyle=`rgba(255,0,0,${flashAlpha})`;ctx.fillRect(0,0,canvas.width,canvas.height);
      // Blood splatter on screen edges when hit
      if(lp2.damageFlash>12){ctx.save();
        for(let es=0;es<4;es++){const ex=Math.random()*canvas.width,ey=Math.random()<0.5?Math.random()*40:canvas.height-Math.random()*40;
          const gr=ctx.createRadialGradient(ex,ey,0,ex,ey,20+Math.random()*30);gr.addColorStop(0,`rgba(120,0,0,${0.3+Math.random()*0.3})`);gr.addColorStop(1,'rgba(80,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(ex-50,ey-50,100,100);}
        for(let es=0;es<3;es++){const ey2=Math.random()*canvas.height,ex2=Math.random()<0.5?Math.random()*30:canvas.width-Math.random()*30;
          const gr2=ctx.createRadialGradient(ex2,ey2,0,ex2,ey2,15+Math.random()*25);gr2.addColorStop(0,`rgba(100,0,0,${0.2+Math.random()*0.3})`);gr2.addColorStop(1,'rgba(60,0,0,0)');ctx.fillStyle=gr2;ctx.fillRect(ex2-40,ey2-40,80,80);}
      ctx.restore();}
    }
    // Synthwave vignette — purple/blue edges with subtle color shift
    {const svg=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.width*0.3,canvas.width/2,canvas.height/2,canvas.width*0.7);
    svg.addColorStop(0,'rgba(0,0,0,0)');svg.addColorStop(0.7,'rgba(10,0,20,0.2)');svg.addColorStop(1,'rgba(20,0,40,0.45)');
    ctx.fillStyle=svg;ctx.fillRect(0,0,canvas.width,canvas.height);}
    // Low HP vignette — dark edges that intensify as health drops
    if(hpRatio<0.5&&lp2.alive){
      const vigAlpha=Math.min(0.6,(0.5-hpRatio)*1.2);
      const grd=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.width*0.3,canvas.width/2,canvas.height/2,canvas.width*0.7);
      grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,`rgba(30,0,20,${vigAlpha})`);
      ctx.fillStyle=grd;ctx.fillRect(0,0,canvas.width,canvas.height);
      // Pulse effect at critical HP
      if(hpRatio<0.2){const pulse=Math.sin(performance.now()*0.006)*0.1+0.1;ctx.fillStyle=`rgba(255,0,0,${pulse})`;ctx.fillRect(0,0,canvas.width,canvas.height);}
    }
    // Power-up screen tints
    if(hasPowerUp('rage')){ctx.fillStyle='rgba(255,40,0,0.06)';ctx.fillRect(0,0,canvas.width,canvas.height);}
    if(hasPowerUp('triple')){ctx.fillStyle='rgba(255,160,0,0.03)';ctx.fillRect(0,0,canvas.width,canvas.height);}
    if(hasPowerUp('overcharge')){ctx.fillStyle='rgba(255,255,0,0.04)';ctx.fillRect(0,0,canvas.width,canvas.height);}
    if(hasPowerUp('shield')){ctx.fillStyle='rgba(0,200,255,0.04)';ctx.fillRect(0,0,canvas.width,canvas.height);}
    if(hasPowerUp('giant')){ctx.fillStyle='rgba(0,200,0,0.04)';ctx.fillRect(0,0,canvas.width,canvas.height);}
    if(hasPowerUp('freeze')){ctx.fillStyle='rgba(150,200,255,0.06)';ctx.fillRect(0,0,canvas.width,canvas.height);}
    if(hasPowerUp('frenzy')){ctx.fillStyle='rgba(255,100,0,0.08)';ctx.fillRect(0,0,canvas.width,canvas.height);}
  }

  // CRT scanline overlay — breathing/glitching arcade monitor
  if(!window._scanlineCanvas){
    window._scanlineCanvas=document.createElement('canvas');
    window._scanlineCanvas.width=1;window._scanlineCanvas.height=3;
    const sctx=window._scanlineCanvas.getContext('2d');
    sctx.clearRect(0,0,1,3);
    sctx.fillStyle='rgba(0,0,0,0.35)';
    sctx.fillRect(0,2,1,1);
    window._crtGlitch=0;window._crtGlitchTimer=0;
  }
  // Random glitch surges — brief moments of heavy scanlines
  if(window._crtGlitchTimer>0){window._crtGlitchTimer--;window._crtGlitch*=0.92;}
  else if(Math.random()<0.002){window._crtGlitch=0.1+Math.random()*0.15;window._crtGlitchTimer=6+Math.floor(Math.random()*12);}
  const _crtBase=0.03+Math.sin(performance.now()*0.0008)*0.01;
  const _crtAlpha=Math.min(0.15,_crtBase+window._crtGlitch);
  ctx.save();ctx.globalAlpha=_crtAlpha;ctx.fillStyle=ctx.createPattern(window._scanlineCanvas,'repeat');
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // Glitch: horizontal color shift band
  if(window._crtGlitch>0.15){
    const gy=Math.random()*canvas.height,gh=4+Math.random()*12;
    ctx.globalAlpha=window._crtGlitch*0.4;ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=Math.random()>0.5?'rgba(0,255,255,0.15)':'rgba(255,0,255,0.15)';
    ctx.fillRect(Math.random()*6-3,gy,canvas.width,gh);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();

  // Spectating text
  if(lp2&&!lp2.alive&&gameState==='playing'){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,canvas.width,40);ctx.fillStyle='#f04040';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText('SPECTATING',canvas.width/2,26);}

  // F9 debug overlay: show raw lightCanvas in corner
  if (debugLighting && glReady) {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    const dbgH = 150, dbgW = dbgH * lightCanvas.width / lightCanvas.height;
    ctx.drawImage(lightCanvas, 10, canvas.height - dbgH - 10, dbgW, dbgH);
    ctx.strokeStyle = '#ff0'; ctx.lineWidth = 1;
    ctx.strokeRect(10, canvas.height - dbgH - 10, dbgW, dbgH);
    ctx.fillStyle = '#ff0'; ctx.font = '10px monospace';
    ctx.fillText('LIGHT MAP ' + lightCanvas.width + 'x' + lightCanvas.height, 14, canvas.height - dbgH - 14);
    ctx.restore();
  }

  if(isMobile&&gameState==='playing')renderJoysticks();
  renderMinimap();
}

function renderJoysticks(){
  if(leftJoystick.active){
    ctx.shadowColor='#0ff';ctx.shadowBlur=10;
    ctx.globalAlpha=0.2;ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(leftJoystick.cx,leftJoystick.cy,JOYSTICK_LEFT_MAX,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.15;ctx.fillStyle='#0a0a1a';ctx.beginPath();ctx.arc(leftJoystick.cx+leftJoystick.dx,leftJoystick.cy+leftJoystick.dy,18,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.5;ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;}
  if(rightJoystick.active){const jColor=rightJoystick.firing?'#f44':rightJoystick.aiming?'#ff0':'#0ff';
    ctx.shadowColor=jColor;ctx.shadowBlur=10;
    ctx.globalAlpha=0.2;ctx.strokeStyle=jColor;ctx.lineWidth=2;ctx.beginPath();ctx.arc(rightJoystick.cx,rightJoystick.cy,JOYSTICK_RIGHT_MAX,0,Math.PI*2);ctx.stroke();
    // Fire threshold ring
    ctx.globalAlpha=0.15;ctx.strokeStyle='#f44';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(rightJoystick.cx,rightJoystick.cy,JOYSTICK_RIGHT_MAX*0.65,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=0.15;ctx.fillStyle='#0a0a1a';ctx.beginPath();ctx.arc(rightJoystick.cx+rightJoystick.dx,rightJoystick.cy+rightJoystick.dy,20,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.5;ctx.strokeStyle=jColor;ctx.lineWidth=2;ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;}
}

function renderMinimap(){
  const _mmH=ARENA_H;
  const mw=minimapCanvas.width,mh=minimapCanvas.height,sx=mw/ARENA_W,sy=mh/_mmH;
  minimapCtx.clearRect(0,0,mw,mh);minimapCtx.fillStyle='#0a0a0a';minimapCtx.fillRect(0,0,mw,mh);
  if(dungeonGrid){const cw=Math.max(1,Math.ceil(CELL_SIZE*sx)),ch=Math.max(1,Math.ceil(CELL_SIZE*sy));for(let y=0;y<GRID_H;y++)for(let x=0;x<GRID_W;x++){
    const px=Math.floor(x*CELL_SIZE*sx),py=Math.floor(y*CELL_SIZE*sy);
    if(dungeonGrid[y][x]){
      // Floor — match main map room/corridor colors
      minimapCtx.fillStyle='#333';minimapCtx.fillRect(px,py,cw,ch);
    } else {
      // Wall — only draw if adjacent to a floor cell
      let border=false;
      if(y>0&&dungeonGrid[y-1][x])border=true;
      if(!border&&y<GRID_H-1&&dungeonGrid[y+1][x])border=true;
      if(!border&&x>0&&dungeonGrid[y][x-1])border=true;
      if(!border&&x<GRID_W-1&&dungeonGrid[y][x+1])border=true;
      if(border){minimapCtx.fillStyle='#5a5040';minimapCtx.fillRect(px,py,cw,ch);}
    }
  }}
  // Zombies intentionally NOT shown on minimap
  for(const pk of pickups){
    if(pk.type==='weapon'){
      // Weapons: larger pulsing diamond
      const pulse=2+Math.sin(gameTime*0.1)*1;
      minimapCtx.fillStyle='#f0c040';
      minimapCtx.save();minimapCtx.translate(pk.x*sx,pk.y*sy);minimapCtx.rotate(Math.PI/4);
      minimapCtx.fillRect(-pulse,-pulse,pulse*2,pulse*2);
      minimapCtx.restore();
    } else {
      minimapCtx.fillStyle=pk.type==='health'?'#4f4':pk.type==='ammo'?'#fa0':'#4f4';
      minimapCtx.fillRect(pk.x*sx-1,pk.y*sy-1,3,3);
    }
  }
  for(const p of players){if(!p.alive)continue;minimapCtx.fillStyle=p.color;minimapCtx.fillRect(p.x*sx-2,p.y*sy-2,4,4);}
  // Horde defend circle on minimap
  if(gameMode==='horde'){
    const claimR=Math.min(1,hordeCircleTimer/HORDE_CIRCLE_CLAIM_TIME);
    const mcr=Math.floor(claimR<0.5?claimR*2*255:255),mcg=Math.floor(claimR<0.5?255:(1-(claimR-0.5)*2)*255),mcb=Math.floor(claimR<0.3?(1-claimR/0.3)*255:0);
    minimapCtx.strokeStyle=`rgb(${mcr},${mcg},${mcb})`;minimapCtx.lineWidth=2;
    minimapCtx.beginPath();minimapCtx.arc(hordeCircleCx*sx,hordeCircleCy*sy,HORDE_CIRCLE_RADIUS*sx,0,Math.PI*2);minimapCtx.stroke();
  }
  // Exit on minimap
  if(exitPos){const ep=0.7+Math.sin(gameTime*0.08)*0.3;minimapCtx.fillStyle=`rgba(0,255,255,${ep})`;minimapCtx.beginPath();minimapCtx.arc(exitPos.x*sx,exitPos.y*sy,4,0,Math.PI*2);minimapCtx.fill();}
  minimapCtx.strokeStyle='rgba(255,255,255,0.2)';minimapCtx.lineWidth=1;minimapCtx.strokeRect((camera.x-canvas.width/2)*sx,(camera.y-canvas.height/2)*sy,canvas.width*sx,canvas.height*sy);
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(){update();render();requestAnimationFrame(gameLoop);}
// Start menu music on first user interaction
document.addEventListener('click', function startMenuMusic() {
  initAudio(); loadSfx();
  setTimeout(() => playMusic('music_menu', 3.0), 1500);
  document.removeEventListener('click', startMenuMusic);
}, { once: true });
document.addEventListener('touchstart', function startMenuMusicTouch() {
  initAudio(); loadSfx();
  setTimeout(() => playMusic('music_menu', 3.0), 1500);
  document.removeEventListener('touchstart', startMenuMusicTouch);
}, { once: true });
// Keep audio alive on iOS — resume on every touch (iOS suspends on background/lock)
document.addEventListener('touchstart', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { passive: true });
// PWA install prompt
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); _deferredInstallPrompt = e;
  const ip = document.getElementById('install-prompt'); if (ip) ip.style.display = 'block';
});
addBtn('btn-install', () => {
  if (_deferredInstallPrompt) { _deferredInstallPrompt.prompt(); _deferredInstallPrompt.userChoice.then(() => { _deferredInstallPrompt = null; const ip = document.getElementById('install-prompt'); if (ip) ip.style.display = 'none'; }); }
  else {
    // iOS doesn't support beforeinstallprompt — show manual instructions
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isIOS) alert('Tap the Share button (↑) then "Add to Home Screen"');
    else alert('Open browser menu (⋮) then "Add to Home Screen" or "Install App"');
  }
});
// Show install button on all mobile devices (not when already installed as PWA)
if (isMobile && !window.navigator.standalone && !window.matchMedia('(display-mode: standalone)').matches) {
  const ip = document.getElementById('install-prompt'); if (ip) ip.style.display = 'block';
}

gameLoop();
</script>
